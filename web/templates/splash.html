<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3f3c">
  <title>{{ institution_name }} | نظام تسيير و محاسبة العتاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Cairo","Tajawal",Tahoma,sans-serif}
    body{min-height:100vh;color:#f7f7f1;background:radial-gradient(ellipse at 74% 42%,rgba(112,172,132,.22),transparent 34%),linear-gradient(132deg,#092f2c 0%,#0b4943 54%,#102d2a 100%);overflow-x:hidden}
    .splash{position:relative;isolation:isolate;display:flex;min-height:100vh;flex-direction:column;align-items:center;padding:30px 22px 24px;text-align:center;overflow:hidden}
    .splash:before{content:"";position:absolute;z-index:-1;inset:auto -10% -30% -10%;height:55%;border-top:1px solid rgba(211,228,208,.12);border-radius:50%;transform:rotate(-5deg);box-shadow:0 -28px 0 rgba(211,228,208,.025),0 -58px 0 rgba(211,228,208,.018)}
    .splash:after{content:"";position:absolute;z-index:-1;width:min(66vw,560px);aspect-ratio:1;inset-inline-start:-250px;top:22%;border:1px solid rgba(232,239,221,.055);border-radius:50%;box-shadow:inset 0 0 0 22px rgba(232,239,221,.012),inset 0 0 0 66px rgba(232,239,221,.012),0 0 0 66px rgba(232,239,221,.012),0 0 0 132px rgba(232,239,221,.009)}
    .topline{display:flex;align-items:center;gap:16px;width:min(100%,1020px);color:#d9e7d8;font-size:14px;font-weight:600;letter-spacing:.06em}.topline:before,.topline:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(212,183,121,.72))}.topline:after{transform:scaleX(-1)}
    .institution{max-width:100%;margin:52px 0 0;color:#fff;font-size:clamp(34px,5vw,58px);line-height:1.35;font-weight:800;text-shadow:0 4px 28px rgba(0,0,0,.2);overflow-wrap:anywhere}
    .emblem{display:grid;place-items:center;width:154px;height:154px;margin:28px 0 22px;border:1px solid rgba(216,189,124,.72);border-radius:50%;background:rgba(255,255,255,.045);box-shadow:0 0 0 12px rgba(255,255,255,.018),0 18px 55px rgba(0,0,0,.16);overflow:hidden}
    .emblem img{width:100%;height:100%;object-fit:contain;padding:13px}.emblem-fallback{position:relative;width:92px;height:92px;border:2px solid rgba(231,215,172,.82);border-radius:50%;display:grid;place-items:center;color:#e8cf93;font-size:39px}.emblem-fallback:before,.emblem-fallback:after{position:absolute;content:"";background:#e8cf93;opacity:.76}.emblem-fallback:before{width:68px;height:2px}.emblem-fallback:after{width:2px;height:68px}
    h1{margin:0;font-size:clamp(27px,4vw,42px);line-height:1.5;font-weight:700;color:#f7f7f1}.description{max-width:760px;min-height:34px;margin:12px 0 0;color:#c6d8ce;font-size:clamp(16px,2vw,21px);line-height:1.9;white-space:pre-line}
    .gold-rule{width:min(280px,55vw);height:1px;margin:24px 0;background:linear-gradient(90deg,transparent,#d4b779,transparent)}
    .start{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:180px;margin-top:12px;padding:12px 26px;border:1px solid rgba(233,215,170,.8);border-radius:8px;background:linear-gradient(135deg,#d7bf85,#bea366);color:#173b34;text-decoration:none;font-size:16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.16);transition:transform .16s ease,filter .16s ease}.start:hover{transform:translateY(-2px);filter:brightness(1.06)}.start:focus-visible{outline:3px solid #fff;outline-offset:4px}
    footer{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;margin-top:auto;padding-top:28px;color:#c1d2c5;font-size:13px}.version{color:#9fb6a8}
    @media(max-width:600px){.splash{padding:22px 16px 18px}.topline{font-size:11px;letter-spacing:0}.institution{margin-top:38px}.emblem{width:126px;height:126px;margin:22px 0 18px}.emblem-fallback{width:74px;height:74px;font-size:32px}.emblem-fallback:before{width:54px}.emblem-fallback:after{height:54px}footer{padding-top:22px}}
    @media(prefers-reduced-motion:reduce){.start{transition:none}}
  </style>
</head>
<body>
  <main class="splash">
    <div class="topline">تسيير ومحاسبة العتاد</div>
    <p class="institution">{{ institution_name }}</p>
    <div class="emblem" role="img" aria-label="شعار المؤسسة">
      {% if logo_url %}<img src="{{ logo_url }}" alt="شعار {{ institution_name }}">{% else %}<span class="emblem-fallback" aria-hidden="true">✦</span>{% endif %}
    </div>
    <h1>نظام تسيير و محاسبة العتاد</h1>
    <p class="description">{{ description }}</p>
    <div class="gold-rule" aria-hidden="true"></div>
    <a class="start" href="{{ continue_url }}">الدخول إلى البرنامج <span aria-hidden="true">←</span></a>
    <footer><span>تطوير: {{ developer_name }}</span><span class="version">الإصدار {{ version }}</span></footer>
  </main>
</body>
</html>
