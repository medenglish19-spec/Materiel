/* --- global table rules -------------------------------------------------- */
.app-main table,.mdx table{
  width:max-content;
  min-width:100%;
  table-layout:auto;
}
.app-main table th,.app-main table td,.mdx table th,.mdx table td{

}

  color:#111;
}
.app-main table td>a:not(.btn),.mdx table td>a:not(.btn){

}

  text-align:center!important;
  font-variant-numeric:tabular-nums;
}

.materiel-notice-inline{position:static;width:auto;max-height:none;overflow:visible;margin:0 0 16px;padding:14px 16px;opacity:1;transform:none;transition:none}

/* Materiel responsive UI standard: the page reflows; only genuinely wide tables scroll. */
html,body{max-width:100%;}
body{overflow-x:clip;}
.app-main,.container,main.container{min-width:0;max-width:100%;box-sizing:border-box;}
.app-main > *, .container > *{min-width:0;max-width:100%;box-sizing:border-box;}
.app-topbar{min-width:0;flex-wrap:wrap;}
.app-topbar-title{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.table-scroll{width:100%;max-width:100%;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.table-scroll:focus{outline:2px solid var(--primary-light);outline-offset:2px;}
.record-table-wrap{width:100%;max-width:100%;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.record-table-wrap:focus{outline:2px solid var(--primary-light);outline-offset:2px}
.table-scroll > table{max-width:none;}
.table-scroll th,.table-scroll td{overflow-wrap:anywhere;}
.table-scroll .nowrap{white-space:nowrap;overflow-wrap:normal;}
@media(max-width:700px){
  .app-topbar{margin-bottom:12px;border-radius:0;padding:8px 12px;}
  .app-topbar-title{font-size:11px;flex:1 1 120px;}
  .app-workbar{flex:0 1 auto;min-width:0;}
}


/* Small-screen refinement: keep controls usable without page-level horizontal scrolling. */
@media(max-width:480px){
  .app-menu{gap:3px;padding:5px;}
  .app-menu a{min-height:32px;height:32px;padding:6px 7px;font-size:10px;}
  .app-menu a .menu-icon{width:16px;font-size:14px;}
  .container{padding:0 8px;}
  .page-header{margin-bottom:12px;gap:8px;}
  .page-header h2{font-size:18px;}
  .page-hint{font-size:11px;}
  .card,.stat-card{padding:14px;margin-bottom:12px;}
  .toolbar{padding:10px;gap:7px;margin-bottom:12px;}
  .search-box{min-width:0;flex:1 1 100%;width:100%;box-sizing:border-box;}
  .select-box{min-width:0;max-width:100%;width:100%;box-sizing:border-box;}
  .grid-form{grid-template-columns:minmax(0,1fr);gap:10px;}
  .field input,.field select,.field textarea{box-sizing:border-box;width:100%;max-width:100%;}
  .module-nav{gap:4px;padding:7px;margin-bottom:12px;}
  .module-nav a{padding:6px 8px;font-size:10px;}
  .btn{max-width:100%;box-sizing:border-box;padding:9px 12px;font-size:12px;}
  .equipment-card-actions{flex-wrap:wrap;}
  .equipment-card-actions .btn{flex:1 1 auto;min-width:0;}
  .data-table,.modern-table{font-size:12px;}
  .data-table th,.modern-table thead th,
  .data-table td,.modern-table td{padding:9px 10px;}
}
@media(max-width:375px){
  .app-menu a{padding:5px 6px;font-size:9px;}
  .app-menu a .menu-icon{width:14px;font-size:13px;}
  .app-topbar{padding:7px 9px;}
  .app-topbar-title{font-size:10px;}
  .app-workbtn{padding:0 6px;font-size:9px;}
  .container{padding:0 6px;}
  .card,.stat-card{padding:12px;}
  .page-header h2{font-size:17px;}
}

<div class="app-main"><header class="app-topbar"><span class="app-topbar-title">تسيير ومحاسبة العتاد</span><div class="app-workbar" aria-label="أدوات التحرير"><button type="button" class="app-workbtn" data-em-action="undo" aria-label="تراجع" title="تراجع" disabled>↶ <span>تراجع</span></button><button type="button" class="app-workbtn" data-em-action="redo" aria-label="إعادة" title="إعادة" disabled>↷ <span>إعادة</span></button><span class="app-worksep"></span><button type="button" class="app-workbtn app-work-save" data-em-action="save" aria-label="حفظ" title="حفظ" disabled>💾 <span>حفظ</span></button><span id="emStatus" class="app-work-status" data-state="clean">نظيف</span></div><span class="app-topbar-date" id="systemDate"></span></header><main class="container">{% block content %}{% endblock %}</main></div>
<script>
(function(){
const el=document.getElementById('systemDate');if(el){el.textContent=new Intl.DateTimeFormat('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date())}
let dismissMaterielNotice=null;
window.showMaterielNotice=function(message,type='warning'){
  const kind=['warning','danger','info','success'].includes(type)?type:'warning';
  if(kind!=='warning'&&kind!=='danger')return;
  if(dismissMaterielNotice)dismissMaterielNotice();
  const previousFocus=document.activeElement;
  const backdrop=document.createElement('div');backdrop.className='materiel-notice-backdrop';
  const box=document.createElement('section');box.className='materiel-notice materiel-notice-'+kind;box.setAttribute('role','alertdialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label',kind==='danger'?'رسالة خطأ':'رسالة تحذير');
  const iconEl=document.createElement('span');iconEl.className='materiel-notice-icon';iconEl.setAttribute('aria-hidden','true');iconEl.textContent=kind==='danger'?'⛔':'⚠️';
  const content=document.createElement('div');content.className='materiel-notice-content';
  const title=document.createElement('strong');title.className='materiel-notice-title';title.textContent=kind==='danger'?'خطأ':'تنبيه';
  const textEl=document.createElement('div');textEl.className='materiel-notice-text';textEl.textContent=String(message||'تعذر تنفيذ العملية. حاول مرة أخرى.');content.append(title,textEl);
  const close=document.createElement('button');close.type='button';close.className='materiel-notice-close';close.setAttribute('aria-label','إغلاق');close.textContent='×';box.append(iconEl,content,close);backdrop.append(box);document.body.append(backdrop);
  const dismiss=()=>{backdrop.remove();document.removeEventListener('keydown',onKeyDown);if(dismissMaterielNotice===dismiss)dismissMaterielNotice=null;if(previousFocus&&previousFocus.isConnected&&typeof previousFocus.focus==='function')previousFocus.focus()};
  dismissMaterielNotice=dismiss;
  const onKeyDown=event=>{if(event.key==='Escape'){event.preventDefault();dismiss()}else if(event.key==='Tab'){event.preventDefault();close.focus()}};
  close.addEventListener('click',dismiss);backdrop.addEventListener('click',event=>{if(event.target===backdrop)dismiss()});document.addEventListener('keydown',onKeyDown);
  window.setTimeout(()=>{backdrop.classList.add('materiel-notice-backdrop-visible');box.classList.add('materiel-notice-visible');close.focus()},20);
};
const params=new URLSearchParams(window.location.search);const notice=params.get('notice');const noticeType=params.get('notice_type')||'warning';if(notice){if(noticeType==='warning'||noticeType==='danger'){window.showMaterielNotice(notice,noticeType)}else{const box=document.createElement('div');box.className='materiel-notice materiel-notice-inline materiel-notice-'+(noticeType==='success'?'success':'info');const icon=noticeType==='success'?'✓':'ℹ️';const iconEl=document.createElement('span');iconEl.className='materiel-notice-icon';iconEl.textContent=icon;const textEl=document.createElement('div');textEl.className='materiel-notice-text';textEl.textContent=notice;box.append(iconEl,textEl);const main=document.querySelector('.container');if(main)main.prepend(box)}const clean=new URL(window.location.href);clean.searchParams.delete('notice');clean.searchParams.delete('notice_type');window.history.replaceState({},'',clean.toString())}
const mutationKey='materiel:mutation-completed';document.querySelectorAll('form[method="post"]').forEach(form=>{form.setAttribute('autocomplete','off');form.addEventListener('submit',()=>sessionStorage.setItem(mutationKey,'1'))});if(sessionStorage.getItem(mutationKey)==='1'){sessionStorage.removeItem(mutationKey)}window.addEventListener('pageshow',e=>{if(e.persisted)window.location.reload()});
const searchSelector='input[type="search"],input.search-box,input[id*="search" i],input[id*="Search"]';
document.querySelectorAll(searchSelector).forEach(input=>{
  if(input.closest('.global-search-wrap')||input.type==='hidden')return;
  const parent=input.parentElement;if(!parent)return;
  const wrap=document.createElement('span');wrap.className='global-search-wrap';
  parent.insertBefore(wrap,input);wrap.appendChild(input);
  const search=document.createElement('button');search.type='button';search.className='global-search-btn';search.textContent='ابحث';search.setAttribute('aria-label','تنفيذ البحث');
  const clear=document.createElement('button');clear.type='button';clear.className='global-clear-btn';clear.textContent='إلغاء';clear.hidden=!input.value;
  wrap.append(search,clear);
  const fire=()=>input.dispatchEvent(new Event('input',{bubbles:true}));
  const runSearch=()=>{
    fire();
    const form=input.closest('form');
    const name=(input.name+' '+input.id+' '+input.getAttribute('aria-label')+' '+input.placeholder).toLowerCase();
    const serverSearch=form&&form.method.toLowerCase()==='get'&&(/search|query|بحث|filter|تصفية/.test(name)||input.type==='search');
    if(serverSearch){
      if(typeof form.requestSubmit==='function')form.requestSubmit();
      else form.submit();
    }
  };
  search.addEventListener('click',runSearch);
  input.addEventListener('keydown',event=>{
    if(event.key!=='Enter'||event.isComposing)return;
    event.preventDefault();
    search.click();
  });
  clear.addEventListener('click',()=>{input.value='';clear.hidden=true;fire();input.dispatchEvent(new Event('change',{bubbles:true}))});
  input.addEventListener('input',()=>clear.hidden=!input.value);
});
(function installEnterNavigation(){
  const excludedTypes=new Set(['hidden','button','submit','reset','image','file','checkbox','radio','range','color']);
  const isEditable=el=>el instanceof HTMLElement&&(el.isContentEditable||el.matches('textarea'));
  const isInput=el=>el instanceof HTMLInputElement&&!excludedTypes.has(el.type)&&!el.readOnly;
  const isUsable=el=>el instanceof HTMLElement&&!el.matches(':disabled,[hidden],[aria-hidden="true"]')&&!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length);
  const isNextControl=el=>isInput(el)||el instanceof HTMLSelectElement||isEditable(el)||(el instanceof HTMLButtonElement&&(el.type==='submit'||el.hasAttribute('data-enter-next')));
  document.addEventListener('keydown',event=>{
    if(event.key!=='Enter'||event.defaultPrevented||event.isComposing||event.shiftKey||event.ctrlKey||event.metaKey||event.altKey)return;
    const current=event.target;
    if(!(current instanceof HTMLElement)||!(isInput(current)||current instanceof HTMLSelectElement)||(current instanceof HTMLInputElement&&current.type==='search')||current.closest('.global-search-wrap')||current.hasAttribute('data-enter-native'))return;
    if(current.closest('[contenteditable="true"],textarea'))return;
    const form=current.closest('form');
    const scope=form||current.closest('[data-enter-scope],.grid-form,.tire-form,.toolbar,.card,.panel');
    if(!scope)return;
    const controls=[...scope.querySelectorAll('input,select,textarea,button,[contenteditable="true"]')].filter(el=>isUsable(el)&&isNextControl(el));
    const index=controls.indexOf(current);
    if(index<0)return;
    event.preventDefault();
    const next=controls[index+1];
    if(next){
      if(next instanceof HTMLButtonElement&&next.hasAttribute('data-enter-next')){next.click();return}
      if(next instanceof HTMLButtonElement&&next.type==='submit'){if(form&&form.checkValidity())form.requestSubmit(next);else if(form)form.reportValidity();else next.click();return}
      next.focus();return;
    }
    if(form){
      if(form.checkValidity())form.requestSubmit();
      else form.reportValidity();
      return;
    }
    const operation=current.closest('[data-enter-scope],.grid-form,.tire-form,.toolbar,.card,.panel');
    const action=operation?.querySelector('[data-enter-next]');
    if(action instanceof HTMLElement&&isUsable(action))action.click();
  });
})();
document.querySelectorAll('.table-scroll,.record-table-wrap,.table-wrap,.type-table-wrap').forEach(function(el){if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');if(!el.hasAttribute('role'))el.setAttribute('role','region');if(!el.getAttribute('aria-label'))el.setAttribute('aria-label','جدول البيانات');});
/* Global UI rule: every action menu closes on any left click outside the open menu.
   This is intentionally owned by the shared base template so the rule applies to every module,
   including tree-generated menus that stop propagation inside their own handlers. */
document.addEventListener('click',function(event){
  document.querySelectorAll('details.action-menu[open]').forEach(function(menu){
    if(!menu.contains(event.target)) menu.removeAttribute('open');
  });
  document.querySelectorAll('.master-context-menu:not([hidden])').forEach(function(menu){
    if(!menu.contains(event.target) && !event.target.closest('[data-action-menu]')){
      menu.hidden=true;
      menu.replaceChildren();
    }
  });
},true);
/* Global keyboard rule: Escape always exits an active editor from anywhere on its page. */
document.addEventListener('keydown',function(event){
  if(event.key!=='Escape'||event.repeat)return;
  const active=document.activeElement;
  const modal=active?.closest?.('.modal.open,.maintenance-edit-modal.open,[role="dialog"]');
  const openMenu=active?.closest?.('details.action-menu[open],.master-context-menu:not([hidden])');
  if(openMenu){
    if(openMenu.matches('details.action-menu[open]')) openMenu.removeAttribute('open');
    else {openMenu.hidden=true;openMenu.replaceChildren()}
    event.preventDefault();
    return;
  }
  /* First prefer the editor containing focus; otherwise locate the page editor
     itself. An editor must contain a real editable field in addition to its
     save/cancel controls; this prevents Escape from hijacking ordinary list,
     filter, or display pages that happen to contain a form. */
  const isEditorForm=function(form){
    if(!form)return false;
    const hasEditable=[...form.querySelectorAll('input,select,textarea,[contenteditable="true"]')].some(function(el){
      return !ignoredEscapeControl(el);
    });
    const hasSubmit=!!form.querySelector('button[type="submit"],input[type="submit"]');
    const hasCancel=[...form.querySelectorAll('a,button,[role="button"]')].some(function(el){
      if(el.disabled||el.getAttribute('aria-disabled')==='true')return false;
      const text=(el.textContent||'').trim();
      return /^(إلغاء|الغاء|cancel|رجوع|عودة)$/i.test(text)||el.matches('.cancel-btn,[id*="cancel" i],[data-cancel-action]');
    });
    return hasEditable&&hasSubmit&&hasCancel;
  };
  const ignoredEscapeControl=function(el){
    if(!el||el.disabled)return true;
    if(el.matches('input[type="hidden"],input[type="password"],input[type="file"],input[type="button"],input[type="submit"]'))return true;
    const hint=(el.name||'')+' '+(el.id||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.placeholder||'');
    return /(^|[-_ ])(search|filter|query|بحث|تصفية)([-_ ]|$)/i.test(hint);
  };
  let scope=modal||(isEditorForm(active?.closest?.('form'))?active.closest('form'):null);
  if(!scope){
    scope=[...document.querySelectorAll('form')].find(isEditorForm);
  }
  if(!scope)return;
  const cancel=[...scope.querySelectorAll('a,button,[role="button"]')].find(function(el){
    if(el.disabled||el.getAttribute('aria-disabled')==='true')return false;
    const text=(el.textContent||'').trim();
    return /^(إلغاء|الغاء|cancel|رجوع|عودة)$/i.test(text)||el.matches('.cancel-btn,[id*="cancel" i],[data-cancel-action]');
  });
  if(!cancel)return;
  event.preventDefault();
  const dirty=typeof window.EditManager?.isDirty==='function'&&window.EditManager.isDirty();
  if(dirty&&!window.confirm('لديك تعديلات غير محفوظة. هل تريد الخروج دون حفظها؟'))return;
  cancel.click();
},true);
const p=window.location.pathname;
const main=document.querySelector('.container');
let pageHeading=main&&main.querySelector('h1,h2');
if(pageHeading&&pageHeading.tagName.toLowerCase()==='h2'){
  const semanticHeading=document.createElement('h1');

  semanticHeading.innerHTML=pageHeading.innerHTML;

}
if(pageHeading)pageHeading.classList.add('page-title');
const moduleNavigation=(function(){
  if(p==='/spare-parts'||p.startsWith('/spare-parts-requests')||p.startsWith('/spare-parts-received')||p.startsWith('/spare-parts-distribution')||p.startsWith('/spare-parts-return')||p.startsWith('/spare-parts-history/'))return {label:'تنقل وحدة الغيار',links:[['/spare-parts','قطع الغيار'],['/spare-parts-requests','الطلبات'],['/spare-parts-received','الاستلام'],['/spare-parts-distribution','التوزيع'],['/spare-parts-return','الإرجاع']]};
  if(p.startsWith('/equipment')||p.startsWith('/equipment-types'))return {label:'تنقل وحدة العتاد',links:[['/equipment','قائمة العتاد'],['/equipment/numerical-status','الحالة العددية'],['/equipment/analysis','تحليل القدرة والجاهزية'],['/equipment/analysis/operational','التحليل التشغيلي'],['/equipment-types','أنواع وطرازات العتاد'],['/equipment-types/structure','هيكلة الأنواع والطرازات']]};
  if(p==='/maintenance'||p.startsWith('/maintenance/'))return {label:'تنقل وحدة الصيانة',links:[['/maintenance','لوحة الصيانة'],['/maintenance/periodic','الصيانة الدورية'],['/maintenance/rules','عمليات الصيانة'],['/maintenance/plans','خطط الصيانة'],['/maintenance/records','سجل الصيانة'],['/maintenance/due','الصيانة المستحقة']]};
  if(p==='/faults-repairs'||p.startsWith('/faults-repairs/'))return {label:'تنقل وحدة الأعطال والإصلاحات',links:[['/faults-repairs','لوحة الوحدة'],['/faults-repairs/faults','سجل الأعطال'],['/faults-repairs/repairs','التصليحات'],['/faults-repairs/technicians','الفنيون'],['/faults-repairs/analytics','التحليلات']]};
  if(p==='/tires'||p.startsWith('/tires/'))return {label:'تنقل وحدة الإطارات',links:[['/tires','إدارة الإطارات'],['/tires/inventory','المخزون'],['/tires/settings','الإعدادات']]};
  if(p==='/batteries'||p.startsWith('/batteries/'))return {label:'تنقل وحدة البطاريات',links:[['/batteries','إدارة البطاريات'],['/batteries/settings','الإعدادات']]};
  if(p==='/meter-readings'||p.startsWith('/meter-readings/'))return {label:'تنقل وحدة قراءات العدادات',links:[['/','الرئيسية'],['/equipment','قائمة العتاد'],['/meter-readings','قراءات العدادات'],['/meter-readings/operations','سجل العمليات']]};
  return null;
})();
if(main&&moduleNavigation){
  let nav=main.querySelector('.module-nav,.module-tabs,.tires-nav,.navigation-actions,.fr-head .actions');
  if(!nav)nav=document.createElement('nav');
  else if(nav.tagName.toLowerCase()!=='nav'){
    const semanticNav=document.createElement('nav');
    semanticNav.className=nav.className;
    while(nav.firstChild)semanticNav.appendChild(nav.firstChild);
    nav.replaceWith(semanticNav);
    nav=semanticNav;
  }
  nav.classList.remove('module-tabs','tires-nav','navigation-actions','actions');
  nav.classList.add('module-nav');
  nav.setAttribute('role','navigation');
  nav.setAttribute('aria-label',moduleNavigation.label);
  moduleNavigation.links.forEach(function(item){
    const href=item[0],label=item[1];
    const existing=Array.from(nav.querySelectorAll('a')).find(function(link){return new URL(link.href,window.location.href).pathname===href});
    if(existing){existing.textContent=label}
    else{const link=document.createElement('a');link.href=href;link.textContent=label;nav.appendChild(link)}
  });
  const links=Array.from(nav.querySelectorAll('a'));
  const matching=links.filter(function(link){const href=new URL(link.href,window.location.href).pathname;return p===href||(href!=='/'&&p.startsWith(href+'/'))});
  const active=matching.sort(function(a,b){return new URL(b.href,window.location.href).pathname.length-new URL(a.href,window.location.href).pathname.length})[0];
  links.forEach(function(link){const selected=link===active;link.classList.toggle('active',selected);if(selected)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
  if(p.startsWith('/spare-parts-history/')){const requests=links.find(function(link){return new URL(link.href,window.location.href).pathname==='/spare-parts-requests'});if(requests){if(active)active.classList.remove('active');requests.classList.add('active');requests.setAttribute('aria-current','page')}}
  const headerBlock=pageHeading&&pageHeading.closest('header,.page-header,.page-top,.dashboard-head,.meter-head,.tires-top,.battery-top,.equip-head,.fr-head,.mdx-head,.record-hero,.settings-hero,.head,.top');
  let insertionPoint=headerBlock||pageHeading&&pageHeading.parentElement||main.firstElementChild;
  if(headerBlock){
    const primaryActions=Array.from(main.querySelectorAll('.main-actions,.primary-actions,.page-actions'))
      .find(function(actions){return actions.parentElement===headerBlock.parentElement&&headerBlock.compareDocumentPosition(actions)&Node.DOCUMENT_POSITION_FOLLOWING});
    if(primaryActions)insertionPoint=primaryActions;
  }
  if(insertionPoint&&insertionPoint.parentNode)insertionPoint.parentNode.insertBefore(nav,insertionPoint.nextSibling);
  else if(main.firstElementChild!==nav)main.prepend(nav);
}
if(main){
  const mobileFilterBreakpoint=window.matchMedia('(max-width:700px)');
  main.querySelectorAll('[data-mobile-filter-collapse]').forEach(function(toolbar){
    if(toolbar.dataset.mobileFilterReady)return;
    const fields=Array.from(toolbar.querySelectorAll(':scope > select'));
    if(fields.length<2)return;
    toolbar.dataset.mobileFilterReady='1';
    let details=null,summary=null,body=null,markers=[],manuallyToggled=false,preferredOpen=false;
    function updateSummary(){
      const active=fields.filter(function(field){return field.value!==''}).length;
      if(summary)summary.textContent=active?'فلاتر إضافية ('+active+')':'فلاتر إضافية';
    }
    function mountDisclosure(){
      if(details)return;
      markers=fields.map(function(field){const marker=document.createComment('filter-field');field.parentNode.insertBefore(marker,field);return marker});
      details=document.createElement('details');
      details.className='mobile-extra-filters';
      summary=document.createElement('summary');
      body=document.createElement('div');
      body.className='mobile-extra-filters-body';
      fields.forEach(function(field){body.appendChild(field)});
      details.append(summary,body);
      toolbar.insertBefore(details,markers[0]);
      details.addEventListener('toggle',function(){if(mobileFilterBreakpoint.matches){preferredOpen=details.open;manuallyToggled=true}});
      updateSummary();
    }
    function removeDisclosure(){
      if(!details)return;
      fields.forEach(function(field,index){const marker=markers[index];marker.parentNode.insertBefore(field,marker.nextSibling);marker.remove()});
      details.remove();details=null;summary=null;body=null;markers=[];
    }
    function syncDisclosure(){
      if(!mobileFilterBreakpoint.matches){removeDisclosure();return}
      mountDisclosure();
      const active=fields.some(function(field){return field.value!==''});
      details.open=manuallyToggled?preferredOpen:active;
      updateSummary();
    }
    fields.forEach(function(field){field.addEventListener('change',updateSummary)});
    mobileFilterBreakpoint.addEventListener('change',syncDisclosure);
    syncDisclosure();
  });
}
if(p==='/equipment/numerical-status'){const table=document.getElementById('numericalStatusTable');if(table){const heads=[...table.querySelectorAll('thead th')];const idx=heads.findIndex(h=>h.textContent.includes('% من الأب'));if(idx>=0){heads[idx].remove();table.querySelectorAll('tbody tr').forEach(r=>{if(r.children.length>idx)r.children[idx].remove()})}}}
const brandSelect=document.getElementById('statusBrand');if(brandSelect){const current=brandSelect.value;fetch('/api/equipment-brands',{headers:{Accept:'application/json'},credentials:'same-origin'}).then(r=>r.ok?r.json():[]).then(brands=>{const names=[...new Set((Array.isArray(brands)?brands:[]).map(b=>String(b.name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));brandSelect.innerHTML='<option value="">كل الماركات</option>';names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;brandSelect.appendChild(o)});brandSelect.value=names.includes(current)?current:'';brandSelect.dispatchEvent(new Event('change',{bubbles:true}))}).catch(()=>{})}
})();
</script>
<script>
(function(){
  function markNumericCells(root){
    const cells=(root||document).querySelectorAll('table tbody td');
    const numeric=/^[+\-−]?\s*(?:\d[\d\s,.]*|[٠-٩][٠-٩\s،.]*)(?:\s*%?)$/;
    cells.forEach(function(td){
      const text=(td.textContent||'').trim();
      if(text && numeric.test(text)) td.classList.add('numeric-cell');
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){markNumericCells();});
  else markNumericCells();
  new MutationObserver(function(mutations){
    mutations.forEach(function(m){m.addedNodes.forEach(function(n){
      if(n.nodeType===1) markNumericCells(n);
    });});
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>

<script>
(function(){const key='materiel:session-actions:v1';function rows(){try{return JSON.parse(sessionStorage.getItem(key)||'[]')}catch(_){return[]}}function render(){const list=document.getElementById('emSessionActions');if(!list)return;const items=rows();list.replaceChildren();if(!items.length){const li=document.createElement('li');li.className='app-session-empty';li.textContent='لم تُسجل أعمال بعد';list.append(li);return}items.forEach(row=>{const li=document.createElement('li');li.textContent=`${row.time} · ${row.method} ${row.label}`;list.append(li)})}document.addEventListener('DOMContentLoaded',render);document.addEventListener('click',e=>{if(e.target.closest('[data-em-session-clear]')){sessionStorage.removeItem(key);render()}});render()})();
