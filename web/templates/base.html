<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}إدارة الأسطول والعتاد{% endblock %}</title><link rel="stylesheet" href="/static/css/style.css">{% block extra_head %}{% endblock %}
<style>
body{margin:0;background:#f4f6f8;color:#1f2937;font-family:"Segoe UI",Tahoma,sans-serif}.app-sidebar{position:fixed;top:0;right:0;bottom:0;width:238px;background:#062b49;color:#fff;z-index:100;display:flex;flex-direction:column;box-shadow:-2px 0 10px rgba(15,23,42,.12)}.app-brand{padding:20px 16px 17px;border-bottom:1px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700}.app-brand-icon{width:31px;height:31px;border:1px solid rgba(255,255,255,.28);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px}.app-menu{padding:12px 8px;display:flex;flex-direction:column;gap:3px;overflow:auto}.app-menu a{display:flex;align-items:center;gap:11px;color:#dce8f2;text-decoration:none;padding:10px 12px;border-radius:5px;font-size:12px}.app-menu a:hover{background:rgba(255,255,255,.08);color:#fff}.app-menu a.active{background:#0875d1;color:#fff}.menu-icon{width:20px;text-align:center;font-size:15px}.sidebar-spacer{flex:1}.sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.10);color:#b9ccdc;font-size:10px;line-height:1.6}.sidebar-logout{display:flex;align-items:center;gap:11px;margin:0 8px 10px;padding:10px 12px;border-radius:5px;color:#ffd2d2;text-decoration:none;font-size:12px}.app-main{margin-right:238px;min-height:100vh}.app-topbar{height:52px;background:#fff;border-bottom:1px solid #e0e5ea;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box}.app-topbar-title{font-size:13px;font-weight:700;color:#173b63}.app-topbar-date{font-size:11px;color:#64748b}.container{max-width:none;margin:0;padding:18px 20px 28px;box-sizing:border-box}@media(max-width:850px){.app-sidebar{width:190px}.app-main{margin-right:190px}}@media(max-width:600px){.app-sidebar{position:relative;width:100%;height:auto}.app-main{margin-right:0}.app-menu{display:grid;grid-template-columns:repeat(2,1fr)}.sidebar-spacer,.sidebar-user{display:none}}
.global-search-wrap{display:inline-flex;align-items:center;gap:6px;min-width:0}.global-search-wrap>input{flex:1}.global-search-btn,.global-clear-btn{height:34px;border:1px solid #dce3e9;background:#fff;border-radius:6px;padding:0 10px;cursor:pointer;font:inherit;font-size:11px;font-weight:700;color:#173b63;white-space:nowrap}.global-clear-btn{color:#8b3f46}.global-clear-btn[hidden]{display:none}.model-setup-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}.model-setup-fields label{font-size:11px;font-weight:700;color:#475569}.model-setup-fields input,.model-setup-fields select{margin-top:4px;width:100%;box-sizing:border-box}.model-setup-note{grid-column:1/-1;font-size:11px;color:#64748b;line-height:1.7}@media(max-width:800px){.model-setup-fields{grid-template-columns:1fr 1fr}}@media(max-width:520px){.model-setup-fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="app-sidebar"><div class="app-brand"><span class="app-brand-icon">⚙</span><span>نظام إدارة العتاد</span></div><nav class="app-menu"><a href="/dashboard" class="{% if request.url.path.startswith('/dashboard') %}active{% endif %}"><span class="menu-icon">⌂</span><span>لوحة التحكم</span></a><a href="/maintenance" class="{% if request.url.path.startswith('/maintenance') %}active{% endif %}"><span class="menu-icon">⚒</span><span>الصيانة</span></a><a href="/faults-repairs" class="{% if request.url.path.startswith('/faults-repairs') %}active{% endif %}"><span class="menu-icon">⚠</span><span>الأعطال والإصلاحات</span></a><a href="/tires" class="{% if request.url.path.startswith('/tires') %}active{% endif %}"><span class="menu-icon">◉</span><span>الإطارات</span></a><a href="/batteries" class="{% if request.url.path.startswith('/batteries') %}active{% endif %}"><span class="menu-icon">▰</span><span>البطاريات</span></a><a href="/fuel" class="{% if request.url.path.startswith('/fuel') %}active{% endif %}"><span class="menu-icon">⛽</span><span>الوقود</span></a><a href="/missions" class="{% if request.url.path.startswith('/missions') %}active{% endif %}"><span class="menu-icon">◆</span><span>المهمات</span></a><a href="/users" class="{% if request.url.path.startswith('/users') %}active{% endif %}"><span class="menu-icon">♙</span><span>المستخدمون</span></a></nav><div class="sidebar-spacer"></div><div class="sidebar-user">النظام المحلي<br>إدارة الأسطول والعتاد</div><a href="/logout" class="sidebar-logout"><span class="menu-icon">⇥</span><span>تسجيل الخروج</span></a></aside>
<div class="app-main"><header class="app-topbar"><span class="app-topbar-title">إدارة الأسطول والعتاد</span><span class="app-topbar-date" id="systemDate"></span></header><main class="container">{% block content %}{% endblock %}</main></div>
<script>
(function(){
const el=document.getElementById('systemDate');if(el){el.textContent=new Intl.DateTimeFormat('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date())}
const mutationKey='materiel:mutation-completed';document.querySelectorAll('form[method="post"]').forEach(form=>{form.setAttribute('autocomplete','off');form.addEventListener('submit',()=>sessionStorage.setItem(mutationKey,'1'))});if(sessionStorage.getItem(mutationKey)==='1'){sessionStorage.removeItem(mutationKey)}window.addEventListener('pageshow',e=>{if(e.persisted)window.location.reload()});
document.querySelectorAll('.app-menu a').forEach(a=>{const p=a.getAttribute('href')||'';if(p.startsWith('/equipment')||p.startsWith('/meter-readings'))a.remove()});
document.querySelectorAll('input.search-box,input[id*="search" i],input[id*="Search"]').forEach(input=>{if(input.closest('.global-search-wrap')||input.type==='hidden')return;const parent=input.parentElement;if(!parent)return;const wrap=document.createElement('span');wrap.className='global-search-wrap';parent.insertBefore(wrap,input);wrap.appendChild(input);const search=document.createElement('button');search.type='button';search.className='global-search-btn';search.textContent='بحث';const clear=document.createElement('button');clear.type='button';clear.className='global-clear-btn';clear.textContent='إلغاء';clear.hidden=!input.value;wrap.append(search,clear);const fire=()=>input.dispatchEvent(new Event('input',{bubbles:true}));search.addEventListener('click',fire);clear.addEventListener('click',()=>{input.value='';clear.hidden=true;fire();input.dispatchEvent(new Event('change',{bubbles:true}))});input.addEventListener('input',()=>clear.hidden=!input.value)});
const table=document.getElementById('numericalStatusTable'),expandAll=document.getElementById('expandAll'),collapseAll=document.getElementById('collapseAll');if(table&&expandAll&&collapseAll){expandAll.addEventListener('click',()=>{table.querySelectorAll('.type-row,.model-row').forEach(r=>r.style.display='');table.querySelectorAll('.tree-toggle').forEach(b=>{b.setAttribute('aria-expanded','true');b.textContent='−'})});collapseAll.addEventListener('click',()=>{table.querySelectorAll('.type-row,.model-row').forEach(r=>r.style.display='none');table.querySelectorAll('.tree-toggle').forEach(b=>{b.setAttribute('aria-expanded','false');b.textContent='+'})})}
const brandSelect=document.getElementById('statusBrand');if(brandSelect){const current=brandSelect.value;fetch('/api/equipment-brands',{headers:{Accept:'application/json'},credentials:'same-origin'}).then(r=>r.ok?r.json():[]).then(brands=>{const names=[...new Set((Array.isArray(brands)?brands:[]).map(b=>String(b.name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));brandSelect.innerHTML='<option value="">كل الماركات</option>';names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;brandSelect.appendChild(o)});brandSelect.value=names.includes(current)?current:'';brandSelect.dispatchEvent(new Event('change',{bubbles:true}))}).catch(()=>{})}
const modelForm=document.querySelector('form[action="/equipment-types/models/create"]');if(modelForm){const box=document.createElement('div');box.className='model-setup-fields';box.innerHTML='<div class="model-setup-note">إعداد الطراز إلزامي: حدد تجهيزات الإطارات والبطاريات، وهل العتاد مجرور أو متحرك، وهل يحتاج سائقًا. لن يتم حفظ الطراز دون هذه المعلومات.</div><label>الإطارات<select name="has_tires" required><option value="">هل يملك إطارات؟</option><option value="true">نعم</option><option value="false">لا</option></select></label><label>عدد مواضع الإطارات<input name="tire_positions_required" type="number" min="0" value="0" required></label><label>البطاريات<select name="has_batteries" required><option value="">هل يملك بطاريات؟</option><option value="true">نعم</option><option value="false">لا</option></select></label><label>عدد البطاريات<input name="battery_count_required" type="number" min="0" value="0" required></label><label>الحركة<select name="mobility_type" required><option value="">متحرك أم مجرور؟</option><option value="mobile">متحرك</option><option value="towed">مجرور</option></select></label><label>السائق<select name="requires_driver" required><option value="">هل يحتاج سائقًا؟</option><option value="true">نعم</option><option value="false">لا</option></select></label>';modelForm.querySelector('.add-btn')?.before(box);modelForm.addEventListener('submit',e=>{const tires=modelForm.querySelector('[name="has_tires"]').value,batteries=modelForm.querySelector('[name="has_batteries"]').value,tireCount=Number(modelForm.querySelector('[name="tire_positions_required"]').value),batteryCount=Number(modelForm.querySelector('[name="battery_count_required"]').value);if(tires==='true'&&tireCount<1){e.preventDefault();alert('هذا الطراز يملك إطارات؛ يجب تحديد عدد مواضع الإطارات.');return}if(tires==='false'&&tireCount!==0){e.preventDefault();alert('عدد مواضع الإطارات يجب أن يكون صفرًا إذا كان الطراز لا يملك إطارات.');return}if(batteries==='true'&&batteryCount<1){e.preventDefault();alert('هذا الطراز يملك بطاريات؛ يجب تحديد عدد البطاريات.');return}if(batteries==='false'&&batteryCount!==0){e.preventDefault();alert('عدد البطاريات يجب أن يكون صفرًا إذا كان الطراز لا يملك بطاريات.');return}if(!confirm('سيتم حفظ إعدادات هذا الطراز بما فيها الإطارات والبطاريات والحركة والسائق. هل تؤكد؟'))e.preventDefault()})}
})();
</script>
</body>
</html>
