<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}إدارة الأسطول والعتاد{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
    <style>
        body{margin:0;background:#f4f6f8;color:#1f2937;font-family:"Segoe UI",Tahoma,sans-serif}
        .app-sidebar{position:fixed;top:0;right:0;bottom:0;width:238px;background:#062b49;color:#fff;z-index:100;display:flex;flex-direction:column;box-shadow:-2px 0 10px rgba(15,23,42,.12)}
        .app-brand{padding:20px 16px 17px;border-bottom:1px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700}
        .app-brand-icon{width:31px;height:31px;border:1px solid rgba(255,255,255,.28);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
        .app-menu{padding:12px 8px;display:flex;flex-direction:column;gap:3px;overflow:auto}
        .app-menu a{display:flex;align-items:center;gap:11px;color:#dce8f2;text-decoration:none;padding:10px 12px;border-radius:5px;font-size:12px;transition:.15s}
        .app-menu a:hover{background:rgba(255,255,255,.08);color:#fff}
        .app-menu a.active{background:#0875d1;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
        .menu-icon{width:20px;text-align:center;font-size:15px;opacity:.95}
        .sidebar-spacer{flex:1}
        .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.10);color:#b9ccdc;font-size:10px;line-height:1.6}
        .sidebar-logout{display:flex;align-items:center;gap:11px;margin:0 8px 10px;padding:10px 12px;border-radius:5px;color:#ffd2d2;text-decoration:none;font-size:12px}
        .sidebar-logout:hover{background:rgba(255,255,255,.08);color:#fff}
        .app-main{margin-right:238px;min-height:100vh}
        .app-topbar{height:52px;background:#fff;border-bottom:1px solid #e0e5ea;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box}
        .app-topbar-title{font-size:13px;font-weight:700;color:#173b63}.app-topbar-date{font-size:11px;color:#64748b}
        .container{max-width:none;margin:0;padding:18px 20px 28px;box-sizing:border-box}
        @media(max-width:850px){.app-sidebar{width:190px}.app-main{margin-right:190px}.container{padding:14px}.app-brand{font-size:12px}.app-menu a{font-size:11px;padding:9px 8px}.app-topbar{padding:0 12px}}
        @media(max-width:600px){.app-sidebar{position:relative;width:100%;height:auto;bottom:auto}.app-menu{display:grid;grid-template-columns:repeat(2,1fr);max-height:none}.sidebar-spacer,.sidebar-user{display:none}.sidebar-logout{margin:4px 8px 8px!important}.app-main{margin-right:0}.app-topbar{height:44px}}
        .meter-import-error{display:flex;align-items:flex-start;gap:13px;margin:12px 0;padding:15px 16px;border:2px solid #f1aeb5;border-radius:12px;background:#fff5f6;color:#7f1d1d;box-shadow:0 2px 8px rgba(127,29,29,.08)}
        .meter-import-error .error-icon{flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fee2e2;font-size:25px}
        .meter-import-error .error-title{font-size:16px;font-weight:800;margin-bottom:5px}.meter-import-error .error-message{font-size:13px;line-height:1.8}
        .meter-import-errors{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}.meter-import-errors li{padding:9px 11px;border:1px solid #fecaca;border-radius:8px;background:#fff;color:#991b1b;font-size:13px;line-height:1.7}
        .meter-import-ok{display:flex;align-items:center;gap:9px;margin:12px 0;padding:12px 14px;border:1px solid #bbf7d0;border-radius:10px;background:#f0fdf4;color:#166534;font-size:13px;font-weight:700}
        .global-search-wrap{display:inline-flex;align-items:center;gap:6px;min-width:0}.global-search-wrap>input{flex:1}.global-search-btn,.global-clear-btn{height:34px;border:1px solid #dce3e9;background:#fff;border-radius:6px;padding:0 10px;cursor:pointer;font:inherit;font-size:11px;font-weight:700;color:#173b63;white-space:nowrap}.global-clear-btn{color:#8b3f46}.global-clear-btn[hidden]{display:none}
    </style>
</head>
<body>
    <aside class="app-sidebar">
        <div class="app-brand"><span class="app-brand-icon">⚙</span><span>نظام إدارة العتاد</span></div>
        <nav class="app-menu">
            <a href="/dashboard" class="{% if request.url.path.startswith('/dashboard') %}active{% endif %}"><span class="menu-icon">⌂</span><span>لوحة التحكم</span></a>
            <a href="/maintenance" class="{% if request.url.path.startswith('/maintenance') %}active{% endif %}"><span class="menu-icon">⚒</span><span>الصيانة</span></a>
            <a href="/faults-repairs" class="{% if request.url.path.startswith('/faults-repairs') %}active{% endif %}"><span class="menu-icon">⚠</span><span>الأعطال والإصلاحات</span></a>
            <a href="/tires" class="{% if request.url.path.startswith('/tires') %}active{% endif %}"><span class="menu-icon">◉</span><span>الإطارات</span></a>
            <a href="/batteries" class="{% if request.url.path.startswith('/batteries') %}active{% endif %}"><span class="menu-icon">▰</span><span>البطاريات</span></a>
            <a href="/fuel" class="{% if request.url.path.startswith('/fuel') %}active{% endif %}"><span class="menu-icon">⛽</span><span>الوقود</span></a>
            <a href="/missions" class="{% if request.url.path.startswith('/missions') %}active{% endif %}"><span class="menu-icon">◆</span><span>المهمات</span></a>
            <a href="/users" class="{% if request.url.path.startswith('/users') %}active{% endif %}"><span class="menu-icon">♙</span><span>المستخدمون</span></a>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-user">النظام المحلي<br>إدارة الأسطول والعتاد</div>
        <a href="/logout" class="sidebar-logout"><span class="menu-icon">⇥</span><span>تسجيل الخروج</span></a>
    </aside>
    <div class="app-main">
        <header class="app-topbar"><span class="app-topbar-title">إدارة الأسطول والعتاد</span><span class="app-topbar-date" id="systemDate"></span></header>
        <main class="container">{% block content %}{% endblock %}</main>
    </div>
    <script>
        (function(){
            const el=document.getElementById('systemDate');
            if(el){const now=new Date();el.textContent=new Intl.DateTimeFormat('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'}).format(now);}
            const mutationKey='materiel:mutation-completed';
            document.querySelectorAll('form[method="post"]').forEach(form=>{form.setAttribute('autocomplete','off');form.addEventListener('submit',()=>{sessionStorage.setItem(mutationKey,'1');});});
            function resetEntryForms(){document.querySelectorAll('form[method="post"]').forEach(form=>{if(form.dataset.preserveForm==='true')return;form.reset();form.querySelectorAll('select').forEach(select=>{if(select.dataset.resetDisabled==='true')select.disabled=true;});});}
            if(sessionStorage.getItem(mutationKey)==='1'){sessionStorage.removeItem(mutationKey);resetEntryForms();}
            window.addEventListener('pageshow',function(event){if(event.persisted){window.location.reload();}});

            /* Equipment is a module; its internal screens are intentionally absent from the global module sidebar. */
            document.querySelectorAll('.app-menu a').forEach(a=>{
                const p=a.getAttribute('href')||'';
                if(p.startsWith('/equipment')||p.startsWith('/meter-readings'))a.remove();
            });

            /* Shared search controls: every search input gets explicit Search and Cancel actions. */
            document.querySelectorAll('input.search-box, input[id*="search" i], input[id*="Search"]').forEach(input=>{
                if(input.closest('.global-search-wrap')||input.type==='hidden')return;
                const parent=input.parentElement;
                if(!parent)return;
                const wrap=document.createElement('span');wrap.className='global-search-wrap';
                parent.insertBefore(wrap,input);wrap.appendChild(input);
                const search=document.createElement('button');search.type='button';search.className='global-search-btn';search.textContent='بحث';search.title='تنفيذ البحث';
                const clear=document.createElement('button');clear.type='button';clear.className='global-clear-btn';clear.textContent='إلغاء';clear.title='إلغاء البحث والفلترة';clear.hidden=!input.value;
                wrap.append(search,clear);
                const fire=()=>input.dispatchEvent(new Event(input.tagName==='SELECT'?'change':'input',{bubbles:true}));
                search.addEventListener('click',fire);
                clear.addEventListener('click',()=>{input.value='';clear.hidden=true;fire();input.dispatchEvent(new Event('change',{bubbles:true}));});
                input.addEventListener('input',()=>{clear.hidden=!input.value;});
            });

            /* A blank theoretical field is intentional for newly-created equipment types. */
            document.querySelectorAll('input[name="theoretical_quantity"]').forEach(input=>{
                if(input.value==='0' && !input.dataset.userEdited)input.value='';
                input.addEventListener('input',()=>input.dataset.userEdited='true');
                const form=input.closest('form');
                if(form&&/\/theoretical-quantity$/.test(form.action||''))form.addEventListener('submit',e=>{if(!confirm('سيتم تغيير التعداد النظري لهذا النوع. هل تؤكد تثبيت التعديل؟'))e.preventDefault();});
            });

            /* Numerical status: the original table had one missing body cell. Insert the restricted-ready column before broken. */
            const table=document.getElementById('numericalStatusTable');
            if(table){
                table.querySelectorAll('tbody tr.searchable').forEach(row=>{
                    const cells=row.children;
                    if(cells.length===13){
                        const ready=Number(row.dataset.readyPct||0),broken=Number(row.dataset.brokenPct||0);
                        const td=document.createElement('td');td.textContent=Math.max(0,100-ready-broken).toFixed(1)+'%';
                        row.insertBefore(td,cells[11]);
                    }
                });
            }

            /* Numerical-status tree controls remain reliable even if page-level handlers fail. */
            const expandAll=document.getElementById('expandAll'),collapseAll=document.getElementById('collapseAll');
            if(table&&expandAll&&collapseAll){
                expandAll.addEventListener('click',function(){table.querySelectorAll('.type-row,.model-row').forEach(r=>r.style.display='');table.querySelectorAll('.tree-toggle').forEach(b=>{b.setAttribute('aria-expanded','true');b.textContent='−';});});
                collapseAll.addEventListener('click',function(){table.querySelectorAll('.type-row,.model-row').forEach(r=>r.style.display='none');table.querySelectorAll('.tree-toggle').forEach(b=>{b.setAttribute('aria-expanded','false');b.textContent='+';});});
            }

            const brandSelect=document.getElementById('statusBrand');
            if(brandSelect){
                const current=brandSelect.value;
                fetch('/api/equipment-brands',{headers:{'Accept':'application/json'},credentials:'same-origin'}).then(r=>r.ok?r.json():[]).then(brands=>{
                    const names=[...new Set((Array.isArray(brands)?brands:[]).map(b=>String(b.name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
                    brandSelect.innerHTML='<option value="">كل الماركات</option>';
                    names.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;brandSelect.appendChild(o);});
                    brandSelect.value=names.includes(current)?current:'';brandSelect.dispatchEvent(new Event('change',{bubbles:true}));
                }).catch(()=>{});
            }
        })();
    </script>
</body>
</html>
