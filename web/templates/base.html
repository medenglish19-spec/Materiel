<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}إدارة الأسطول والعتاد{% endblock %}</title><link rel="stylesheet" href="/static/css/style.css">{% block extra_head %}{% endblock %}
<style>
body{margin:0;background:#f3f6fa;color:#172033;font-family:"Segoe UI",Tahoma,sans-serif}.app-sidebar{position:fixed;top:0;right:0;bottom:0;width:250px;background:linear-gradient(180deg,#082b49 0%,#071f35 100%);color:#fff;z-index:100;display:flex;flex-direction:column;box-shadow:-8px 0 28px rgba(15,23,42,.14)}.app-brand{padding:22px 18px 20px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:11px;font-size:16px;font-weight:800}.app-brand-icon{width:36px;height:36px;border:1px solid rgba(255,255,255,.22);border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.06)}.app-menu{padding:14px 10px;display:flex;flex-direction:column;gap:5px;overflow:auto}.app-menu a{display:flex;align-items:center;gap:12px;color:#c9d9e7;text-decoration:none;padding:11px 13px;border-radius:10px;font-size:12px;font-weight:650;transition:background .16s ease,color .16s ease,transform .16s ease}.app-menu a:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(-2px)}.app-menu a.active{background:linear-gradient(90deg,#0b83e5,#0869b7);color:#fff;box-shadow:0 6px 18px rgba(0,105,183,.22)}.menu-icon{width:21px;text-align:center;font-size:16px}.sidebar-spacer{flex:1}.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.09);color:#9eb6ca;font-size:10px;line-height:1.7}.sidebar-logout{display:flex;align-items:center;gap:11px;margin:0 10px 12px;padding:11px 13px;border-radius:10px;color:#ffd5d5;text-decoration:none;font-size:12px}.sidebar-logout:hover{background:rgba(255,80,80,.08)}.app-main{margin-right:250px;min-height:100vh}.app-topbar{height:62px;background:rgba(255,255,255,.94);border-bottom:1px solid #e4e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}.app-topbar-title{font-size:14px;font-weight:800;color:#163b5e}.app-topbar-date{font-size:11px;color:#7a8798;background:#f7f9fc;border:1px solid #e8edf3;padding:6px 10px;border-radius:8px}.container{max-width:1440px;margin:0 auto;padding:26px 28px 42px;box-sizing:border-box}@media(max-width:900px){.app-sidebar{width:205px}.app-main{margin-right:205px}.container{padding:20px}}@media(max-width:650px){.app-sidebar{position:relative;width:100%;height:auto}.app-main{margin-right:0}.app-menu{display:grid;grid-template-columns:repeat(2,1fr)}.sidebar-spacer,.sidebar-user{display:none}.app-topbar{position:relative;height:54px;padding:0 14px}.container{padding:16px 12px 28px}}
.global-search-wrap{display:inline-flex;align-items:center;gap:6px;min-width:0}.global-search-wrap>input{flex:1}.global-search-btn,.global-clear-btn{height:36px;border:1px solid #dce3e9;background:#fff;border-radius:8px;padding:0 11px;cursor:pointer;font:inherit;font-size:11px;font-weight:800;color:#173b63;white-space:nowrap}.global-clear-btn{color:#8b3f46}.global-clear-btn[hidden]{display:none}.model-setup-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}.model-setup-fields label{font-size:11px;font-weight:700;color:#475569}.model-setup-fields input,.model-setup-fields select{margin-top:4px;width:100%;box-sizing:border-box}.model-setup-note{grid-column:1/-1;font-size:11px;color:#64748b;line-height:1.7}.model-spec-extra{display:none;grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px;border-radius:8px;background:#fff;border:1px dashed #d7dee8}.model-spec-extra.is-visible{display:grid}.model-spec-title{grid-column:1/-1;font-size:11px;font-weight:800;color:#344054}.model-spec-help{grid-column:1/-1;font-size:10px;color:#98a2b3}.module-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 18px;padding:8px 10px;background:#fff;border:1px solid #e4e9ef;border-radius:11px;box-shadow:0 3px 12px rgba(15,23,42,.035)}.module-nav a{padding:7px 10px;border-radius:8px;color:#526273;text-decoration:none;font-size:10px;font-weight:800}.module-nav a:hover,.module-nav a.active{background:#eef5fb;color:#173b63}@media(max-width:800px){.model-setup-fields,.model-spec-extra{grid-template-columns:1fr 1fr}}@media(max-width:520px){.model-setup-fields,.model-spec-extra{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="app-sidebar"><div class="app-brand"><span class="app-brand-icon">⚙</span><span>نظام إدارة العتاد</span></div><nav class="app-menu"><a href="/dashboard" class="{% if request.url.path.startswith('/dashboard') %}active{% endif %}"><span class="menu-icon">⌂</span><span>لوحة التحكم</span></a><a href="/equipment" class="{% if request.url.path.startswith('/equipment') %}active{% endif %}"><span class="menu-icon">▦</span><span>العتاد</span></a><a href="/maintenance" class="{% if request.url.path.startswith('/maintenance') %}active{% endif %}"><span class="menu-icon">⚒</span><span>الصيانة</span></a><a href="/meter-readings" class="{% if request.url.path.startswith('/meter-readings') %}active{% endif %}"><span class="menu-icon">◷</span><span>العدادات</span></a><a href="/faults-repairs" class="{% if request.url.path.startswith('/faults-repairs') %}active{% endif %}"><span class="menu-icon">⚠</span><span>الأعطال والإصلاحات</span></a><a href="/tires" class="{% if request.url.path.startswith('/tires') %}active{% endif %}"><span class="menu-icon">◉</span><span>الإطارات</span></a><a href="/batteries" class="{% if request.url.path.startswith('/batteries') %}active{% endif %}"><span class="menu-icon">▰</span><span>البطاريات</span></a><a href="/fuel" class="{% if request.url.path.startswith('/fuel') %}active{% endif %}"><span class="menu-icon">⛽</span><span>الوقود</span></a><a href="/missions" class="{% if request.url.path.startswith('/missions') %}active{% endif %}"><span class="menu-icon">◆</span><span>المهمات</span></a><a href="/users" class="{% if request.url.path.startswith('/users') %}active{% endif %}"><span class="menu-icon">♙</span><span>المستخدمون</span></a></nav><div class="sidebar-spacer"></div><div class="sidebar-user">النظام المحلي<br>إدارة الأسطول والعتاد</div><a href="/logout" class="sidebar-logout"><span class="menu-icon">⇥</span><span>تسجيل الخروج</span></a></aside>
<div class="app-main"><header class="app-topbar"><span class="app-topbar-title">إدارة الأسطول والعتاد</span><span class="app-topbar-date" id="systemDate"></span></header><main class="container">{% block content %}{% endblock %}</main></div>
<script>
(function(){
const el=document.getElementById('systemDate');if(el){el.textContent=new Intl.DateTimeFormat('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date())}
const params=new URLSearchParams(window.location.search);const notice=params.get('notice');const noticeType=params.get('notice_type')||'warning';if(notice){const box=document.createElement('div');box.className='materiel-notice materiel-notice-'+noticeType;const icon=noticeType==='danger'?'⛔':noticeType==='success'?'✓':noticeType==='info'?'ℹ️':'⚠️';const iconEl=document.createElement('span');iconEl.className='materiel-notice-icon';iconEl.textContent=icon;const textEl=document.createElement('div');textEl.className='materiel-notice-text';textEl.textContent=notice;const close=document.createElement('button');close.type='button';close.className='materiel-notice-close';close.setAttribute('aria-label','إغلاق');close.textContent='×';box.append(iconEl,textEl,close);const main=document.querySelector('.container');if(main)main.prepend(box);close.addEventListener('click',()=>box.remove());window.setTimeout(()=>box.classList.add('materiel-notice-visible'),20);const clean=new URL(window.location.href);clean.searchParams.delete('notice');clean.searchParams.delete('notice_type');window.history.replaceState({},'',clean.toString())}
const mutationKey='materiel:mutation-completed';document.querySelectorAll('form[method="post"]').forEach(form=>{form.setAttribute('autocomplete','off');form.addEventListener('submit',()=>sessionStorage.setItem(mutationKey,'1'))});if(sessionStorage.getItem(mutationKey)==='1'){sessionStorage.removeItem(mutationKey)}window.addEventListener('pageshow',e=>{if(e.persisted)window.location.reload()});
document.querySelectorAll('input.search-box,input[id*="search" i],input[id*="Search"]').forEach(input=>{if(input.closest('.global-search-wrap')||input.type==='hidden')return;const parent=input.parentElement;if(!parent)return;const wrap=document.createElement('span');wrap.className='global-search-wrap';parent.insertBefore(wrap,input);wrap.appendChild(input);const search=document.createElement('button');search.type='button';search.className='global-search-btn';search.textContent='بحث';const clear=document.createElement('button');clear.type='button';clear.className='global-clear-btn';clear.textContent='إلغاء';clear.hidden=!input.value;wrap.append(search,clear);const fire=()=>input.dispatchEvent(new Event('input',{bubbles:true}));search.addEventListener('click',fire);clear.addEventListener('click',()=>{input.value='';clear.hidden=true;fire();input.dispatchEvent(new Event('change',{bubbles:true}))});input.addEventListener('input',()=>clear.hidden=!input.value)});
const p=window.location.pathname;
if(p.startsWith('/equipment')||p.startsWith('/equipment-types')){const nav=document.createElement('nav');nav.className='module-nav';const links=[['/equipment','قائمة العتاد'],['/equipment/numerical-status','الحالة العددية'],['/equipment/analysis','تحليل العتاد'],['/equipment-types','أنواع العتاد'],['/equipment-types/structure','هيكلة الأنواع']];links.forEach(([href,label])=>{const a=document.createElement('a');a.href=href;a.textContent=label;if(p===href)a.className='active';nav.appendChild(a)});const main=document.querySelector('.container');if(main)main.prepend(nav)}
if(p==='/equipment/numerical-status'){const table=document.getElementById('numericalStatusTable');if(table){const heads=[...table.querySelectorAll('thead th')];const idx=heads.findIndex(h=>h.textContent.includes('% من الأب'));if(idx>=0){heads[idx].remove();table.querySelectorAll('tbody tr').forEach(r=>{if(r.children.length>idx)r.children[idx].remove()})}}}
const brandSelect=document.getElementById('statusBrand');if(brandSelect){const current=brandSelect.value;fetch('/api/equipment-brands',{headers:{Accept:'application/json'},credentials:'same-origin'}).then(r=>r.ok?r.json():[]).then(brands=>{const names=[...new Set((Array.isArray(brands)?brands:[]).map(b=>String(b.name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));brandSelect.innerHTML='<option value="">كل الماركات</option>';names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;brandSelect.appendChild(o)});brandSelect.value=names.includes(current)?current:'';brandSelect.dispatchEvent(new Event('change',{bubbles:true}))}).catch(()=>{})}
})();
</script>
<style>
.materiel-notice{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px;padding:14px 16px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;box-shadow:0 6px 20px rgba(15,23,42,.06);opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease}.materiel-notice-visible{opacity:1;transform:none}.materiel-notice-icon{font-size:20px;line-height:1.2}.materiel-notice-text{flex:1;font-size:12px;line-height:1.8;font-weight:650;color:#334155}.materiel-notice-close{border:0;background:transparent;color:#64748b;font-size:20px;line-height:1;cursor:pointer;padding:0 3px}.materiel-notice-warning{border-right:4px solid #d99a16}.materiel-notice-danger{border-right:4px solid #b42318}.materiel-notice-info{border-right:4px solid #2563eb}.materiel-notice-success{border-right:4px solid #15803d}
/* Modern interface layer: visual-only, no business logic changes. */
.card,.toolbar,.stat-card{border:1px solid #e5eaf1;border-radius:14px;box-shadow:0 8px 26px rgba(15,23,42,.055)}
.page-header{gap:10px;flex-wrap:wrap;padding:4px 0 2px}.page-header h2{font-size:24px;color:#162f49;font-weight:850;margin-left:auto}.btn-primary,.btn-outline,.btn-danger{transition:transform .15s ease,box-shadow .15s ease,background .15s ease}.btn-primary{box-shadow:0 5px 14px rgba(37,99,235,.16)}.btn-primary:hover,.btn-outline:hover,.btn-danger:hover{transform:translateY(-1px)}
.card h3{color:#193b5a;font-size:17px}.toolbar{padding:13px;background:rgba(255,255,255,.92)}.data-table,.modern-table{border:1px solid #e6ebf1}.data-table th,.modern-table thead th{background:#f5f8fb;color:#506176}.modern-table thead th{position:sticky;top:0;color:#506176}.data-table tbody tr:hover,.modern-table tbody tr:hover{background:#f8fbfe}
.record-page{max-width:1280px}.record-panel{border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.05)}.record-box{background:linear-gradient(180deg,#fbfcfe,#f7f9fc);border-radius:12px}.tire-position-card{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}.tire-position-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.06);border-color:#cdd9e6}
@media(max-width:650px){.page-header{align-items:flex-start}.page-header h2{width:100%;margin-left:0;font-size:21px}.card{padding:15px}.btn-primary,.btn-outline{padding:9px 12px}}
</style>
</body>
</html>
