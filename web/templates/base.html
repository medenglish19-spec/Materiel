<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}إدارة الأسطول والعتاد{% endblock %}</title><link rel="stylesheet" href="/static/css/style.css"><script src="/static/js/edit-manager.js"></script>{% block extra_head %}{% endblock %}
<style>
:root{--bg-primary:#e8f5e9;--bg-secondary:#f1f8e9;--sidebar-start:#2e7d32;--sidebar-end:#388e3c;--primary:#43a047;--primary-light:#66bb6a;--success:#2e7d32;--warning:#f9a825;--error:#c62828;--text-primary:#1b5e20;--text-secondary:#4e6b52;--white:#ffffff;--shadow:0 4px 20px rgba(46,125,50,.08);--shadow-hover:0 8px 30px rgba(46,125,50,.15);--radius:14px;--radius-sm:10px;--sidebar-w:208px}
body{margin:0;background:var(--bg-primary);color:var(--text-primary);font-family:"Segoe UI",Tahoma,sans-serif}
.app-sidebar{position:fixed;top:0;right:0;bottom:0;width:var(--sidebar-w);background:#0b3f3c;color:#fff;z-index:100;display:flex;flex-direction:column;box-shadow:none;overflow:hidden}
.app-brand{padding:20px 16px;border-bottom:0;display:flex;align-items:center;gap:12px;font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:15px;font-weight:800}
.app-brand-icon{width:34px;height:34px;border:0;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;background:#fff;color:#0e6b66}
.app-menu{padding:8px 12px;display:flex;flex-direction:column;gap:4px;flex:0 0 auto;min-height:0;overflow:visible}
.app-menu a{box-sizing:border-box;display:flex;align-items:center;gap:10px;color:#cfe3e1;text-decoration:none;padding:8px 10px;min-height:36px;border-radius:8px;font-size:13px;font-weight:500;transition:all .2s ease}
.app-menu a:hover{background:#ffffff12;color:#fff;transform:none}
.app-menu a.active{background:#fff;color:#0b3f3c;box-shadow:none;font-weight:700}
.menu-icon{width:22px;text-align:center;font-size:17px}
.sidebar-spacer{flex:1}
.sidebar-user{padding:16px 18px;border-top:1px solid #ffffff20;color:#9cc0bc;font-size:11px;line-height:1.7}
.sidebar-logout{display:flex;align-items:center;gap:11px;margin:12px;padding:12px 14px;border-radius:8px;color:#cfe3e1;text-decoration:none;font-size:12px;transition:all .2s ease}
.sidebar-logout:hover{background:rgba(198,40,40,.15)}
.app-main{margin-right:var(--sidebar-w);min-height:100vh;padding:24px;width:auto;max-width:100%}
@media(max-width:900px){:root{--sidebar-w:176px}.app-main{margin-right:176px}}
@media(max-width:700px){:root{--sidebar-w:0px}.app-sidebar{position:static;width:100%;height:auto;min-height:52px;flex-direction:row;align-items:flex-start;box-shadow:none;overflow:visible}.app-brand{flex:0 0 52px;width:52px;height:52px;padding:0;justify-content:center;border-left:1px solid #ffffff18}.app-brand-icon{width:30px;height:30px;font-size:16px}.app-brand span:not(.app-brand-icon),.sidebar-user,.sidebar-logout{display:none}.app-menu{flex:1;min-width:0;display:flex;flex-direction:row;flex-wrap:wrap;gap:4px;padding:6px 7px;overflow:visible}.app-menu a{box-sizing:border-box;flex:0 0 auto;min-height:34px;height:34px;padding:7px 9px;border-radius:7px;font-size:11px;white-space:nowrap}.app-menu a .menu-icon{font-size:15px;width:18px}.app-main{margin-right:0;padding:0}.app-topbar{flex-direction:row;gap:8px;align-items:center;position:static;min-height:48px;padding:7px 12px}.app-topbar-title{font-size:11px;white-space:nowrap}.app-workbar{margin-inline-start:auto}.app-workbtn{height:30px;padding:0 8px;font-size:10px}.app-work-status,.app-worksep{display:none}.app-topbar-date{display:none}.container{padding:0 10px}}
.app-topbar{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:var(--radius);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid rgba(46,125,50,.08);position:sticky;top:16px;z-index:50}
.app-topbar-title{font-size:16px;font-weight:800;color:var(--text-primary)}
.app-workbar{display:flex;align-items:center;gap:8px}
.app-workbtn{height:38px;border:1px solid rgba(46,125,50,.15);background:var(--white);border-radius:var(--radius-sm);padding:0 14px;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:var(--text-primary);transition:all .2s ease}
.app-workbtn:hover:not(:disabled){background:var(--bg-secondary);border-color:var(--primary-light)}
.app-workbtn:disabled{opacity:.5;cursor:not-allowed}
.app-work-save{background:linear-gradient(135deg,var(--primary),var(--success));color:#fff;border:none}
.app-work-status{font-size:12px;color:var(--text-secondary);padding:0 8px}
.app-worksep{width:1px;height:24px;background:rgba(46,125,50,.15)}
.app-topbar-date{font-size:13px;color:var(--text-secondary)}
.container{max-width:100%;min-width:0}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-header h2{font-size:22px;font-weight:800;color:var(--text-primary);margin:0}
.page-hint{font-size:13px;color:var(--text-secondary);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .2s ease;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--success));color:#fff;box-shadow:0 4px 14px rgba(67,160,71,.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(67,160,71,.35)}
.btn-outline{background:var(--white);color:var(--primary);border:1px solid var(--primary-light)}
.btn-outline:hover{background:var(--bg-secondary)}
.btn-danger{background:var(--error);color:#fff}
.card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid rgba(46,125,50,.06);margin-bottom:20px}
.card h3{font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:16px}
.toolbar{display:flex;align-items:center;gap:10px;background:var(--white);padding:14px 16px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;flex-wrap:wrap;border:1px solid rgba(46,125,50,.06)}
.search-box{flex:1;min-width:200px;padding:10px 14px;border:1px solid rgba(46,125,50,.15);border-radius:var(--radius-sm);font-size:13px;outline:none;transition:all .2s ease;background:var(--bg-secondary)}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,160,71,.12);background:var(--white)}
.select-box{padding:10px 14px;border:1px solid rgba(46,125,50,.15);border-radius:var(--radius-sm);font-size:13px;outline:none;background:var(--white);cursor:pointer}
.data-table,.modern-table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid rgba(46,125,50,.08);border-radius:var(--radius-sm);overflow:hidden}
.data-table th,.modern-table thead th{background:var(--bg-secondary);color:var(--text-primary);font-weight:700;padding:12px 14px;text-align:right;border-bottom:1px solid rgba(46,125,50,.1)}
.data-table td,.modern-table td{padding:12px 14px;border-bottom:1px solid rgba(46,125,50,.05);color:var(--text-secondary)}
.data-table tbody tr:nth-child(even),.modern-table tbody tr:nth-child(even){background:rgba(232,245,233,.4)}
.data-table tbody tr:hover,.modern-table tbody tr:hover{background:var(--bg-secondary)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-success{background:#c8e6c9;color:#1b5e20}
.badge-warning{background:#fff9c4;color:#f57f17}
.badge-error{background:#ffcdd2;color:#b71c1c}
.badge-info{background:#b3e5fc;color:#01579b}
.stat-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid rgba(46,125,50,.06);transition:all .25s ease}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.module-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 20px;padding:10px 12px;background:var(--white);border:1px solid rgba(46,125,50,.08);border-radius:var(--radius);box-shadow:var(--shadow)}
.module-nav a{padding:8px 12px;border-radius:var(--radius-sm);color:var(--text-secondary);text-decoration:none;font-size:12px;font-weight:700;transition:all .2s ease}
.module-nav a:hover,.module-nav a.active{background:var(--bg-secondary);color:var(--primary)}
.materiel-notice{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px;padding:14px 16px;border:1px solid rgba(46,125,50,.1);border-radius:var(--radius);background:var(--white);box-shadow:var(--shadow);opacity:0;transform:translateY(-6px);transition:all .2s ease}
.materiel-notice-visible{opacity:1;transform:none}
.materiel-notice-icon{font-size:20px;line-height:1.2}
.materiel-notice-text{flex:1;font-size:12px;line-height:1.8;font-weight:600;color:var(--text-secondary)}
.materiel-notice-close{border:0;background:transparent;color:var(--text-secondary);font-size:20px;line-height:1;cursor:pointer;padding:0 3px}
.materiel-notice-warning{border-right:4px solid var(--warning)}
.materiel-notice-danger{border-right:4px solid var(--error)}
.materiel-notice-info{border-right:4px solid #0288d1}
.materiel-notice-success{border-right:4px solid var(--success)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--text-secondary)}
.field input,.field select,.field textarea{padding:10px 14px;border:1px solid rgba(46,125,50,.15);border-radius:var(--radius-sm);font-size:13px;outline:none;background:var(--white);transition:all .2s ease}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,160,71,.12)}
.form-value{padding:10px 14px;background:var(--bg-secondary);border-radius:var(--radius-sm);font-size:13px;color:var(--text-primary)}
.empty{text-align:center;padding:40px;color:var(--text-secondary);font-size:14px}
.equipment-card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(46,125,50,.06);transition:all .25s ease}
.equipment-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.equipment-card-image{width:100%;height:180px;object-fit:cover;background:var(--bg-secondary)}
.equipment-card-body{padding:16px}
.equipment-card-title{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
.equipment-card-info{font-size:12px;color:var(--text-secondary);line-height:1.8}
.equipment-card-actions{display:flex;gap:8px;margin-top:12px}
.equipment-card-actions .btn{padding:6px 12px;font-size:11px}

/* Materiel responsive UI standard: the page reflows; only genuinely wide tables scroll. */
html,body{max-width:100%;}
body{overflow-x:clip;}
.app-main,.container,main.container{min-width:0;max-width:100%;box-sizing:border-box;}
.app-main > *, .container > *{min-width:0;max-width:100%;box-sizing:border-box;}
.app-topbar{min-width:0;flex-wrap:wrap;}
.app-topbar-title{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.table-scroll{width:100%;max-width:100%;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.table-scroll:focus{outline:2px solid var(--primary-light);outline-offset:2px;}
.table-scroll > table{max-width:none;}
.table-scroll th,.table-scroll td{overflow-wrap:anywhere;}
.table-scroll .nowrap{white-space:nowrap;overflow-wrap:normal;}
@media(max-width:700px){
  .app-topbar{margin-bottom:12px;border-radius:0;padding:8px 12px;}
  .app-topbar-title{font-size:11px;flex:1 1 120px;}
  .app-workbar{flex:0 1 auto;min-width:0;}
}
</style>
</head>
<body>
<aside class="app-sidebar"><div class="app-brand"><span class="app-brand-icon">⚙</span><span>نظام إدارة العتاد</span></div><nav class="app-menu"><a href="/dashboard" class="{% if request.url.path.startswith('/dashboard') %}active{% endif %}"><span class="menu-icon">⌂</span><span>لوحة التحكم</span></a><a href="/equipment" class="{% if request.url.path.startswith('/equipment') %}active{% endif %}"><span class="menu-icon">▦</span><span>العتاد</span></a><a href="/maintenance" class="{% if request.url.path.startswith('/maintenance') %}active{% endif %}"><span class="menu-icon">⚒</span><span>الصيانة</span></a><a href="/meter-readings" class="{% if request.url.path.startswith('/meter-readings') %}active{% endif %}"><span class="menu-icon">◷</span><span>العدادات</span></a><a href="/faults-repairs" class="{% if request.url.path.startswith('/faults-repairs') %}active{% endif %}"><span class="menu-icon">⚠</span><span>الأعطال والإصلاحات</span></a><a href="/spare-parts-requests" class="{% if request.url.path.startswith('/spare-parts-requests') %}active{% endif %}"><span class="menu-icon">▤</span><span>طلبات قطع الغيار</span></a><a href="/tires" class="{% if request.url.path.startswith('/tires') %}active{% endif %}"><span class="menu-icon">◉</span><span>الإطارات</span></a><a href="/batteries" class="{% if request.url.path.startswith('/batteries') %}active{% endif %}"><span class="menu-icon">▰</span><span>البطاريات</span></a><a href="/fuel" class="{% if request.url.path.startswith('/fuel') %}active{% endif %}"><span class="menu-icon">⛽</span><span>الوقود</span></a><a href="/missions" class="{% if request.url.path.startswith('/missions') %}active{% endif %}"><span class="menu-icon">◆</span><span>المهمات</span></a><a href="/users" class="{% if request.url.path.startswith('/users') %}active{% endif %}"><span class="menu-icon">♙</span><span>المستخدمون</span></a></nav><div class="sidebar-spacer"></div><div class="sidebar-user">النظام المحلي<br>إدارة الأسطول والعتاد</div><a href="/logout" class="sidebar-logout"><span class="menu-icon">⇥</span><span>تسجيل الخروج</span></a></aside>
<div class="app-main"><header class="app-topbar"><span class="app-topbar-title">إدارة الأسطول والعتاد</span><div class="app-workbar" aria-label="أدوات التحرير"><button type="button" class="app-workbtn" data-em-action="undo" aria-label="تراجع" title="تراجع" disabled>↶ <span>تراجع</span></button><button type="button" class="app-workbtn" data-em-action="redo" aria-label="إعادة" title="إعادة" disabled>↷ <span>إعادة</span></button><span class="app-worksep"></span><button type="button" class="app-workbtn app-work-save" data-em-action="save" aria-label="حفظ" title="حفظ" disabled>💾 <span>حفظ</span></button><span class="app-work-status" data-state="clean">نظيف</span></div><span class="app-topbar-date" id="systemDate"></span></header><main class="container">{% block content %}{% endblock %}</main></div>
<script>
(function(){
const el=document.getElementById('systemDate');if(el){el.textContent=new Intl.DateTimeFormat('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date())}
const params=new URLSearchParams(window.location.search);const notice=params.get('notice');const noticeType=params.get('notice_type')||'warning';if(notice){const box=document.createElement('div');box.className='materiel-notice materiel-notice-'+noticeType;const icon=noticeType==='danger'?'⛔':noticeType==='success'?'✓':noticeType==='info'?'ℹ️':'⚠️';const iconEl=document.createElement('span');iconEl.className='materiel-notice-icon';iconEl.textContent=icon;const textEl=document.createElement('div');textEl.className='materiel-notice-text';textEl.textContent=notice;const close=document.createElement('button');close.type='button';close.className='materiel-notice-close';close.setAttribute('aria-label','إغلاق');close.textContent='×';box.append(iconEl,textEl,close);const main=document.querySelector('.container');if(main)main.prepend(box);close.addEventListener('click',()=>box.remove());window.setTimeout(()=>box.classList.add('materiel-notice-visible'),20);const clean=new URL(window.location.href);clean.searchParams.delete('notice');clean.searchParams.delete('notice_type');window.history.replaceState({},'',clean.toString())}
const mutationKey='materiel:mutation-completed';document.querySelectorAll('form[method="post"]').forEach(form=>{form.setAttribute('autocomplete','off');form.addEventListener('submit',()=>sessionStorage.setItem(mutationKey,'1'))});if(sessionStorage.getItem(mutationKey)==='1'){sessionStorage.removeItem(mutationKey)}window.addEventListener('pageshow',e=>{if(e.persisted)window.location.reload()});
document.querySelectorAll('input.search-box,input[id*="search" i],input[id*="Search"]').forEach(input=>{if(input.closest('.global-search-wrap')||input.type==='hidden')return;const parent=input.parentElement;if(!parent)return;const wrap=document.createElement('span');wrap.className='global-search-wrap';parent.insertBefore(wrap,input);wrap.appendChild(input);const search=document.createElement('button');search.type='button';search.className='global-search-btn';search.textContent='بحث';const clear=document.createElement('button');clear.type='button';clear.className='global-clear-btn';clear.textContent='إلغاء';clear.hidden=!input.value;wrap.append(search,clear);const fire=()=>input.dispatchEvent(new Event('input',{bubbles:true}));search.addEventListener('click',fire);clear.addEventListener('click',()=>{input.value='';clear.hidden=true;fire();input.dispatchEvent(new Event('change',{bubbles:true}))});input.addEventListener('input',()=>clear.hidden=!input.value)});
document.querySelectorAll('.table-scroll,.record-table-wrap,.table-wrap,.type-table-wrap').forEach(function(el){if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');if(!el.hasAttribute('role'))el.setAttribute('role','region');if(!el.getAttribute('aria-label'))el.setAttribute('aria-label','جدول البيانات');});
const p=window.location.pathname;
if(p==='/equipment/numerical-status'){const table=document.getElementById('numericalStatusTable');if(table){const heads=[...table.querySelectorAll('thead th')];const idx=heads.findIndex(h=>h.textContent.includes('% من الأب'));if(idx>=0){heads[idx].remove();table.querySelectorAll('tbody tr').forEach(r=>{if(r.children.length>idx)r.children[idx].remove()})}}}
const brandSelect=document.getElementById('statusBrand');if(brandSelect){const current=brandSelect.value;fetch('/api/equipment-brands',{headers:{Accept:'application/json'},credentials:'same-origin'}).then(r=>r.ok?r.json():[]).then(brands=>{const names=[...new Set((Array.isArray(brands)?brands:[]).map(b=>String(b.name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));brandSelect.innerHTML='<option value="">كل الماركات</option>';names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;brandSelect.appendChild(o)});brandSelect.value=names.includes(current)?current:'';brandSelect.dispatchEvent(new Event('change',{bubbles:true}))}).catch(()=>{})}
})();
</script>
</body>
</html>
