<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}إدارة الأسطول والعتاد{% endblock %}</title><link rel="stylesheet" href="/static/css/style.css">{% block extra_head %}{% endblock %}
<style>
body{margin:0;background:#f3f6fa;color:#172033;font-family:"Segoe UI",Tahoma,sans-serif}.app-sidebar{position:fixed;top:0;right:0;bottom:0;width:250px;background:linear-gradient(180deg,#082b49 0%,#071f35 100%);color:#fff;z-index:100;display:flex;flex-direction:column;box-shadow:-8px 0 28px rgba(15,23,42,.14)}.app-brand{padding:22px 18px 20px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:11px;font-size:16px;font-weight:800}.app-brand-icon{width:36px;height:36px;border:1px solid rgba(255,255,255,.22);border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.06)}.app-menu{padding:14px 10px;display:flex;flex-direction:column;gap:5px;overflow:auto}.app-menu a{display:flex;align-items:center;gap:12px;color:#c9d9e7;text-decoration:none;padding:11px 13px;border-radius:10px;font-size:12px;font-weight:650;transition:background .16s ease,color .16s ease,transform .16s ease}.app-menu a:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(-2px)}.app-menu a.active{background:linear-gradient(90deg,#0b83e5,#0869b7);color:#fff;box-shadow:0 6px 18px rgba(0,105,183,.22)}.menu-icon{width:21px;text-align:center;font-size:16px}.sidebar-spacer{flex:1}.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.09);color:#9eb6ca;font-size:10px;line-height:1.7}.sidebar-logout{display:flex;align-items:center;gap:11px;margin:0 10px 12px;padding:11px 13px;border-radius:10px;color:#ffd5d5;text-decoration:none;font-size:12px}.sidebar-logout:hover{background:rgba(255,80,80,.08)}.app-main{margin-right:250px;min-height:100vh}.app-topbar{height:62px;background:rgba(255,255,255,.94);border-bottom:1px solid #e4e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}.app-topbar-title{font-size:14px;font-weight:800;color:#163b5e}.app-topbar-date{font-size:11px;color:#7a8798;background:#f7f9fc;border:1px solid #e8edf3;padding:6px 10px;border-radius:8px}.container{max-width:1440px;margin:0 auto;padding:26px 28px 42px;box-sizing:border-box}@media(max-width:900px){.app-sidebar{width:205px}.app-main{margin-right:205px}.container{padding:20px}}@media(max-width:650px){.app-sidebar{position:relative;width:100%;height:auto}.app-main{margin-right:0}.app-menu{display:grid;grid-template-columns:repeat(2,1fr)}.sidebar-spacer,.sidebar-user{display:none}.app-topbar{position:relative;height:54px;padding:0 14px}.container{padding:16px 12px 28px}}
.global-search-wrap{display:inline-flex;align-items:center;gap:6px;min-width:0}.global-search-wrap>input{flex:1}.global-search-btn,.global-clear-btn{height:36px;border:1px solid #dce3e9;background:#fff;border-radius:8px;padding:0 11px;cursor:pointer;font:inherit;font-size:11px;font-weight:800;color:#173b63;white-space:nowrap}.global-clear-btn{color:#8b3f46}.global-clear-btn[hidden]{display:none}.model-setup-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}.model-setup-fields label{font-size:11px;font-weight:700;color:#475569}.model-setup-fields input,.model-setup-fields select{margin-top:4px;width:100%;box-sizing:border-box}.model-setup-note{grid-column:1/-1;font-size:11px;color:#64748b;line-height:1.7}.model-spec-extra{display:none;grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px;border-radius:8px;background:#fff;border:1px dashed #d7dee8}.model-spec-extra.is-visible{display:grid}.model-spec-title{grid-column:1/-1;font-size:11px;font-weight:800;color:#344054}.model-spec-help{grid-column:1/-1;font-size:10px;color:#98a2b3}.module-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 18px;padding:8px 10px;background:#fff;border:1px solid #e4e9ef;border-radius:11px;box-shadow:0 3px 12px rgba(15,23,42,.035)}.module-nav a{padding:7px 10px;border-radius:8px;color:#526273;text-decoration:none;font-size:10px;font-weight:800}.module-nav a:hover,.module-nav a.active{background:#eef5fb;color:#173b63}
.record-page{max-width:1380px;margin:0 auto}.record-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;color:#5d6b7b;text-decoration:none;font-size:11px;font-weight:700}.record-back:hover{color:#0b6ebd}.record-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 26px;margin-bottom:16px;border:1px solid #dfe7ef;border-radius:20px;background:linear-gradient(135deg,#ffffff 0%,#f6f9fc 100%);box-shadow:0 10px 28px rgba(15,23,42,.07)}.record-eyebrow{font-size:9px;letter-spacing:1.5px;color:#5f7d98;font-weight:900;margin-bottom:5px}.record-hero h2{margin:0;color:#123b5d;font-size:27px;line-height:1.2}.record-muted,.record-hint{color:#738196;font-size:11px;line-height:1.7}.record-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.record-panel{margin-bottom:16px;padding:20px;border:1px solid #e1e7ee;border-radius:17px;background:#fff;box-shadow:0 5px 20px rgba(15,23,42,.045)}.record-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.record-section-head h3{margin:0;color:#193e60;font-size:15px}.record-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.record-box{display:block;padding:13px 14px;border:1px solid #e7edf3;border-radius:12px;background:#fafbfd;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}.record-box:hover{transform:translateY(-1px);border-color:#c7d9e8;box-shadow:0 6px 16px rgba(15,23,42,.05)}.record-box span{display:block;color:#7b8797;font-size:10px;font-weight:700;margin-bottom:5px}.record-box b{display:block;color:#233c55;font-size:12px}.record-form.compact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.record-form.compact .field{padding:11px 13px;border:1px solid #e7edf3;border-radius:12px;background:#fff}.record-form.compact .field label{display:block;color:#7b8797;font-size:10px;font-weight:700;margin-bottom:4px}.record-form.compact .field>div{font-size:12px;font-weight:650;color:#253a50}.record-wide{grid-column:1/-1}.record-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.record-table{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #e5ebf1;border-radius:12px}.record-table th{padding:11px 10px;background:#f6f9fc;color:#536477;font-size:10px;font-weight:800;text-align:right;border-bottom:1px solid #e2e8ef;white-space:nowrap}.record-table td{padding:11px 10px;color:#33465a;font-size:11px;border-bottom:1px solid #edf1f5}.record-table tbody tr:last-child td{border-bottom:0}.record-table tbody tr:hover{background:#fbfcfe}.tire-serial-link{color:#1669a8;font-weight:800;text-decoration:none}.tire-serial-link:hover{text-decoration:underline}.record-badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800;white-space:nowrap}.record-badge.good{background:#eaf7ef;color:#277044}.record-badge.expired{background:#fff0f0;color:#a33636}.record-badge.damaged{background:#fff5e6;color:#91510b}.record-empty{padding:22px;text-align:center;border:1px dashed #cfd9e4;border-radius:12px;background:#fbfcfd;color:#7b8797;font-size:11px}.btn-primary,.btn-secondary,.btn-outline,.btn-danger{border-radius:9px!important;font-weight:800!important;text-decoration:none;cursor:pointer}.btn-primary{box-shadow:0 5px 14px rgba(10,110,190,.14)}.btn-danger{border:1px solid #e1b7b7;background:#fff4f4;color:#a03535;padding:8px 12px}.btn-danger:hover{background:#ffeaea}@media(max-width:850px){.record-hero{align-items:flex-start;flex-direction:column}.record-summary,.record-form.compact{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.record-hero{padding:18px}.record-hero h2{font-size:22px}.record-panel{padding:14px}.record-summary,.record-form.compact{grid-template-columns:1fr}.record-section-head{align-items:flex-start;flex-direction:column}.record-actions{width:100%}.record-actions .btn-primary,.record-actions .btn-outline,.record-actions .btn-secondary{flex:1;text-align:center}}
@media(max-width:800px){.model-setup-fields,.model-spec-extra{grid-template-columns:1fr 1fr}}@media(max-width:520px){.model-setup-fields,.model-spec-extra{grid-template-columns:1fr}}
</style>
</head>
<body>
