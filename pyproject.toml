[project]
name = "materiel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "passlib[bcrypt]==1.7.4",
