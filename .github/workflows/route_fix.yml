name: tire-route-fix
on:
  pull_request:
    types: [reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Normalize routes and run tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/modules/equipment_types/router.py'); s=p.read_text(encoding='utf-8')
          for path in ['/equipment-types/models/create','/equipment-types/models/{model_id}/update']:
              line=f'@router.post("{path}")'
              while line+'\n'+line in s: s=s.replace(line+'\n'+line,line,1)
          while 'import json\nimport json\n' in s: s=s.replace('import json\nimport json\n','import json\n')
          p.write_text(s,encoding='utf-8')
          PY
          python -m compileall -q app tests web run_web.py
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/equipment_types/router.py
          git rm -f .github/workflows/route_fix.yml
          git commit -m 'fix: normalize equipment type model routes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
