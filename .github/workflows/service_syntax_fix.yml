name: tire-service-syntax-fix
on:
  pull_request:
    types: [reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix nested f-string and test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/modules/equipment_types/services.py'); s=p.read_text(encoding='utf-8')
          bad='''    obj=TirePosition(equipment_model_id=equipment_model_id,axle_number=axle_number,side=side,position_type=position_type,code=f"M{equipment_model_id}-A{axle_number}-{side}-{position_type}",name=f"المحور {axle_number} — {"يسار" if side=="left" else "يمين"} {"مفرد" if position_type=="single" else "داخلي" if position_type=="inner" else "خارجي"}",description=(description or "").strip() or None,sort_order=axle_number); db.add(obj); db.commit(); db.refresh(obj); return obj'''
          good='''    side_name="يسار" if side=="left" else "يمين"\n    position_name="مفرد" if position_type=="single" else "داخلي" if position_type=="inner" else "خارجي"\n    obj=TirePosition(equipment_model_id=equipment_model_id,axle_number=axle_number,side=side,position_type=position_type,code=f"M{equipment_model_id}-A{axle_number}-{side}-{position_type}",name=f"المحور {axle_number} — {side_name} {position_name}",description=(description or "").strip() or None,sort_order=axle_number); db.add(obj); db.commit(); db.refresh(obj); return obj'''
          if bad not in s: raise SystemExit('nested f-string anchor missing')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
          python -m compileall -q app tests web run_web.py
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/equipment_types/services.py
          git rm -f .github/workflows/service_syntax_fix.yml
          git commit -m 'fix: correct tire position service syntax'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
