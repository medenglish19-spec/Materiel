name: Master Data verified repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'bootstrap master data repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified source repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/modules/equipment_types/templates/master_data_workspace.html')
          s=p.read_text()
          old='const CATEGORIES=Object.fromEntries({% for c in categories %}["{{ c.id }}","{{ c.name|replace(\'"\',\'\\\\\\"\') }}"]{% if not loop.last %},{% endif %}{% endfor %});'
          new='const CATEGORIES=Object.fromEntries([{% for c in categories %}[{{ c.id|string|tojson }},{{ c.name|tojson }}]{% if not loop.last %},{% endif %}{% endfor %}]);'
          assert old in s
          s=s.replace(old,new)
          old='const TYPES=Object.fromEntries({% for t in types %}["{{ t.id }}","{{ t.name|replace(\'"\',\'\\\\\\"\') }}"]{% if not loop.last %},{% endif %}{% endfor %});'
          new='const TYPES=Object.fromEntries([{% for t in types %}[{{ t.id|string|tojson }},{{ t.name|tojson }}]{% if not loop.last %},{% endif %}{% endfor %}]);'
          assert old in s
          s=s.replace(old,new)
          old='const BRAND_DATA={% for b in brands %}{"{{ b.id }}":{"name":"{{ b.name|replace(\'"\',\'\\\\\\"\') }}","active":{{ "true" if b.is_active else "false" }}}}{% if not loop.last %},{% endif %}{% endfor %}};'
          new='const BRAND_DATA=Object.fromEntries([{% for b in brands %}[{{ b.id|string|tojson }},{"name":{{ b.name|tojson }},"active":{{ "true" if b.is_active else "false" }}}]{% if not loop.last %},{% endif %}{% endfor %}]);'
          assert old in s
          s=s.replace(old,new)
          s=s.replace('<span class="tree-add" data-add="type">＋ نوع</span>','<span class="tree-add" data-add="type" data-new-type-for-category="{{ c.id }}">＋ نوع</span>')
          s=s.replace('<button class="tree-node" data-new-ref="type" type="button">＋ إضافة نوع عتاد</button>','<button class="tree-node" data-new-ref="type" data-new-type-for-category="{{ c.id }}" type="button">＋ إضافة نوع عتاد</button>')
          s=s.replace('<div class="tree-group">\n<button class="tree-node" data-ref-item="type"','<div class="tree-group{% set type_models = models|selectattr(\'equipment_type_id\',\'equalto\',t.id)|list %}{% if type_models %} open{% endif %}">\n<button class="tree-node" data-ref-item="type"')
          s=s.replace('{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>مصدر الفئة الفنية','{% for c in categories if not c.is_system %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>مصدر الفئة الفنية')
          old="if(id){if(extra.categoryId)form.querySelector('[name=\"category_id\"]').value=extra.categoryId;if(extra.libraryCategoryId)form.querySelector('[name=\"technical_library_category_id\"]').value=extra.libraryCategoryId;"
          new="form.querySelector('[name=\"category_id\"]').value=extra.categoryId||'';if(id){if(extra.libraryCategoryId)form.querySelector('[name=\"technical_library_category_id\"]').value=extra.libraryCategoryId;"
          assert old in s
          s=s.replace(old,new)
          old='window.show=show;window.title=title;window.resetModel=resetModel;window.openNewModel=openNewModel;window.refPanel=refPanel;window.editModel=editModel;window.viewModel=viewModel;window.refreshModelTypeContext=refreshModelTypeContext;'
          new='window.show=show;window.title=title;window.resetModel=resetModel;window.openNewModel=openNewModel;window.refPanel=refPanel;window.editModel=editModel;window.viewModel=viewModel;window.refreshModelTypeContext=refreshModelTypeContext;window.addPos=addPos;window.addSize=addSize;window.MATERIEL_MASTER_DATA={DATA,CATEGORIES,TYPES,BRANDS};'
          assert old in s
          s=s.replace(old,new)
          start=s.find("\n$('tree').addEventListener('click',e=>{")
          assert start >= 0
          end=s.find("\n$('modelForm').addEventListener",start)
          assert end > start
          s=s[:start]+s[end:]
          s=s.replace('/static/js/master-data-tree.js?v=master-data-workspace-6','/static/js/master-data-tree.js?v={{ tree_js_version|default(\'master-data-workspace-7\') }}')
          p.write_text(s)

          p=Path('app/modules/equipment_types/router.py'); s=p.read_text()
          if 'def _tree_js_version()' not in s:
              marker='router=APIRouter();templates=get_module_templates("app/modules/equipment_types/templates")\n'
              insert='router=APIRouter();templates=get_module_templates("app/modules/equipment_types/templates")\ndef _tree_js_version():\n    from pathlib import Path\n    return str(int(Path("static/js/master-data-tree.js").stat().st_mtime))\n'
              assert marker in s
              s=s.replace(marker,insert,1)
          old='"technical_library_types":technical_library_types,"user":current_user})'
          new='"technical_library_types":technical_library_types,"tree_js_version":_tree_js_version(),"user":current_user})'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('app/modules/equipment_types/services.py'); s=p.read_text()
          old='_sync_positions(db,obj.id,data.positions if data.has_tires else []);_sync_sizes(db,obj.id,data.tire_size,data.sizes if data.has_tires else [])'
          new='_sync_positions(db,obj.id,[p.model_copy(update={"id":None}) for p in (data.positions if data.has_tires else [])]);_sync_sizes(db,obj.id,data.tire_size,data.sizes if data.has_tires else [])'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('static/js/master-data-tree.js'); s=p.read_text()
          old="""  const openTypeCreate = (categoryId) => {\n    if (typeof window.refPanel !== 'function') return;\n    window.refPanel('type', null, '', { categoryId: String(categoryId || '') });\n    const input = document.querySelector('#refBody form [name=\"category_id\"]');\n    if (input) input.value = String(categoryId || '');\n  };\n  const openModelCreate = (typeId) => {\n    if (typeof window.resetModel === 'function') window.resetModel();\n    const select = $('modelType');\n    const option = select && typeId ? select.querySelector(`option[value=\"${CSS.escape(String(typeId))}\"]`) : null;\n    if (select && option) {\n      select.value = String(typeId);\n      if ($('modelCategory') && option.dataset.category) $('modelCategory').value = option.dataset.category;\n    }\n    if (typeof window.refreshModelTypeContext === 'function') window.refreshModelTypeContext(typeId || '');\n    if (typeof window.title === 'function') window.title('إضافة طراز', 'الطرازات');\n    if (typeof window.show === 'function') window.show($('modelPanel'));\n    selectSection(0);\n  };"""
          new="""  const workspaceReady = (name) => {\n    const fn = window[name];\n    if (typeof fn === 'function') return fn;\n    toast('تعذر فتح إجراء مركز البيانات: ' + name);\n    return null;\n  };\n  const openTypeCreate = (categoryId) => {\n    const fn = workspaceReady('refPanel');\n    if (!fn) return;\n    const value = String(categoryId || '');\n    fn('type', null, '', { categoryId: value });\n    const input = document.querySelector('#refBody form [name=\"category_id\"]');\n    if (input) input.value = value;\n  };\n  const openModelCreate = (typeId) => {\n    const fn = workspaceReady('openNewModel');\n    if (!fn) return;\n    fn(String(typeId || ''));\n    selectSection(0, { all: true });\n  };"""
          assert old in s
          s=s.replace(old,new,1)
          old="const safe = Math.max(0, Math.min(Number(index) || 0, boxes.length - 1));\n    boxes.forEach((box, i) => { box.hidden = i !== safe; box.setAttribute('aria-hidden', i === safe ? 'false' : 'true'); });"
          new="const safe = Math.max(0, Math.min(Number(index) || 0, boxes.length - 1));\n    if (options.all) boxes.forEach((box) => { box.hidden = false; box.setAttribute('aria-hidden', 'false'); });\n    else boxes.forEach((box, i) => { box.hidden = i !== safe; box.setAttribute('aria-hidden', i === safe ? 'false' : 'true'); });"
          assert old in s
          s=s.replace(old,new,1)
          start=s.find("  tree.addEventListener('click', (event) => {")
          end=s.find("\n\n  const style = document.createElement('style')",start)
          assert start >= 0 and end > start
          handler="""  tree.addEventListener('click', (event) => {\n    const action = event.target.closest('[data-add],[data-new-ref]');\n    if (action) { event.preventDefault(); event.stopPropagation(); const kind=action.dataset.add||action.dataset.newRef; if(kind==='type'&&action.dataset.newTypeForCategory) openTypeCreate(action.dataset.newTypeForCategory); else if(kind==='model') openModelCreate(action.dataset.newModelForType||''); else { const fn=workspaceReady('refPanel'); if(fn) fn(kind); } return; }\n    const position=event.target.closest('[data-tree-add]');\n    if(position){event.preventDefault();event.stopPropagation();const model=event.target.closest('[data-model]');const fn=workspaceReady('editModel');if(model&&fn){fn(model.dataset.model,position.dataset.treeAdd==='position'?'positions':'sizes');position.dataset.treeAdd==='position'?window.addPos?.():window.addSize?.();}return;}\n    const copy=event.target.closest('[data-copy]'); if(copy){event.preventDefault();event.stopPropagation();copyModel(copy.dataset.copy);return;}\n    const del=event.target.closest('[data-delete]'); if(del){event.preventDefault();event.stopPropagation();postDelete('/equipment-types/models/'+encodeURIComponent(del.dataset.delete)+'/delete','حذف الطراز؟');return;}\n    const toggle=event.target.closest('.tree-toggle'); if(toggle){event.preventDefault();event.stopPropagation();toggle.closest('.tree-group')?.classList.toggle('open');syncArrows();return;}\n    const row=event.target.closest('[data-model-row]'); if(row){const fn=workspaceReady('viewModel');if(fn){selectNode(row);fn(row.dataset.modelRow);}return;}\n    const model=event.target.closest('[data-model]'); if(model){const fn=workspaceReady('viewModel');if(fn){selectNode(model);fn(model.dataset.model);selectSection(sectionMap[model.dataset.section||'basic']||0,{focus:true});}return;}\n    const ref=event.target.closest('[data-ref-item]'); if(ref){editReference(ref);return;}\n    const node=event.target.closest('.tree-node'); if(node)selectNode(node);\n  }, true);"""
          s=s[:start]+handler+s[end:]
          p.write_text(s)
          PY
      - name: Verify
        run: |
          python -m compileall -q app web run_web.py
          python -m pytest -q tests/ -k master_data
          git diff --check
          node --check static/js/master-data-tree.js
          test "$(grep -o 'Object.fromEntries(\[' app/modules/equipment_types/templates/master_data_workspace.html | wc -l)" -ge 3
          ! grep -q "$('tree').addEventListener('click',e=>" app/modules/equipment_types/templates/master_data_workspace.html
      - name: Commit repaired source and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modules/equipment_types/templates/master_data_workspace.html app/modules/equipment_types/router.py app/modules/equipment_types/services.py static/js/master-data-tree.js
          git commit -m "fix(master-data): repair workspace interaction root cause"
          git push origin main
          git rm .github/workflows/master-data-repair.yml
          git commit -m "chore: remove temporary master data repair workflow"
          git push origin main
