name: migrate-tire-master-data
on:
  push:
    branches:
      - feat/move-tire-master-data-to-equipment-types
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, json, re, subprocess, textwrap

          ROOT = Path('.')

          def read(p): return (ROOT / p).read_text(encoding='utf-8')
          def write(p, s): (ROOT / p).write_text(s, encoding='utf-8')

          def remove_functions(source, names):
              tree = ast.parse(source)
              ranges=[]
              for n in tree.body:
                  if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name in names:
                      ranges.append((n.lineno-1, n.end_lineno))
              if not ranges: return source
              lines=source.splitlines(True)
              for a,b in reversed(ranges): del lines[a:b]
              return ''.join(lines)

          def replace_function(source, name, replacement):
              tree=ast.parse(source)
              target=None
              for n in tree.body:
                  if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name==name:
                      target=n; break
              if target is None: raise RuntimeError(f'missing function: {name}')
              lines=source.splitlines(True)
              start=target.lineno-1; end=target.end_lineno
              indent=''
              lines[start:end]=[replacement.rstrip()+"\n"]
              return ''.join(lines)

          # 1) Remove legacy tires configuration routes and templates.
          p=ROOT/'app/modules/tires/router.py'; s=read(p)
          s=remove_functions(s, {'tire_positions_page','tire_model_configuration','update_tire_model_configuration','create_model_size','create_model_position','delete_model_position','delete_model_size'})
          s=s.replace('from app.modules.equipment_types import services as equipment_type_services\n','')
          write(p,s)
          for p in [ROOT/'app/modules/tires/templates/tire_model_configuration.html', ROOT/'app/modules/tires/templates/tire_positions.html']:
              if p.exists(): p.unlink()

          # Remove the obsolete nav link.
          p=ROOT/'app/modules/tires/templates/tires.html'; s=read(p)
          s=re.sub(r'\s*<a[^>]+href=[\"\']/tires/positions[\"\'][^>]*>.*?</a>', '', s, flags=re.S)
          write(p,s)

          # 2) Move administration helpers out of tires.services.
          tires_services=read(ROOT/'app/modules/tires/services.py')
          helper_source=None
          try:
              t=ast.parse(tires_services)
              for n in t.body:
                  if isinstance(n, ast.FunctionDef) and n.name=='_assert_size_deletable':
                      helper_source=ast.get_source_segment(tires_services,n); break
          except SyntaxError: pass
          tires_services=remove_functions(tires_services, {'add_model_size','delete_model_size','add_position','delete_position'})
          write(ROOT/'app/modules/tires/services.py',tires_services)

          # 3) Schema additions.
          p=ROOT/'app/modules/equipment_types/schemas.py'; s=read(p)
          if 'class TirePositionInput' not in s:
              marker='class EquipmentModelCreate(BaseModel):'
              insert='''POSITION_SIDES = {"left", "right"}\nPOSITION_TYPES = {"single", "inner", "outer"}\n\nclass TirePositionInput(BaseModel):\n    id: Optional[int] = None\n    axle_number: int\n    side: str\n    position_type: str\n    description: Optional[str] = None\n\n    @field_validator("side")\n    @classmethod\n    def side_valid(cls, v: str) -> str:\n        if v not in POSITION_SIDES: raise ValueError("جهة الموضع غير صالحة")\n        return v\n\n    @field_validator("position_type")\n    @classmethod\n    def type_valid(cls, v: str) -> str:\n        if v not in POSITION_TYPES: raise ValueError("نوع الموضع غير صالح")\n        return v\n\n    @field_validator("axle_number")\n    @classmethod\n    def axle_valid(cls, v: int) -> int:\n        if v < 1: raise ValueError("رقم المحور غير صالح")\n        return v\n\n'''
              s=s.replace(marker,insert+marker)
              s=s.replace('    requires_driver: bool = True\n', '    requires_driver: bool = True\n    positions: list[TirePositionInput] = []\n    sizes: list[str] = []\n',1)
          write(p,s)

          # 4) Equipment-type services: add one-way tire-model administration and atomic model saves.
          p=ROOT/'app/modules/equipment_types/services.py'; s=read(p)
          if 'from app.modules.tires.models import TirePosition, TireModelSize, TireMovement' not in s:
              s=s.replace('from app.modules.equipment_types.schemas import ', 'from app.modules.tires.models import TirePosition, TireModelSize, TireMovement\nfrom app.modules.equipment_types.schemas import ')

          s=remove_functions(s, {'update_model_tire_configuration'})
          if helper_source:
              s=remove_functions(s, {'_assert_size_deletable'})
              helper_source=helper_source.replace('def _assert_size_deletable', 'def _assert_size_deletable')
          else:
              helper_source='''def _assert_size_deletable(db: Session, equipment_model_id: int, size_value: str) -> None:\n    size_key=(size_value or "").strip().lower()\n    if not size_key: return\n    from app.modules.tires.models import Tire\n    from app.modules.tires import state_engine\n    tires=db.query(Tire).filter(Tire.size.isnot(None)).all()\n    for tire in tires:\n        if (tire.size or "").strip().lower()!=size_key: continue\n        movements=db.query(TireMovement).filter(TireMovement.tire_id==tire.id).all()\n        if not movements: continue\n        state=state_engine.state_from_history(movements)\n        if state and state.get("installed"):\n            equipment=state.get("equipment")\n            equipment_id=state.get("equipment_id")\n            if equipment is None and equipment_id:\n                from app.modules.equipment.models import Equipment\n                equipment=db.query(Equipment).filter(Equipment.id==equipment_id).first()\n            if equipment and equipment.equipment_model_id==equipment_model_id:\n                raise ValueError("لا يمكن حذف مقاس مستخدم على إطار مركب لهذا الطراز")\n'''

          additions='''\n\nPOSITION_SIDES = {"left", "right"}\nPOSITION_TYPES = {"single", "inner", "outer"}\n\n%s\n\ndef _validate_tire_positions_and_sizes(db, data, existing_model_id=None):\n    if not data.has_tires:\n        if data.positions: raise ValueError("لا يمكن تعريف مواضع إطارات لطراز غير مزود بالإطارات")\n        if data.sizes: raise ValueError("لا يمكن تعريف مقاسات معتمدة لطراز غير مزود بالإطارات")\n        return\n    if len(data.positions) != data.tire_positions_required:\n        raise ValueError(f"يجب تعريف {data.tire_positions_required} موضع إطار بالضبط قبل حفظ الطراز (المعرَّف حاليًا في النموذج: {len(data.positions)})")\n    seen=set()\n    for p in data.positions:\n        key=(p.axle_number,p.side,p.position_type)\n        if key in seen: raise ValueError("توجد مواضع مكررة بنفس المحور والجهة والنوع")\n        seen.add(key)\n    existing_ids=set()\n    existing_sizes={}\n    if existing_model_id is not None:\n        existing_ids={row[0] for row in db.query(TirePosition.id).filter(TirePosition.equipment_model_id==existing_model_id).all()}\n        submitted_ids={p.id for p in data.positions if p.id is not None}\n        if submitted_ids-existing_ids: raise ValueError("توجد مواضع في النموذج لا تنتمي لهذا الطراز")\n        to_delete=existing_ids-submitted_ids\n        if to_delete and db.query(TireMovement.id).filter(TireMovement.position_id.in_(to_delete)).first():\n            raise ValueError("لا يمكن حذف موضع استُخدم في سجل حركات؛ حافظ على التاريخ")\n        existing_sizes={row.id:row.size for row in db.query(TireModelSize).filter(TireModelSize.equipment_model_id==existing_model_id).all()}\n    normalized=[]; seen_sizes=set()\n    for raw in data.sizes:\n        value=(raw or "").strip()\n        if not value: continue\n        key=value.lower()\n        if key in seen_sizes: raise ValueError(f"المقاس مكرر: {value}")\n        seen_sizes.add(key); normalized.append(value)\n    if not (data.tire_size or "").strip() and not normalized:\n        raise ValueError("هذا الطراز يملك إطارات؛ يجب تحديد المقاس الافتراضي أو إضافة مقاس معتمد واحد على الأقل")\n    if existing_model_id is not None:\n        submitted_norm={v.lower() for v in normalized}\n        for size_id,size_value in existing_sizes.items():\n            if (size_value or "").strip().lower() not in submitted_norm:\n                _assert_size_deletable(db, existing_model_id, size_value)\n\n\ndef _sync_positions(db, equipment_model_id, positions):\n    existing={p.id:p for p in db.query(TirePosition).filter(TirePosition.equipment_model_id==equipment_model_id).all()}\n    submitted_ids={p.id for p in positions if p.id is not None}\n    for pid,obj in existing.items():\n        if pid not in submitted_ids: db.delete(obj)\n    names={"left":"يسار","right":"يمين"}; types={"single":"مفرد","inner":"داخلي","outer":"خارجي"}\n    for p in positions:\n        if p.id is not None:\n            obj=existing[p.id]\n            obj.axle_number=p.axle_number; obj.side=p.side; obj.position_type=p.position_type\n            obj.name=f"المحور {p.axle_number} — {names[p.side]} {types[p.position_type]}"\n            obj.code=f"M{equipment_model_id}-A{p.axle_number}-{p.side}-{p.position_type}"\n            obj.description=(p.description or "").strip() or None; obj.sort_order=p.axle_number\n            continue\n        db.add(TirePosition(equipment_model_id=equipment_model_id,axle_number=p.axle_number,side=p.side,position_type=p.position_type,code=f"M{equipment_model_id}-A{p.axle_number}-{p.side}-{p.position_type}",name=f"المحور {p.axle_number} — {names[p.side]} {types[p.position_type]}",description=(p.description or "").strip() or None,sort_order=p.axle_number))\n\n\ndef _sync_sizes(db, equipment_model_id, tire_size, sizes):\n    existing={row.size.strip().lower():row for row in db.query(TireModelSize).filter(TireModelSize.equipment_model_id==equipment_model_id).all() if row.size}\n    normalized=[]\n    for raw in sizes:\n        value=(raw or "").strip()\n        if value and value.lower() not in {v.lower() for v in normalized}: normalized.append(value)\n    submitted={v.lower() for v in normalized}\n    for key,row in existing.items():\n        if key not in submitted: db.delete(row)\n    for value in normalized:\n        if value.lower() not in existing: db.add(TireModelSize(equipment_model_id=equipment_model_id,size=value))\n\ndef add_model_size(db: Session, equipment_model_id: int, size: str):\n    value=(size or "").strip()\n    if not value: raise ValueError("مقاس الإطار مطلوب")\n    model=db.query(EquipmentModel).filter(EquipmentModel.id==equipment_model_id).first()\n    if not model: raise ValueError("الطراز غير موجود")\n    if db.query(TireModelSize.id).filter(TireModelSize.equipment_model_id==equipment_model_id,TireModelSize.size.ilike(value)).first(): raise ValueError("المقاس موجود مسبقًا لهذا الطراز")\n    obj=TireModelSize(equipment_model_id=equipment_model_id,size=value); db.add(obj); db.commit(); db.refresh(obj); return obj\n\ndef delete_model_size(db: Session, size_id: int):\n    obj=db.query(TireModelSize).filter(TireModelSize.id==size_id).first()\n    if obj is None: raise ValueError("المقاس غير موجود")\n    _assert_size_deletable(db,obj.equipment_model_id,obj.size)\n    db.delete(obj); db.commit()\n\ndef add_position(db: Session, equipment_model_id: int, axle_number: int, side: str, position_type: str, description: str = ""):\n    if side not in POSITION_SIDES: raise ValueError("جهة الموضع غير صالحة")\n    if position_type not in POSITION_TYPES: raise ValueError("نوع الموضع غير صالح")\n    if axle_number < 1: raise ValueError("رقم المحور غير صالح")\n    if db.query(TirePosition.id).filter(TirePosition.equipment_model_id==equipment_model_id,TirePosition.axle_number==axle_number,TirePosition.side==side,TirePosition.position_type==position_type).first(): raise ValueError("الموضع موجود مسبقًا")\n    obj=TirePosition(equipment_model_id=equipment_model_id,axle_number=axle_number,side=side,position_type=position_type,code=f"M{equipment_model_id}-A{axle_number}-{side}-{position_type}",name=f"المحور {axle_number} — {\"يسار\" if side==\"left\" else \"يمين\"} {\"مفرد\" if position_type==\"single\" else \"داخلي\" if position_type==\"inner\" else \"خارجي\"}",description=(description or "").strip() or None,sort_order=axle_number); db.add(obj); db.commit(); db.refresh(obj); return obj\n\ndef delete_position(db: Session, position_id: int):\n    obj=db.query(TirePosition).filter(TirePosition.id==position_id).first()\n    if obj is None: raise ValueError("الموضع غير موجود")\n    if db.query(TireMovement.id).filter(TireMovement.position_id==position_id).first(): raise ValueError("لا يمكن حذف موضع استُخدم في سجل حركات؛ حافظ على التاريخ")\n    db.delete(obj); db.commit()\n\n''' % helper_source
          marker='def create_model(db:Session,data:EquipmentModelCreate)->EquipmentModel:'
          if '_validate_tire_positions_and_sizes' not in s:
              s=s.replace(marker, additions+'\n'+marker)

          # Relax the old single-default-size requirement; the new validator accepts an approved additional size.
          s=s.replace('    if data.has_tires and not (data.tire_size or "").strip(): raise ValueError("هذا الطراز يملك إطارات؛ يجب تحديد مقاس الإطار")\n','')
          s=s.replace('    if not data.has_tires and (data.tire_positions_required!=0 or data.tire_size): raise ValueError("بيانات الإطارات يجب أن تكون فارغة إذا كان الطراز لا يملك إطارات")\n','')

          create_fn='''def create_model(db:Session,data:EquipmentModelCreate)->EquipmentModel:\n    _validate_model_data(db,data)\n    _validate_tire_positions_and_sizes(db,data,None)\n    obj=EquipmentModel(name=data.name.strip(),equipment_type_id=data.equipment_type_id,brand_id=data.brand_id,has_tires=data.has_tires,tire_positions_required=data.tire_positions_required,tire_size=(data.tire_size or "").strip() or None,has_batteries=data.has_batteries,battery_count_required=data.battery_count_required,battery_capacity_ah=data.battery_capacity_ah,battery_voltage_v=data.battery_voltage_v,mobility_type=data.mobility_type,requires_driver=data.requires_driver)\n    db.add(obj); db.flush()\n    _sync_positions(db,obj.id,data.positions if data.has_tires else [])\n    _sync_sizes(db,obj.id,data.tire_size,data.sizes if data.has_tires else [])\n    db.commit(); db.refresh(obj); return obj\n'''
          update_fn='''def update_model(db:Session,obj:EquipmentModel,data:EquipmentModelCreate)->EquipmentModel:\n    if obj.is_frozen: raise ValueError("طراز العتاد مجمد؛ أعد اعتماده أولًا قبل تعديل بياناته")\n    _validate_model_data(db,data,obj=obj)\n    _validate_tire_positions_and_sizes(db,data,obj.id)\n    if data.equipment_type_id != obj.equipment_type_id:\n        from app.modules.equipment.models import Equipment\n        if db.query(Equipment.id).filter(Equipment.equipment_model_id==obj.id).first(): raise ValueError("لا يمكن نقل طراز مرتبط بعتاد فعلي إلى نوع آخر؛ حافظ على التاريخ والمرجع")\n    obj.name=data.name.strip(); obj.equipment_type_id=data.equipment_type_id; obj.brand_id=data.brand_id; obj.has_tires=data.has_tires; obj.tire_positions_required=data.tire_positions_required; obj.tire_size=(data.tire_size or "").strip() or None; obj.has_batteries=data.has_batteries; obj.battery_count_required=data.battery_count_required; obj.battery_capacity_ah=data.battery_capacity_ah; obj.battery_voltage_v=data.battery_voltage_v; obj.mobility_type=data.mobility_type; obj.requires_driver=data.requires_driver\n    _sync_positions(db,obj.id,data.positions if data.has_tires else [])\n    _sync_sizes(db,obj.id,data.tire_size,data.sizes if data.has_tires else [])\n    db.commit(); db.refresh(obj); return obj\n'''
          s=replace_function(s,'create_model',create_fn)
          s=replace_function(s,'update_model',update_fn)
          write(p,s)

          # 5) Equipment-types router: JSON form fields + model tire data for the editor.
          p=ROOT/'app/modules/equipment_types/router.py'; s=read(p)
          s=s.replace('from fastapi import APIRouter, Depends, Form, HTTPException, Request\n','from fastapi import APIRouter, Depends, Form, HTTPException, Request\nimport json\n')
          if 'from app.modules.tires.models import TireModelSize, TirePosition' not in s:
              s=s.replace('from app.modules.users.models import User\n','from app.modules.users.models import User\nfrom app.modules.tires.models import TireModelSize, TirePosition\n')
          old='''def types_page(request:Request,db:Session=Depends(get_db),current_user:User=Depends(require_role(Role.ADMIN))):\n    return templates.TemplateResponse("master_data_workspace.html",{"request":request,"types":services.list_types(db),"categories":services.list_categories(db),"brands":services.list_brands(db),"models":services.list_models(db),"user":current_user})'''
          new='''def types_page(request:Request,db:Session=Depends(get_db),current_user:User=Depends(require_role(Role.ADMIN))):\n    models=services.list_models(db)\n    tire_master_data={}\n    for model in models:\n        tire_master_data[model.id]={\n            "positions":[{"id":p.id,"axle_number":p.axle_number,"side":p.side,"position_type":p.position_type,"description":p.description} for p in db.query(TirePosition).filter(TirePosition.equipment_model_id==model.id).order_by(TirePosition.axle_number,TirePosition.sort_order,TirePosition.id).all()],\n            "sizes":[row.size for row in db.query(TireModelSize).filter(TireModelSize.equipment_model_id==model.id).order_by(TireModelSize.id).all()],\n        }\n    return templates.TemplateResponse("master_data_workspace.html",{"request":request,"types":services.list_types(db),"categories":services.list_categories(db),"brands":services.list_brands(db),"models":models,"tire_master_data":tire_master_data,"user":current_user})'''
          s=s.replace(old,new)

          def replace_route_params(src, fn_name):
              tree=ast.parse(src); target=None
              for n in tree.body:
                  if isinstance(n,ast.FunctionDef) and n.name==fn_name: target=n; break
              if not target: raise RuntimeError(fn_name)
              # line-based replacement for the whole function keeps the rest untouched.
              lines=src.splitlines(True); a=target.lineno-1; b=target.end_lineno
              if fn_name=='create_model_form':
                  repl='''@router.post("/equipment-types/models/create")\ndef create_model_form(name:str=Form(...),equipment_type_id:int=Form(...),brand_id:int=Form(...),has_tires:bool=Form(False),tire_positions_required:int=Form(0),tire_size:str=Form(""),positions_json:str=Form("[]"),sizes_json:str=Form("[]"),has_batteries:bool=Form(False),battery_count_required:int=Form(0),battery_capacity_ah:str=Form(""),battery_voltage_v:str=Form(""),mobility_type:str=Form("mobile"),requires_driver:bool=Form(True),db:Session=Depends(get_db),current_user:User=Depends(require_role(Role.ADMIN))):\n    try:\n        positions_data=json.loads(positions_json); sizes_data=json.loads(sizes_json)\n        if not isinstance(positions_data,list) or not isinstance(sizes_data,list): raise ValueError("بيانات المواضع أو المقاسات غير صالحة")\n        services.create_model(db,EquipmentModelCreate(name=name,equipment_type_id=equipment_type_id,brand_id=brand_id,has_tires=has_tires,tire_positions_required=tire_positions_required,tire_size=tire_size.strip() or None,positions=positions_data,sizes=sizes_data,has_batteries=has_batteries,battery_count_required=battery_count_required,battery_capacity_ah=None if not battery_capacity_ah.strip() else float(battery_capacity_ah),battery_voltage_v=None if not battery_voltage_v.strip() else float(battery_voltage_v),mobility_type=mobility_type,requires_driver=requires_driver))\n    except (ValueError,TypeError) as exc:\n        db.rollback(); return _redirect(str(exc),"warning")\n    return _redirect("تمت إضافة الطراز والمواصفات")\n'''
              else:
                  repl='''@router.post("/equipment-types/models/{model_id}/update")\ndef update_model_form(model_id:int,name:str=Form(...),equipment_type_id:int=Form(...),brand_id:int=Form(...),has_tires:bool=Form(False),tire_positions_required:int=Form(0),tire_size:str=Form(""),positions_json:str=Form("[]"),sizes_json:str=Form("[]"),has_batteries:bool=Form(False),battery_count_required:int=Form(0),battery_capacity_ah:str=Form(""),battery_voltage_v:str=Form(""),mobility_type:str=Form("mobile"),requires_driver:bool=Form(True),db:Session=Depends(get_db),current_user:User=Depends(require_role(Role.ADMIN))):\n    obj=services.get_model(db,model_id)\n    if obj is None: raise HTTPException(status_code=404,detail="طراز العتاد غير موجود")\n    try:\n        positions_data=json.loads(positions_json); sizes_data=json.loads(sizes_json)\n        if not isinstance(positions_data,list) or not isinstance(sizes_data,list): raise ValueError("بيانات المواضع أو المقاسات غير صالحة")\n        services.update_model(db,obj,EquipmentModelCreate(name=name,equipment_type_id=equipment_type_id,brand_id=brand_id,has_tires=has_tires,tire_positions_required=tire_positions_required,tire_size=tire_size.strip() or None,positions=positions_data,sizes=sizes_data,has_batteries=has_batteries,battery_count_required=battery_count_required,battery_capacity_ah=None if not battery_capacity_ah.strip() else float(battery_capacity_ah),battery_voltage_v=None if not battery_voltage_v.strip() else float(battery_voltage_v),mobility_type=mobility_type,requires_driver=requires_driver))\n    except (ValueError,TypeError) as exc:\n        db.rollback(); return _redirect(str(exc),"warning")\n    return _redirect("تم حفظ تعديلات الطراز والمواصفات")\n'''
              lines[a:b]=[repl]
              return ''.join(lines)
          s=replace_route_params(s,'create_model_form'); s=replace_route_params(s,'update_model_form')
          write(p,s)

          # 6) Master-data template with positions and additional size chips.
          template='''{% extends "base.html" %}\n{% block title %}مركز البيانات الأساسية{% endblock %}\n{% block content %}\n<div dir="rtl" class="master-data-page">\n<style>\n.master-data-page{padding:24px;max-width:1600px;margin:auto}.md-header{background:linear-gradient(135deg,#173b63,#285f8f);color:#fff;border-radius:20px;padding:24px;margin-bottom:18px}.md-header h1{margin:0 0 6px}.md-header p{margin:0;opacity:.86}.md-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.9fr);gap:18px}.md-card{background:#fff;border:1px solid #e4e9ef;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.md-card h2{margin:0;color:#173b63}.md-eyebrow{font-size:11px;font-weight:800;color:#64748b}.md-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.md-fields label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#334155}.md-fields input,.md-fields select,.md-search input,.tire-size-input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d7dee8;border-radius:10px;background:#fff;font:inherit}.md-check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;padding:10px 12px;border:1px solid #e3e8ef;border-radius:10px;background:#f8fafc}.md-check input{width:auto}.md-spec{margin-top:14px;padding:15px;border:1px solid #e3e8ef;border-radius:13px;background:#f8fafc}.md-spec h3{margin:0 0 10px;color:#173b63}.md-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.md-actions button,.edit-model,.mini-btn{border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700}.primary{background:#173b63;color:#fff}.secondary,.edit-model,.mini-btn{background:#edf3f8;color:#173b63}.mini-btn.danger{background:#fee2e2;color:#991b1b}.position-toolbar,.size-toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:12px}.position-toolbar label,.size-toolbar label{flex:1;min-width:110px}.position-table{width:100%;border-collapse:collapse;margin-top:12px}.position-table th,.position-table td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:right}.position-table input,.position-table select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d7dee8;border-radius:8px}.position-count{margin-top:8px;font-size:12px;font-weight:800;color:#475569}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#e8f0f7;color:#173b63;font-weight:700;font-size:12px}.chip button{border:0;background:transparent;color:#991b1b;cursor:pointer;font-weight:900}.disabled-note{font-size:12px;color:#64748b;margin-top:8px}.md-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0 10px}.md-tabs button{border:1px solid #d8e0e8;background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:700}.md-tabs button.active{background:#173b63;color:#fff}.md-panel{display:none}.md-panel.active{display:block}.table-wrap{overflow:auto}.table-wrap table{width:100%;border-collapse:collapse;min-width:520px}.table-wrap th,.table-wrap td{padding:10px;border-bottom:1px solid #edf1f5;text-align:right;white-space:nowrap}.table-wrap th{background:#f8fafc;color:#64748b;font-size:12px}.md-search{margin-bottom:10px}@media(max-width:1000px){.md-layout{grid-template-columns:1fr}}@media(max-width:650px){.master-data-page{padding:12px}.md-fields{grid-template-columns:1fr}.md-card{padding:14px}}\n</style>\n<section class="md-header"><h1>مركز البيانات الأساسية</h1><p>إدارة موحدة للفئات والأنواع والعلامات والطرازات ومواصفاتها.</p></section>\n<div class="md-layout">\n<section class="md-card"><span class="md-eyebrow">MASTER DATA / MODEL</span><h2 id="editorTitle">محرر الطراز</h2>\n<form id="modelForm" method="post" action="/equipment-types/models/create" onsubmit="return prepareModelSubmit(event)"><input type="hidden" id="modelId" value=""><input type="hidden" id="positionsJson" name="positions_json" value="[]"><input type="hidden" id="sizesJson" name="sizes_json" value="[]"><div class="md-fields"><label>اسم الطراز<input id="modelName" name="name" required></label><label>العلامة<select id="modelBrand" name="brand_id" required>{% for brand in brands %}<option value="{{ brand.id }}">{{ brand.name }}</option>{% endfor %}</select></label><label>نوع العتاد<select id="modelType" name="equipment_type_id" required>{% for type in types %}<option value="{{ type.id }}">{{ type.name }}</option>{% endfor %}</select></label><label>الحركة<select id="mobility" name="mobility_type"><option value="mobile">متحرك</option><option value="towed">مجرور</option></select></label><label class="md-check"><input id="requiresDriver" type="checkbox" name="requires_driver" checked> يتطلب سائقًا</label></div>\n<div class="md-spec" id="tireSpec"><h3>الإطارات</h3><label class="md-check"><input id="hasTires" type="checkbox" name="has_tires"> مجهز بإطارات</label><div class="md-fields"><label>عدد مواضع الإطارات<input id="tirePositions" name="tire_positions_required" type="number" min="0" value="0"></label><label>مقاس الإطار الافتراضي<input id="tireSize" name="tire_size"></label></div>\n<div class="size-toolbar"><label>إضافة مقاس معتمد إضافي<input id="sizeInput" class="tire-size-input" placeholder="مثال: 315/80R22.5"></label><button type="button" id="addSize" class="mini-btn">إضافة</button></div><div id="sizeChips" class="chips"></div>\n<div class="position-toolbar"><label>المحور<input id="positionAxle" type="number" min="1" value="1"></label><label>الجهة<select id="positionSide"><option value="left">يسار</option><option value="right">يمين</option></select></label><label>النوع<select id="positionType"><option value="single">مفرد</option><option value="inner">داخلي</option><option value="outer">خارجي</option></select></label><label>الوصف<input id="positionDescription"></label><button type="button" id="addPosition" class="mini-btn">إضافة موضع</button></div><div id="positionCountNote" class="position-count">المواضع المعرّفة: 0 / 0</div><div class="table-wrap"><table class="position-table"><thead><tr><th>المحور</th><th>الجهة</th><th>النوع</th><th>الوصف</th><th></th></tr></thead><tbody id="positionsBody"></tbody></table></div><div id="tireDisabledNote" class="disabled-note">فعّل «مجهز بإطارات» لإدارة المواضع والمقاسات المعتمدة.</div></div>\n<div class="md-spec"><h3>البطاريات</h3><label class="md-check"><input id="hasBatteries" type="checkbox" name="has_batteries"> مجهز ببطاريات</label><div class="md-fields"><label>عدد البطاريات<input id="batteryCount" name="battery_count_required" type="number" min="0" value="0"></label><label>السعة Ah<input id="batteryCapacity" name="battery_capacity_ah" type="number" step="0.01"></label><label>الجهد V<input id="batteryVoltage" name="battery_voltage_v" type="number" step="0.01"></label></div></div>\n<div class="md-actions"><button type="submit" class="primary">حفظ الطراز</button><button type="button" id="newModel" class="secondary">نموذج جديد</button></div></form></section>\n<section class="md-card"><span class="md-eyebrow">REFERENCE DATA</span><h2>إدارة المراجع</h2><div class="md-tabs"><button type="button" class="active" data-tab="models">الطرازات</button><button type="button" data-tab="types">الأنواع</button><button type="button" data-tab="brands">العلامات</button><button type="button" data-tab="categories">الفئات</button></div><div class="md-search"><input id="mdSearch" placeholder="بحث..."></div>\n<div id="panel-models" class="md-panel active"><div class="table-wrap"><table><thead><tr><th>الطراز</th><th>العلامة</th><th>النوع</th><th>الإطارات</th><th>إجراء</th></tr></thead><tbody>{% for model in models %}{% set td=tire_master_data.get(model.id, {'positions': [], 'sizes': []}) %}<tr><td>{{ model.name }}</td><td>{{ model.brand.name if model.brand else '—' }}</td><td>{{ model.equipment_type.name if model.equipment_type else '—' }}</td><td>{{ 'نعم' if model.has_tires else 'لا' }}</td><td><button type="button" class="edit-model" data-id="{{ model.id }}" data-name="{{ model.name|e }}" data-brand="{{ model.brand_id }}" data-type="{{ model.equipment_type_id }}" data-tires="{{ '1' if model.has_tires else '0' }}" data-tire-count="{{ model.tire_positions_required }}" data-tire-size="{{ model.tire_size or ''|e }}" data-batteries="{{ '1' if model.has_batteries else '0' }}" data-battery-count="{{ model.battery_count_required }}" data-capacity="{{ model.battery_capacity_ah or '' }}" data-voltage="{{ model.battery_voltage_v or '' }}" data-mobility="{{ model.mobility_type }}" data-driver="{{ '1' if model.requires_driver else '0' }}" data-positions='{{ td.positions|tojson|e }}' data-sizes='{{ td.sizes|tojson|e }}'>تعديل</button></td></tr>{% else %}<tr><td colspan="5">لا توجد طرازات.</td></tr>{% endfor %}</tbody></table></div></div>\n<div id="panel-types" class="md-panel"><div class="table-wrap"><table><thead><tr><th>النوع</th><th>الفئة</th><th>الوحدة</th></tr></thead><tbody>{% for type in types %}<tr><td>{{ type.name }}</td><td>{{ type.category.name if type.category else '—' }}</td><td>{{ type.measurement_unit }}</td></tr>{% endfor %}</tbody></table></div></div>\n<div id="panel-brands" class="md-panel"><div class="table-wrap"><table><thead><tr><th>العلامة</th><th>الحالة</th></tr></thead><tbody>{% for brand in brands %}<tr><td>{{ brand.name }}</td><td>{{ 'نشطة' if brand.is_active else 'موقوفة' }}</td></tr>{% endfor %}</tbody></table></div></div>\n<div id="panel-categories" class="md-panel"><div class="table-wrap"><table><thead><tr><th>الفئة</th><th>الرمز</th></tr></thead><tbody>{% for category in categories %}<tr><td>{{ category.name }}</td><td>{{ category.code or '—' }}</td></tr>{% endfor %}</tbody></table></div></div></section></div>\n<script>\n(function(){\nconst f=document.getElementById('modelForm'), hasTires=document.getElementById('hasTires'), tirePositions=document.getElementById('tirePositions'), positionsBody=document.getElementById('positionsBody'), positionCountNote=document.getElementById('positionCountNote'), addPosition=document.getElementById('addPosition'), sizeInput=document.getElementById('sizeInput'), sizeChips=document.getElementById('sizeChips'), addSize=document.getElementById('addSize'), positionsJson=document.getElementById('positionsJson'), sizesJson=document.getElementById('sizesJson');\nlet positions=[], sizes=[];\nfunction refresh(){const enabled=hasTires.checked, limit=Math.max(0,parseInt(tirePositions.value||'0',10)); document.getElementById('tireDisabledNote').style.display=enabled?'none':'block'; document.getElementById('positionAxle').disabled=!enabled; document.getElementById('positionSide').disabled=!enabled; document.getElementById('positionType').disabled=!enabled; document.getElementById('positionDescription').disabled=!enabled; addPosition.disabled=!enabled||positions.length>=limit||limit<1; sizeInput.disabled=!enabled; addSize.disabled=!enabled; positionCountNote.textContent=`المواضع المعرّفة: ${positions.length} / ${limit}`; renderPositions(); renderSizes();}\nfunction renderPositions(){positionsBody.innerHTML=''; positions.forEach((p,i)=>{const tr=document.createElement('tr'); tr.innerHTML=`<td><input type="number" min="1" value="${p.axle_number}"></td><td><select><option value="left" ${p.side==='left'?'selected':''}>يسار</option><option value="right" ${p.side==='right'?'selected':''}>يمين</option></select></td><td><select><option value="single" ${p.position_type==='single'?'selected':''}>مفرد</option><option value="inner" ${p.position_type==='inner'?'selected':''}>داخلي</option><option value="outer" ${p.position_type==='outer'?'selected':''}>خارجي</option></select></td><td><input value="${p.description||''}"></td><td><button type="button" class="mini-btn danger">حذف</button></td>`; const ins=tr.querySelectorAll('input,select'); ins[0].onchange=e=>p.axle_number=parseInt(e.target.value,10); ins[1].onchange=e=>p.side=e.target.value; ins[2].onchange=e=>p.position_type=e.target.value; ins[3].onchange=e=>p.description=e.target.value; tr.querySelector('button').onclick=()=>{positions.splice(i,1);refresh()}; positionsBody.appendChild(tr)})}\nfunction renderSizes(){sizeChips.innerHTML=''; sizes.forEach((s,i)=>{const chip=document.createElement('span');chip.className='chip';chip.innerHTML=`${s}<button type="button" aria-label="حذف">×</button>`;chip.querySelector('button').onclick=()=>{sizes.splice(i,1);refresh()};sizeChips.appendChild(chip)})}\naddPosition.onclick=()=>{const limit=parseInt(tirePositions.value||'0',10);if(!hasTires.checked||positions.length>=limit)return;positions.push({id:null,axle_number:parseInt(document.getElementById('positionAxle').value||'1',10),side:document.getElementById('positionSide').value,position_type:document.getElementById('positionType').value,description:document.getElementById('positionDescription').value.trim()});document.getElementById('positionDescription').value='';refresh()};\naddSize.onclick=()=>{const value=sizeInput.value.trim();if(!value||!hasTires.checked)return;if(!sizes.some(x=>x.toLowerCase()===value.toLowerCase()))sizes.push(value);sizeInput.value='';refresh()};\ntirePositions.oninput=refresh; hasTires.onchange=refresh;\nwindow.prepareModelSubmit=function(event){if(hasTires.checked){const limit=parseInt(tirePositions.value||'0',10);if(positions.length!==limit){event.preventDefault();alert(`لا يمكن حفظ الطراز: يجب تعريف ${limit} موضعًا بالضبط. المعرّف حاليًا: ${positions.length}.`);return false;}} else if(positions.length||sizes.length){event.preventDefault();alert('لا يمكن حفظ بيانات مواضع أو مقاسات لطراز غير مزود بالإطارات.');return false;} positionsJson.value=JSON.stringify(positions);sizesJson.value=JSON.stringify(sizes);return true};\nfunction load(d){f.action='/equipment-types/models/'+d.id+'/update';document.getElementById('modelId').value=d.id;document.getElementById('editorTitle').textContent='تعديل الطراز';document.getElementById('modelName').value=d.name;document.getElementById('modelBrand').value=d.brand;document.getElementById('modelType').value=d.type;document.getElementById('mobility').value=d.mobility;document.getElementById('requiresDriver').checked=d.driver==='1';hasTires.checked=d.tires==='1';tirePositions.value=d.tireCount;tireSize.value=d.tireSize;document.getElementById('hasBatteries').checked=d.batteries==='1';document.getElementById('batteryCount').value=d.batteryCount;document.getElementById('batteryCapacity').value=d.capacity;document.getElementById('batteryVoltage').value=d.voltage;positions=JSON.parse(d.positions||'[]');sizes=JSON.parse(d.sizes||'[]');refresh();window.scrollTo({top:0,behavior:'smooth'})}\ndocument.querySelectorAll('.edit-model').forEach(b=>b.onclick=()=>load(b.dataset));\ndocument.getElementById('newModel').onclick=()=>{f.action='/equipment-types/models/create';document.getElementById('modelId').value='';document.getElementById('editorTitle').textContent='محرر الطراز';f.reset();document.getElementById('requiresDriver').checked=true;positions=[];sizes=[];refresh()};\ndocument.querySelectorAll('.md-tabs button').forEach(t=>t.onclick=()=>{document.querySelectorAll('.md-tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.md-panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('panel-'+t.dataset.tab).classList.add('active')});const search=document.getElementById('mdSearch');search.oninput=()=>{const q=search.value.toLowerCase();document.querySelector('.md-panel.active').querySelectorAll('tbody tr').forEach(r=>r.style.display=!q||r.textContent.toLowerCase().includes(q)?'':'none')};\nrefresh();\n})();\n</script>\n</div>{% endblock %}\n'''
          write(ROOT/'app/modules/equipment_types/templates/master_data_workspace.html',template)

          # 7) Tests for the strict, atomic rules and route removal.
          test='''import pytest\nfrom datetime import date, datetime\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import sessionmaker\nfrom sqlalchemy.pool import StaticPool\nfrom app.database.base import Base\nfrom app.modules.equipment_types.models import EquipmentBrand, EquipmentCategory, EquipmentModel, EquipmentType\nfrom app.modules.equipment_types.schemas import EquipmentModelCreate\nfrom app.modules.equipment_types import services\nfrom app.modules.tires.models import Tire, TireMovement, TireModelSize, TirePosition\n\nengine=create_engine("sqlite:///:memory:",connect_args={"check_same_thread":False},poolclass=StaticPool)\nSession=sessionmaker(bind=engine)\n\ndef db_new():\n    Base.metadata.drop_all(engine); Base.metadata.create_all(engine); return Session()\n\ndef base(db):\n    cat=EquipmentCategory(name="اختبار",code="TEST",is_system=True); brand=EquipmentBrand(name="اختبار",is_active=True); db.add_all([cat,brand]); db.flush(); typ=EquipmentType(name="مركبات اختبار",measurement_unit="km",category_id=cat.id); db.add(typ); db.flush(); return typ,brand\n\ndef data(typ,brand,positions, sizes=None, tire_size="315/80R22.5"):\n    return EquipmentModelCreate(name="طراز اختبار",equipment_type_id=typ.id,brand_id=brand.id,has_tires=True,tire_positions_required=len(positions),tire_size=tire_size,positions=positions,sizes=sizes or [],has_batteries=False)\n\ndef pos(axle=1,side="left",kind="single",id=None): return {"id":id,"axle_number":axle,"side":side,"position_type":kind,"description":""}\n\ndef test_create_rejects_wrong_position_count_without_model():\n    db=db_new(); typ,brand=base(db)\n    try:\n        d=data(typ,brand,[pos(1)],sizes=[])\n        d.tire_positions_required=2\n        with pytest.raises(ValueError,match="بالضبط") : services.create_model(db,d)\n        assert db.query(EquipmentModel).count()==0\n        assert db.query(TirePosition).count()==0\n    finally: db.close()\n\ndef test_create_matching_positions_is_atomic_and_persists_sizes():\n    db=db_new(); typ,brand=base(db)\n    try:\n        d=data(typ,brand,[pos(1,"left"),pos(1,"right")],sizes=["12R22.5"])\n        model=services.create_model(db,d)\n        assert db.query(TirePosition).filter_by(equipment_model_id=model.id).count()==2\n        assert [x.size for x in db.query(TireModelSize).filter_by(equipment_model_id=model.id).all()]==["12R22.5"]\n    finally: db.close()\n\ndef test_create_without_default_or_additional_size_is_rejected():\n    db=db_new(); typ,brand=base(db)\n    try:\n        d=data(typ,brand,[pos(1)],sizes=[],tire_size="")\n        with pytest.raises(ValueError,match="مقاس") : services.create_model(db,d)\n        assert db.query(EquipmentModel).count()==0\n    finally: db.close()\n\ndef test_update_cannot_delete_position_used_by_movement():\n    db=db_new(); typ,brand=base(db)\n    try:\n        model=services.create_model(db,data(typ,brand,[pos(1)]))\n        position=db.query(TirePosition).filter_by(equipment_model_id=model.id).one()\n        tire=Tire(serial_number="TEST-TIRE-1",size="315/80R22.5",expiry_date=date(2030,1,1)); db.add(tire); db.flush()\n        from app.modules.equipment.models import Equipment\n        equipment=Equipment(asset_code="TEST-EQ-1",equipment_type_id=typ.id,equipment_model_id=model.id); db.add(equipment); db.flush()\n        db.add(TireMovement(tire_id=tire.id,movement_date=date(2026,9,1),movement_datetime=datetime(2026,9,1,10),movement_type="install",equipment_id=equipment.id,position_id=position.id)); db.commit()\n        d=data(typ,brand,[]) ; d.name=model.name; d.tire_positions_required=0\n        with pytest.raises(ValueError,match="حافظ على التاريخ"): services.update_model(db,model,d)\n        db.rollback(); db.refresh(model); assert db.query(TirePosition).filter_by(id=position.id).first() is not None\n    finally: db.close()\n\ndef test_non_tire_model_rejects_submitted_tire_configuration():\n    db=db_new(); typ,brand=base(db)\n    try:\n        d=EquipmentModelCreate(name="بدون إطارات",equipment_type_id=typ.id,brand_id=brand.id,has_tires=False,positions=[pos(1)],sizes=[])\n        with pytest.raises(ValueError,match="غير مزود") : services.create_model(db,d)\n        assert db.query(EquipmentModel).count()==0\n    finally: db.close()\n\ndef test_removed_tire_configuration_routes_are_not_registered():\n    from app.modules.tires.router import router\n    paths={route.path for route in router.routes}\n    assert "/tires/positions" not in paths\n    assert "/tires/models/{model_id}/configuration" not in paths\n'''
          write(ROOT/'tests/test_master_data_tire_positions.py',test)

          # 8) Search for forbidden legacy references.
          forbidden=[]
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() not in {'.py','.html','.js','.md','.txt'}: continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              for token in ['tire_model_configuration','tire_positions.html','/tires/positions','/tires/models/']:
                  if token in text: forbidden.append(f'{p}:{token}')
          if forbidden: raise RuntimeError('Legacy references remain: '+', '.join(forbidden))
          print('Migration edits completed')
          PY
      - name: Syntax and tests
        run: |
          python -m compileall -q app tests
          pytest -q
      - name: Commit migration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/migrate_tire_master_data.yml
          git commit -m "refactor: move tire positions and sizes to master data"
          git push origin HEAD:feat/move-tire-master-data-to-equipment-types
