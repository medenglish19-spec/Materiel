name: Python application tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check repository filenames
        shell: bash
        run: |
          set -euo pipefail
          bad=()
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            if [[ "$name" =~ ^[0-9]+$ || "$name" == *" "* || "$name" == *'"'* || "$name" == *"'"* ]]; then
              bad+=("$path")
            fi
          done < <(git ls-files -z)
          if ((${#bad[@]})); then
            printf 'أسماء ملفات غير مسموحة:\n%s\n' "${bad[@]}"
            exit 1
          fi

      - name: Syntax check
        run: python -m compileall -q app web run_web.py

      - name: Alembic migration smoke test
        env:
          DATABASE_URL: sqlite:///./ci_migration_test.db
        run: |
          set -euxo pipefail
          rm -f ci_migration_test.db
          alembic upgrade head
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          version = db.execute("SELECT version_num FROM alembic_version").fetchone()[0]
          print(f"Alembic head: {version}")
          assert version == "0019_type_theoretical_quantity"
          required = {"faults", "repairs", "spare_parts", "repair_parts", "tires", "batteries", "fuel", "missions"}
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = required - tables
          assert not missing, f"Missing tables: {sorted(missing)}"
          db.close()
          PY

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-results.xml
          if-no-files-found: warn

# Automated verification trigger for the meter-history fix.
