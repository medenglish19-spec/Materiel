name: Python application tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply surgical master-data timing fix
        if: ${{ contains(github.event.head_commit.message, 'retry surgical timing fix') }}
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('static/js/master-data-tree.js')
          text = path.read_text(encoding='utf-8')
          matches = list(re.finditer(r'(?m)^\s*buildRealHierarchy\(\);\s*$', text))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one direct buildRealHierarchy call, found {len(matches)}')
          start, end = matches[0].span()
          replacement = "  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', buildRealHierarchy, { once: true });\n  } else {\n    buildRealHierarchy();\n  }"
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Verify surgical master-data diff
        if: ${{ contains(github.event.head_commit.message, 'retry surgical timing fix') }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "static/js/master-data-tree.js"
          grep -F "document.addEventListener('DOMContentLoaded', buildRealHierarchy, { once: true });" static/js/master-data-tree.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check repository filenames
        shell: bash
        run: |
          set -euo pipefail
          bad=()
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            if [[ "$name" =~ ^[0-9]+$ || "$name" == *" "* || "$name" == *'"'* || "$name" == *"'"* ]]; then
              bad+=("$path")
            fi
          done < <(git ls-files -z)
          if ((${#bad[@]})); then
            printf 'أسماء ملفات غير مسموحة:\n%s\n' "${bad[@]}"
            exit 1
          fi

      - name: Syntax check
        run: python -m compileall -q app web run_web.py

      - name: SQLite migration 0007 recovery test
        env:
          DATABASE_URL: sqlite:///./ci_migration_test.db
        run: |
          set -euxo pipefail
          rm -f ci_migration_test.db
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          db.executescript("""
          CREATE TABLE users (id INTEGER PRIMARY KEY);
          CREATE TABLE equipment (id INTEGER PRIMARY KEY);
          CREATE TABLE maintenance_records (id INTEGER PRIMARY KEY);
          CREATE TABLE alembic_version (version_num VARCHAR(32) NOT NULL);
          INSERT INTO alembic_version(version_num) VALUES ('0006_model_theoretical_quantity');
          """)
          db.commit(); db.close()
          PY
          alembic upgrade 0007_faults_repairs
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          assert db.execute("SELECT version_num FROM alembic_version").fetchone()[0] == "0007_faults_repairs"
          required = {"faults", "repairs", "spare_parts", "repair_parts"}
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required <= tables
          db.execute("UPDATE alembic_version SET version_num = '0006_model_theoretical_quantity'")
          db.commit(); db.close()
          PY
          alembic upgrade 0007_faults_repairs
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          assert db.execute("SELECT version_num FROM alembic_version").fetchone()[0] == "0007_faults_repairs"
          required = {"faults", "repairs", "spare_parts", "repair_parts"}
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required <= tables
          db.close()
          print("0007 recovery test passed")
          PY

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Finalize surgical fix and restore CI workflow
        if: ${{ contains(github.event.head_commit.message, 'retry surgical timing fix') }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --unshallow origin main
          git checkout acc91b4c7814ed73971b9a008b5200a503d8ccd8 -- .github/workflows/python-package-conda.yml
          git rm .github/workflows/_apply_master_data_timing_fix.yml
          git add static/js/master-data-tree.js .github/workflows/python-package-conda.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "static/js/master-data-tree.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(master-data): run hierarchy after DATA initialization"
          git push

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-results.xml
          if-no-files-found: warn

# Automated verification trigger for the meter-history fix.
