name: Python application tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check repository filenames
        shell: bash
        run: |
          set -euo pipefail
          bad=()
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            if [[ "$name" =~ ^[0-9]+$ || "$name" == *" "* || "$name" == *'"'* || "$name" == *"'"* ]]; then
              bad+=("$path")
            fi
          done < <(git ls-files -z)
          if ((${#bad[@]})); then
            printf 'أسماء ملفات غير مسموحة:\n%s\n' "${bad[@]}"
            exit 1
          fi

      - name: Syntax check
        run: python -m compileall -q app web run_web.py

      - name: SQLite migration 0007 recovery test
        env:
          DATABASE_URL: sqlite:///./ci_migration_test.db
        run: |
          set -euxo pipefail
          rm -f ci_migration_test.db
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          db.executescript("""
          CREATE TABLE users (id INTEGER PRIMARY KEY);
          CREATE TABLE equipment (id INTEGER PRIMARY KEY);
          CREATE TABLE maintenance_records (id INTEGER PRIMARY KEY);
          CREATE TABLE alembic_version (version_num VARCHAR(32) NOT NULL);
          INSERT INTO alembic_version(version_num) VALUES ('0006_model_theoretical_quantity');
          """)
          db.commit()
          db.close()
          PY
          alembic upgrade 0007_faults_repairs
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          version = db.execute("SELECT version_num FROM alembic_version").fetchone()[0]
          assert version == "0007_faults_repairs", version
          required = {"faults", "repairs", "spare_parts", "repair_parts"}
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required <= tables, sorted(required - tables)
          db.execute("UPDATE alembic_version SET version_num = '0006_model_theoretical_quantity'")
          db.commit()
          db.close()
          PY
          alembic upgrade 0007_faults_repairs
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          version = db.execute("SELECT version_num FROM alembic_version").fetchone()[0]
          assert version == "0007_faults_repairs", version
          required = {"faults", "repairs", "spare_parts", "repair_parts"}
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table')}
          assert required <= tables, sorted(required - tables)
          db.close()
          print("0007 recovery test passed")
          PY

      - name: Repair master data script loading in working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/modules/equipment_types/templates/master_data_workspace.html")
          s = p.read_text(encoding="utf-8")
          marker = '<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>\n'
          direct = '<script src="/static/js/master-data-tree.js"></script>\n'
          if direct not in s:
              if marker not in s:
                  raise SystemExit("Excel script marker not found")
              p.write_text(s.replace(marker, marker + direct, 1), encoding="utf-8")
          PY

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Persist verified template fix and remove temporary repair workflows
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/python-package-conda.yml
          rm -f .github/workflows/repair-master-data-script.yml .github/workflows/repair-master-data-script-v2.yml
          git add app/modules/equipment_types/templates/master_data_workspace.html
          git add -u .github/workflows
          if git diff --cached --quiet; then
            echo "No repository change required."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: load master data tree script directly'
          git push

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-results.xml
          if-no-files-found: warn

# Automated verification trigger for the meter-history fix.
