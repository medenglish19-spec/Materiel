name: Python application tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check repository filenames
        shell: bash
        run: |
          set -euo pipefail
          bad=()
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            if [[ "$name" =~ ^[0-9]+$ || "$name" == *" "* || "$name" == *'"'* || "$name" == *"'"* ]]; then
              bad+=("$path")
            fi
          done < <(git ls-files -z)
          if ((${#bad[@]})); then
            printf 'أسماء ملفات غير مسموحة:\n%s\n' "${bad[@]}"
            exit 1
          fi

      - name: Syntax check
        run: python -m compileall -q app web run_web.py

      - name: SQLite migration 0007 recovery test
        env:
          DATABASE_URL: sqlite:///./ci_migration_test.db
        run: |
          set -euxo pipefail
          rm -f ci_migration_test.db
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          db.executescript("""
          CREATE TABLE users (id INTEGER PRIMARY KEY);
          CREATE TABLE equipment (id INTEGER PRIMARY KEY);
          CREATE TABLE maintenance_records (id INTEGER PRIMARY KEY);
          CREATE TABLE alembic_version (version_num VARCHAR(32) NOT NULL);
          INSERT INTO alembic_version(version_num) VALUES ('0006_model_theoretical_quantity');
          """)
          db.commit()
          db.close()
          PY
          alembic upgrade 0007_faults_repairs
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          version = db.execute("SELECT version_num FROM alembic_version").fetchone()[0]
          assert version == "0007_faults_repairs", version
          required = {"faults", "repairs", "spare_parts", "repair_parts"}
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required <= tables, sorted(required - tables)
          # Simulate an interrupted SQLite migration whose DDL completed but
          # whose Alembic version update did not persist.
          db.execute("UPDATE alembic_version SET version_num = '0006_model_theoretical_quantity'")
          db.commit()
          db.close()
          PY
          alembic upgrade 0007_faults_repairs
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ci_migration_test.db")
          version = db.execute("SELECT version_num FROM alembic_version").fetchone()[0]
          assert version == "0007_faults_repairs", version
          required = {"faults", "repairs", "spare_parts", "repair_parts"}
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required <= tables, sorted(required - tables)
          db.close()
          print("0007 recovery test passed")
          PY

      - name: Build a fresh database the way the app does
        # Not "alembic upgrade head": the chain starts from a 0006 baseline that
        # expects its tables to already exist, so upgrading an empty file fails
        # with "no such table: equipment_models". A new install goes through
        # create_all + stamp head, and that is the path worth checking.
        env:
          DATABASE_URL: sqlite:///./ci_health_check.db
        run: |
          set -euxo pipefail
          rm -f ci_health_check.db
          python -c "from app.database.init_db import init_db; init_db()"

      - name: Check that the app enforces foreign keys
        # Every ON DELETE in the schema is decorative unless SQLite is told to
        # enforce it, which is how 704 orphaned rows accumulated. This fails the
        # build if the pragma stops being set on each new connection.
        run: |
          set -euxo pipefail
          DATABASE_URL=sqlite:///./ci_health_check.db python - <<'PY'
          from sqlalchemy import text
          from app.database.session import engine
          assert engine.connect().execute(text("PRAGMA foreign_keys")).fetchone()[0] == 1
          print("foreign key enforcement is on")
          PY

      - name: Check that a freshly built database is healthy
        # Catches a model change that orphans rows, or a revision that no longer
        # matches the head, before either reaches an install. Read-only, and it
        # exits non-zero on a real problem, so a failure below is a real fault.
        run: python scripts/check_db_health.py ci_health_check.db

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-results.xml
          if-no-files-found: warn

# Automated verification trigger for the meter-history fix.\n
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Run real Chromium tests for search and Enter behavior
        run: python -m pytest -q tests/edit_manager/test_edit_manager.py
