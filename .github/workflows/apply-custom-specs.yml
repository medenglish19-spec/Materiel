name: Apply custom specs implementation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/equipment-model-custom-specs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply implementation
        run: python .github/scripts/apply_custom_specs_v2.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add free equipment model custom specs"
          git push origin HEAD:${{ github.head_ref }}
