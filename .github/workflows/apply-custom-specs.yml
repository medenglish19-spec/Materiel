name: Apply custom specs implementation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/equipment-model-custom-specs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Harden implementation script
        run: >-
          python -c "from pathlib import Path;import re;p=Path('.github/scripts/apply_custom_specs.py');s=p.read_text(encoding='utf-8');start=s.index('# Add axle upper-bound validation');end=s.index('# Inject sync before final commit');m=re.search(r'([^\\n]*توجد مواضع إطارات مكررة[^\\n]*\\n)',s);assert m,'missing duplicate-position validation';addition='        if data.axle_count is not None:\\n            invalid=[p.axle_number for p in data.positions if p.axle_number>data.axle_count]\n            if invalid: raise ValueError(f\"رقم المحور {max(invalid)} يتجاوز عدد محاور الطراز المحدد ({data.axle_count})\")\\n';s=s[:start]+'# Add axle upper-bound validation after duplicate-position check.\\n'+"m=re.search(r'([^\\n]*توجد مواضع إطارات مكررة[^\\n]*\\n)',s)\\n"+"assert m,'missing duplicate-position validation in service source'\\n"+"s=s[:m.end()]+addition+s[m.end():]\\n"+s[end:];p.write_text(s,encoding='utf-8')"
      - name: Apply implementation
        run: python .github/scripts/apply_custom_specs.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add free equipment model custom specs"
          git push origin HEAD:${{ github.head_ref }}
