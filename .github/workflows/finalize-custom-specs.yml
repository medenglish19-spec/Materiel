name: Finalize custom specs
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/equipment-model-custom-specs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python .github/scripts/finalize_custom_specs.py
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: finalize custom specs integration"
          git push origin HEAD:${{ github.head_ref }}
