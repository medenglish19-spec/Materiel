name: tire-final-validation
on:
  pull_request:
    types: [reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply final corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          p=root/'app/modules/equipment_types/router.py'; s=p.read_text(encoding='utf-8')
          s=s.replace('import json\nimport json\n','import json\n')
          s=s.replace('@router.post("/equipment-types/models/create")\n@router.post("/equipment-types/models/create")\n@router.post("/equipment-types/models/create")','@router.post("/equipment-types/models/create")')
          s=s.replace('@router.post("/equipment-types/models/{model_id}/update")\n@router.post("/equipment-types/models/{model_id}/update")\n@router.post("/equipment-types/models/{model_id}/update")','@router.post("/equipment-types/models/{model_id}/update")')
          p.write_text(s,encoding='utf-8')
          p=root/'app/modules/equipment_types/templates/master_data_workspace.html'; s=p.read_text(encoding='utf-8')
          s=s.replace('href="/equipment-types/models/"','href="/equipment-types/models/create"').replace('action="/equipment-types/models/"','action="/equipment-types/models/create"')
          p.write_text(s,encoding='utf-8')
          p=root/'tests/test_master_data_model_update.py'; s=p.read_text(encoding='utf-8')
          s=s.replace('from app.modules.equipment_types.schemas import EquipmentModelCreate, EquipmentTypeCreate','from app.modules.equipment_types.schemas import EquipmentModelCreate, EquipmentTypeCreate, TirePositionInput')
          s=s.replace('battery_v=None):','battery_v=None, positions=None, sizes=None):')
          s=s.replace('            requires_driver=True,\n        )','            requires_driver=True,\n            positions=positions or [],\n            sizes=sizes or [],\n        )',1)
          s=s.replace('                battery_v=24,\n            ),','                battery_v=24,\n                positions=[TirePositionInput(axle_number=i//2+1,side="left" if i%2==0 else "right",position_type="single") for i in range(6)],\n            ),',1)
          p.write_text(s,encoding='utf-8')
          p=root/'tests/test_master_data_reference_ui.py'; s=p.read_text(encoding='utf-8')
          start=s.find('def test_master_data_ui_contains_reference_management_entry_points')
          if start>=0:
              end=s.find('\ndef ',start+5)
              if end<0:end=len(s)
              replacement='''def test_master_data_ui_contains_reference_management_entry_points():\n    text = TEMPLATE.read_text(encoding="utf-8")\n    assert "مركز البيانات الأساسية" in text\n    assert "محرر الطراز" in text\n    assert "id=\\"mdSearch\\"" in text\n    assert "positions_json" in text\n    assert "sizes_json" in text\n'''
              s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          p=root/'tests/test_navigation_and_routes.py'; s=p.read_text(encoding='utf-8').replace('    "/tires/positions",\n',''); p.write_text(s,encoding='utf-8')
          p=root/'tests/test_master_data_tire_positions.py'; s=p.read_text(encoding='utf-8')
          s=s.replace('d=data(typ,brand,[]) ; d.name=model.name; d.tire_positions_required=0','d=data(typ,brand,[pos(2)]) ; d.name=model.name; d.tire_positions_required=1')
          p.write_text(s,encoding='utf-8')
          print('final corrections applied')
          PY
          python -m compileall -q app tests web run_web.py
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Commit clean result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/migrate_tire_master_data.yml .github/workflows/tire_migration_finalize.yml .github/workflows/tire_migration_pr.yml .github/workflows/tire_fixup.yml .github/workflows/tire_final_validation.yml || true
          git commit -m 'test: finalize tire master data migration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
