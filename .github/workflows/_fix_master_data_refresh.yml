name: _fix_master_data_refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch dynamic page cache policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/modules/equipment_types/router.py')
          s = p.read_text()
          old = '    return templates.TemplateResponse("master_data_workspace.html",{"request":request,"types":types,"categories":categories,"brands":brands,"models":models,"tire_master_data":tire_master_data,"spec_definitions":spec_definitions,"user":current_user})'
          new = '    response = templates.TemplateResponse("master_data_workspace.html",{"request":request,"types":types,"categories":categories,"brands":brands,"models":models,"tire_master_data":tire_master_data,"spec_definitions":spec_definitions,"user":current_user})\n    response.headers["Cache-Control"] = "no-store, no-cache, must-revalidate, max-age=0"\n    response.headers["Pragma"] = "no-cache"\n    response.headers["Expires"] = "0"\n    return response'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile app/modules/equipment_types/router.py
      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/_fix_master_data_refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/equipment_types/router.py .github/workflows/_fix_master_data_refresh.yml
          git diff --cached --check
          git commit -m 'fix(master-data): refresh master data after mutations'
          git push origin HEAD:main
