name: Repair master data script loading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: load master data tree script directly'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch template surgically
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/modules/equipment_types/templates/master_data_workspace.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>\n'
          direct = '<script src="/static/js/master-data-tree.js"></script>\n'
          if direct not in s:
              if marker not in s:
                  raise SystemExit('Excel script marker not found')
              s = s.replace(marker, marker + direct, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Run focused contract test
        run: python -m pytest -q tests/test_master_data_restored_workflows_contract.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-master-data-script.yml
          git add app/modules/equipment_types/templates/master_data_workspace.html
          git commit -m 'fix: load master data tree script directly'
          git push
