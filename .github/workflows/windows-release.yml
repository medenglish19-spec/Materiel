name: Windows release

on:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "app/**"
      - "migrations/**"
      - "requirements.txt"
      - "run_web.py"
      - "splash-screen/**"
      - "static/**"
      - "tests/**"
      - "web/**"
      - "windows/**"
  push:
    branches:
      - stage3-maintenance-operations
    paths:
      - ".github/workflows/windows-release.yml"
      - "app/**"
      - "migrations/**"
      - "requirements.txt"
      - "run_web.py"
      - "splash-screen/**"
      - "static/**"
      - "tests/**"
      - "web/**"
      - "windows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Run test suite
        run: python -m pytest -q
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "Materiel\build"
          $release = Join-Path $env:RUNNER_TEMP "Materiel\release"
          .\windows\build_windows.ps1 -BuildDirectory $build -ReleaseDirectory $release
      - name: Install, start, update, and verify packaged application
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "Materiel\release\Materiel-Setup.exe"
          .\windows\smoke_test_installer.ps1 -InstallerPath $installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Materiel-Windows-x64
          path: ${{ runner.temp }}\Materiel\release\Materiel-Setup.exe
          if-no-files-found: error
