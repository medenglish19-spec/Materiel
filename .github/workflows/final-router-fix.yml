name: Final router cleanup
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/equipment-model-custom-specs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python .github/scripts/final_router_fix.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modules/equipment_types/router.py
          git diff --cached --quiet || git commit -m "fix: normalize custom specs form parsing"
          git push origin HEAD:${{ github.head_ref }}
