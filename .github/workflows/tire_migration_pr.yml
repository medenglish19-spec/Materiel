name: tire-master-data-migration-pr
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  migrate-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply requested migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/migrate_tire_master_data.yml').read_text(encoding='utf-8')
          a=wf.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          b=wf.index("\n          PY\n",a)
          code=textwrap.dedent(wf[a:b])
          code=code.replace('ranges.append((n.lineno-1, n.end_lineno))','ranges.append((min([d.lineno-1 for d in n.decorator_list], default=n.lineno-1), n.end_lineno))')
          code=code.replace("for token in ['tire_model_configuration','tire_positions.html','/tires/positions','/tires/models/']:","for token in ['tire_model_configuration','tire_positions.html','/tires/positions','/tires/models/{model_id}/configuration']:")
          exec(compile(code,'tire_migration.py','exec'),{'__name__':'__main__'})
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Syntax and tests
        continue-on-error: true
        run: |
          python -m compileall -q app web run_web.py
          python -m pytest -q
      - name: Verify removed routes
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('app/modules/tires/router.py').read_text(encoding='utf-8')
          assert '/tires/positions' not in r
          assert '/tires/models/{model_id}/configuration' not in r
          assert not Path('app/modules/tires/templates/tire_model_configuration.html').exists()
          assert not Path('app/modules/tires/templates/tire_positions.html').exists()
          PY
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: move tire master data into equipment types' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
