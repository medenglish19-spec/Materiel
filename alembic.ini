[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# No sqlalchemy.url here on purpose. migrations/env.py resolves the URL as
# "whatever the caller passed to Config.set_main_option, else the database the
# app is configured for", and a value in this file would take precedence over
# the caller's without anyone noticing. Point Alembic somewhere else with
# Config.set_main_option("sqlalchemy.url", ...), or with the DATABASE_URL
# environment variable.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
