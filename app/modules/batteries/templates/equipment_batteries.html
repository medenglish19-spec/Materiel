<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطارية العتاد</title><style>body{font-family:Arial;background:#f5f7fb}.wrap{max-width:900px;margin:30px auto;padding:0 18px}.panel{background:#fff;border-radius:16px;padding:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}</style></head><body><div class="wrap"><div class="panel"><h1>بطارية {{ equipment.registration_number or equipment.asset_code }}</h1><table><tr><th>الرقم</th><th>الماركة</th><th>الطراز</th><th>الصلاحية</th></tr>{% for b in items %}<tr><td>{{ b.serial_number }}</td><td>{{ b.brand or '-' }}</td><td>{{ b.model or '-' }}</td><td>{{ b.expiry_date or '-' }}</td></tr>{% else %}<tr><td colspan="4">لا توجد بطارية مركبة حاليًا.</td></tr>{% endfor %}</table></div></div></body></html>
