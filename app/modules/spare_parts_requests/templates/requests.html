<style>
/* لا شريط أدوات تحرير في أعلى هذه الصفحة: التعديل يتم داخل بيانات الطلب نفسه. */
.app-workbar{display:none}
.spr .rf textarea{width:100%;box-sizing:border-box;font:inherit;font-size:10px;border:1px solid #dce4ea;border-radius:6px;padding:6px;background:#fff;resize:vertical}
.spr .rf input,.spr .rf select,.spr .items-t input,.spr .items-t select{width:100%;box-sizing:border-box;font:inherit;font-size:10px;border:1px solid #dce4ea;border-radius:6px;padding:5px 6px;background:#fff}
.spr .rf input:focus,.spr .rf select:focus,.spr .items-t input:focus,.spr .items-t select:focus{outline:2px solid #bcdcf7;border-color:#0875d1}
.spr .rf-ro{background:#f8fafc}
.spr .rf-wide{grid-column:1/-1;margin-bottom:10px}
.spr .items-t input,.spr .items-t select{min-width:110px;max-width:100%}
.spr .items-t .i-name{min-width:180px}
.spr .items-t input:disabled,.spr .items-t select:disabled{background:#f4f6f8;color:#8794a2}
.spr .items-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.spr .detail-foot{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid #edf1f4}
.spr .detail-foot .msg{margin-top:0}
.spr tr.item-line.gone{display:none}
.spr .line-note{font-size:9px;color:#b42318}
</style>
<div class="spr">
  <div class="top"><div><h1>طلبات الغيار</h1><div class="muted">إدارة الطلبات المرتبطة بالأعطال والتصليحات وسجل الاستلام.</div></div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><a href="/spare-parts-received" class="secondary" style="text-decoration:none">سجل قطع الغيار المستلم</a><button id="newBtn">+ طلب غيار جديد</button></div></div>
  <div class="panel">
    <div class="bar">
      <select id="filterStatus"><option value="">كل الحالات</option><option value="pending">قيد الانتظار</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option><option value="cancelled">ملغى</option></select>
      <select id="filterSource"><option value="">كل المصادر</option><option value="fault">الأعطال</option><option value="repair">التصليحات</option></select>
      <span id="pendingCount" class="badge">قيد الانتظار: 0</span>
    </div>
    <form id="requestForm" class="form" style="display:none" novalidate>
      <input name="request_number" id="requestNumber" placeholder="رقم وثيقة الطلب *" required>
      <select name="source_type" id="sourceType"><option value="">مصدر الطلب *</option><option value="fault">عطل</option><option value="repair">تصليح</option></select>
      <select name="source_id" id="sourceId" required><option value="">اختر المصدر *</option></select>
      <input name="request_date" id="requestDate" type="date" required>
      <input id="equipmentView" placeholder="رقم التسجيل" readonly>
      <textarea name="notes" id="requestNotes" class="wide" placeholder="ملاحظات"></textarea>
      <div class="wide">
        <b>بنود الطلب</b>
        <div id="newItems"></div>
        <button type="button" class="secondary" id="addRequestItem">+ إضافة بند</button>
      </div>
      <div class="wide"><button type="submit" id="saveRequest">حفظ الطلب</button><span id="formMsg"></span></div>
    </form>
    <div class="table-scroll"><table><thead><tr><th>رقم وثيقة الطلب</th><th>التاريخ</th><th>المصدر</th><th>العتاد</th><th>رقم التسجيل</th><th>رقم التقرير</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
const PARTS={{ parts|map(attribute='id')|list|tojson }};
const PART_NAMES={{ parts|map(attribute='name')|list|tojson }};
const PART_NUMBERS={{ parts|map(attribute='part_number')|list|tojson }};
const STATUS={pending:'قيد الانتظار',approved:'مقبول',rejected:'مرفوض',cancelled:'ملغى'};
const SOURCE={fault:'الأعطال',repair:'التصليحات'};
const RECEIPT_BEFORE_REQUEST='تاريخ الاستلام لا يمكن أن يكون قبل تاريخ الطلب.';
const DUPLICATE_PART='قطعة الغيار موجودة بالفعل في الطلب.';
const RECEIPT_CONFLICT='طلب الغيار هذا له تاريخ استلام واحد. افتح طلب غيار جديد للاستلام الجديد.';
/* التحقق قد يعود مصفوفة حقول، فنصهرها نصاً يُقرأ بدل «[object Object]». */
function errText(d,fallback){
  /* الخادم يأتي بمحمول {detail:'…'} ولا مع msg: فاصل العيان العربية أبدًا مع الرسالة العامة. */
  if(d&&typeof d==='object'&&!Array.isArray(d)&&typeof d.detail!=='undefined') return errText(d.detail,fallback);
  if(Array.isArray(d)) return d.map(function(x){return x&&x.msg?x.msg:String(x);}).join(' — ');
  if(d&&typeof d==='object') return d.msg||fallback;
  return d||fallback;
}
const sourceType=document.getElementById('sourceType'),sourceId=document.getElementById('sourceId'),requestDate=document.getElementById('requestDate'),equipmentView=document.getElementById('equipmentView');
const repairId=new URLSearchParams(location.search).get('repair_id');

async function loadSources(){
  sourceId.innerHTML='<option value="">اختر المصدر *</option>';
  if(!sourceType.value)return;
  const r=await fetch('/api/spare-parts-requests/sources/'+sourceType.value,{credentials:'same-origin'});
  const data=await r.json();
  data.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent='#'+x.id+' — '+x.report_number+' — '+x.registration_number;o.dataset.date=x.date;o.dataset.registration=x.registration_number;sourceId.appendChild(o);});
}
sourceType.addEventListener('change',loadSources);
sourceId.addEventListener('change',()=>{const o=sourceId.options[sourceId.selectedIndex];if(!o||!o.value)return;requestDate.value=o.dataset.date||'';equipmentView.value=o.dataset.registration||'—';});

document.getElementById('newBtn').addEventListener('click',()=>{const f=document.getElementById('requestForm');f.style.display=f.style.display==='none'?'grid':'none';});

async function openRepairRequest(){
  if(!repairId)return;
  const f=document.getElementById('requestForm');f.style.display='grid';sourceType.value='repair';await loadSources();sourceId.value=repairId;sourceId.dispatchEvent(new Event('change'));
}

function addRequestItemRow(){
  const wrap=document.createElement('div');wrap.className='new-item';
  wrap.innerHTML='<input class="new-name" placeholder="اسم قطعة الغيار *"><select class="new-part"><option value="">— بدون ربط بالمخزون —</option>'+PARTS.map((id,i)=>'<option value="'+id+'">'+esc(PART_NAMES[i]||'—')+(PART_NUMBERS[i]?' — '+esc(PART_NUMBERS[i]):'')+'</option>').join('')+'</select><input class="new-qty" type="number" min="1" step="1" placeholder="الكمية المطلوبة *" required><input class="new-note" placeholder="ملاحظات"><button type="button" class="secondary remove-request-item">حذف</button>';
  document.getElementById('newItems').appendChild(wrap);
}
document.getElementById('addRequestItem').addEventListener('click',addRequestItemRow);

document.getElementById('requestForm').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    const fd=new FormData(e.target);
    const rows=[...document.querySelectorAll('#newItems .new-item')];
    const items=rows.map(row=>{const partRaw=row.querySelector('.new-part').value;const name=row.querySelector('.new-name').value.trim();return {spare_part_id:partRaw?Number(partRaw):null,part_name:name||null,requested_quantity:Number(row.querySelector('.new-qty').value||0),notes:row.querySelector('.new-note').value.trim()||null};}).filter(x=>(x.spare_part_id||x.part_name)&&x.requested_quantity>0);
    const msg=document.getElementById('formMsg');
    if(!rows.length){msg.textContent='أضف بندًا واحدًا على الأقل';msg.className='msg err';return;}
    if(items.length<rows.length){msg.textContent='أكمل كل بند: اكتب اسم قطعة الغيار وأدخل الكمية قبل الحفظ';msg.className='msg err';return;}
    const body={request_number:fd.get('request_number'),request_date:fd.get('request_date'),source_type:fd.get('source_type'),source_id:Number(fd.get('source_id')),notes:fd.get('notes')||null,items};
    const r=await fetch('/api/spare-parts-requests',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
    const data=await r.json().catch(()=>({}));
    if(!r.ok){msg.textContent=errText(data.detail,'تعذر حفظ الطلب');msg.className='msg err';return;}
    e.target.reset();document.getElementById('newItems').innerHTML='';msg.textContent='تم حفظ الطلب';msg.className='msg ok';document.getElementById('requestForm').style.display='none';load();
  }catch(err){console.error('create request error:',err);const msg=document.getElementById('formMsg');msg.textContent='خطأ غير متوقع: '+err.message;msg.className='msg err';}
});
document.getElementById('newItems').addEventListener('click',e=>{if(e.target.classList.contains('remove-request-item'))e.target.parentElement.remove();});

async function load(){
  const p=new URLSearchParams();
  if(document.getElementById('filterStatus').value)p.set('status',document.getElementById('filterStatus').value);
  if(document.getElementById('filterSource').value)p.set('source_type',document.getElementById('filterSource').value);
  const r=await fetch('/api/spare-parts-requests?'+p,{credentials:'same-origin'});
  const data=await r.json();
  document.getElementById('rows').innerHTML=data.length?data.map(row).join(''):'<tr><td colspan="7" class="empty">لا توجد طلبات.</td></tr>';
  document.getElementById('pendingCount').textContent='قيد الانتظار: '+data.filter(x=>x.status==='pending').length;
}

function row(x){
  const status='<select class="status" data-id="'+x.id+'">'+Object.entries(STATUS).map(([v,n])=>'<option value="'+v+'" '+(x.status===v?'selected':'')+'>'+n+'</option>').join('')+'</select>';
  const actions='<button type="button" class="secondary open-request" data-id="'+x.id+'">\u0641\u062a\u062d</button>'
    +'<details class="action-menu"><summary aria-label="\u0625\u062c\u0631\u0627\u0621\u0627\u062a \u0627\u0644\u0637\u0644\u0628">\u22ee</summary>'
    +'<div class="action-menu-items"><button type="button" class="danger delete-request" data-id="'+x.id+'">\u062d\u0630\u0641 \u0627\u0644\u0637\u0644\u0628</button></div></details>';
  return '<tr class="request-row" data-id="'+x.id+'">'
    +'<td><b>'+esc(x.request_number)+'</b></td>'
    +'<td>'+x.request_date+'</td>'
    +'<td>'+esc(SOURCE[x.source_type]||x.source_type)+'</td>'
    +'<td>'+esc(x.equipment_code||'\u2014')+'</td>'
    +'<td>'+esc(x.equipment_registration||'\u2014')+'</td>'
    +'<td>'+esc(x.report_number||'\u2014')+'</td>'
    +'<td>'+status+actions+'</td>'
    +'</tr>'
    +'<tr class="detail" id="d'+x.id+'"><td colspan="7"><div class="items" id="i'+x.id+'" data-em-ignore>'+detailHtml(x)+'</div></td></tr>';
}

function detailHtml(x){
  const ro=(k,v)=>'<div class="rf rf-ro"><span class="rf-k">'+esc(k)+'</span><span class="rf-v">'+esc(v??'—')+'</span></div>';
  const edi=(k,input)=>'<div class="rf"><span class="rf-k">'+esc(k)+'</span>'+input+'</div>';
  const canEditItems=x.status==='pending'||x.status==='approved';
  return '<div class="req-fields">'
    +edi('رقم وثيقة الطلب','<input class="f-number" value="'+esc(x.request_number)+'" placeholder="رقم وثيقة الطلب">')
    +edi('تاريخ الطلب','<input class="f-date" type="date" value="'+esc(x.request_date)+'">')
    +edi('تاريخ الاستلام','<input class="f-rdate" type="date" value="'+esc(x.received_date||'')+'">')
    +ro('المصدر',SOURCE[x.source_type]||x.source_type)
    +ro('العتاد',x.equipment_code)
    +ro('رقم التسجيل',x.equipment_registration)
    +ro('رقم التقرير',x.report_number)
    +ro('الحالة',STATUS[x.status]||x.status)
    +'</div>'
    +'<div class="rf rf-wide"><span class="rf-k">ملاحظات</span><textarea class="f-notes" rows="2" placeholder="ملاحظات الطلب">'+esc(x.notes||'')+'</textarea></div>'
    +'<div class="items-head"><b>بنود الطلب</b>'
    +(canEditItems?'<button type="button" class="secondary add-line">+ إضافة بند</button>':'')
    +(canEditItems?'':'<span class="line-note">لا يمكن تعديل البنود إلا لطلب قيد الانتظار أو معتمد</span>')
    +'</div>'
    +itemsHtml(x)
    +'<div class="detail-foot">'
    +'<button type="button" class="save-request" data-id="'+x.id+'">حفظ التعديلات</button>'
    +'<button type="button" class="secondary reload-detail">إلغاء التعديلات</button>'
    +'<button type="button" class="danger delete-request" data-id="'+x.id+'">حذف الطلب</button>'
    +'<span class="msg"></span>'
    +'</div>';
}

function itemsHtml(x){
  const head='<thead><tr><th>اسم قطعة الغيار</th><th>من المخزون (اختياري)</th><th>الكمية المطلوبة</th><th>الكمية المستلمة</th><th>تاريخ الاستلام</th><th>المستلم</th><th>المؤسسة الممونة</th><th>ملاحظات</th><th></th></tr></thead>';
  if(!x.items.length)return '<div class="table-scroll"><table class="items-t">'+head+'<tbody></tbody></table></div>';
  return '<div class="table-scroll"><table class="items-t">'+head+'<tbody>'+x.items.map(i=>itemRow(i,x)).join('')+'</tbody></table></div>';
}

function itemRow(i,x){
  const received=Number(i.received_quantity||0);
  const locked=received>0||x.status!=='pending';
  const options='<option value="">— بدون ربط —</option>'+PARTS.map((pid,k)=>'<option value="'+pid+'" '+(Number(pid)===Number(i.spare_part_id)?'selected':'')+'>'+esc(PART_NAMES[k]||'—')+(PART_NUMBERS[k]?' — '+esc(PART_NUMBERS[k]):'')+'</option>').join('');
  return '<tr class="item-line" data-item-id="'+(i.id||'')+'"'+(locked?' data-locked="1"':'')+'>'
    +'<td><input class="i-name" value="'+esc(i.part_name||'')+'" placeholder="اسم قطعة الغيار *""'+(locked?' disabled':'')+'></td>'
    +'<td><select class="i-part"'+(locked?' disabled':'')+'>'+options+'</select></td>'
    +'<td><input class="i-qty" type="number" min="1" step="1" value="'+esc(i.requested_quantity)+'"'+(locked?' disabled':'')+'></td>'
    +'<td><input class="received" type="number" min="1" step="1" value="'+(received>0?received:'')+'" placeholder="لم يُستلم بعد"></td>'
    +'<td><input class="i-rdate" type="date" value="'+esc(i.received_date||'')+'"></td>'
    +'<td><input class="i-recipient" value="'+esc(i.recipient||'')+'" placeholder="المستلم"></td>'
    +'<td><input class="i-supplier" value="'+esc(i.supplier_institution||'')+'" placeholder="المؤسسة الممونة"></td>'
    +'<td><input class="i-note" value="'+esc(i.notes||'')+'" placeholder="ملاحظات"></td>'
    +'<td><button type="button" class="secondary rm-line">حذف</button> <button type="button" class="secondary undo-line" style="display:none">تراجع</button></td>'
    +'</tr>';
}

async function deleteRequest(id){if(!confirm('حذف طلب الغيار؟ لا يمكن التراجع عن هذا الإجراء.'))return;const r=await fetch('/api/spare-parts-requests/'+id,{method:'DELETE',credentials:'same-origin'});if(r.ok)load();else alert(errText((await r.json()).detail,'تعذر حذف الطلب'));}



/* بند جديد داخل منطقة البنود: يُحفظ مع بقية التعديلات بزر الحفظ. */
function addLineRow(host){
  const body=host.querySelector('.items-t tbody');
  if(!body)return;
  const options='<option value="">— بدون ربط —</option>'+PARTS.map((pid,k)=>'<option value="'+pid+'">'+esc(PART_NAMES[k]||'—')+(PART_NUMBERS[k]?' — '+esc(PART_NUMBERS[k]):'')+'</option>').join('');
  const tr=document.createElement('tr');
  tr.className='item-line';tr.dataset.itemId='';
  tr.innerHTML='<td><input class="i-name" placeholder="اسم قطعة الغيار *"></td>'
    +'<td><select class="i-part">'+options+'</select></td>'
    +'<td><input class="i-qty" type="number" min="1" step="1" value="1"></td>'
    +'<td><input class="received" type="number" min="1" step="1" placeholder="لم يُستلم بعد"></td>'
    +'<td><input class="i-rdate" type="date"></td>'
    +'<td><input class="i-recipient" placeholder="المستلم"></td>'
    +'<td><input class="i-supplier" placeholder="المؤسسة الممونة"></td>'
    +'<td><input class="i-note" placeholder="ملاحظات"></td>'
    +'<td><button type="button" class="secondary rm-line">حذف</button> <button type="button" class="secondary undo-line" style="display:none">تراجع</button></td>';
  body.appendChild(tr);
  tr.querySelector('.i-name').focus();
}

function itemBody(tr){
  const name=tr.querySelector('.i-name').value.trim();
  const partRaw=tr.querySelector('.i-part').value;
  const qtyRaw=tr.querySelector('.i-qty').value;
  const receivedRaw=tr.querySelector('.received').value.trim();
  const recipient=tr.querySelector('.i-recipient').value.trim();
  const supplier=tr.querySelector('.i-supplier').value.trim();
  const rdate=tr.querySelector('.i-rdate').value;
  const note=tr.querySelector('.i-note').value.trim();
  if(!name&&!partRaw)return {error:'اسم قطعة الغيار مطلوب للبند'};
  const qty=Number(qtyRaw||0);
  if(!(Number.isInteger(qty)&&qty>0))return {error:'الكمية المطلوبة يجب أن تكون عدداً صحيحاً 1 فأكثر'};
  const received=receivedRaw?Number(receivedRaw):0;
  if(receivedRaw&&!(Number.isInteger(received)&&received>0))return {error:'الكمية المستلمة يجب أن تكون عدداً صحيحاً 1 فأكثر'};
  if(received>0&&(!rdate||!recipient||!supplier))return {error:'عند تسجيل استلام يجب إدخال تاريخ الاستلام والمستلم والمؤسسة الممونة'};
  const body={notes:note||null};
  body.spare_part_id=partRaw?Number(partRaw):null;
  body.part_name=name||null;
  body.requested_quantity=qty;
  if(received>0){body.received_quantity=received;body.received_date=rdate;body.recipient=recipient;body.supplier_institution=supplier;}
  return {body:body,received:received};
}

async function saveRequest(id,btn){
  const host=btn.closest('.items');
  if(!host){console.error('saveRequest: .items ancestor not found for button',btn);alert('خطأ: زر الحفظ خارج منطقة الطلب');return;}
  const msg=host.querySelector('.msg');
  const setMsg=(t,k)=>{msg.className='msg'+(k?' '+k:'');msg.textContent=t;};
  setMsg('جارٍ الحفظ...','');
  const number=host.querySelector('.f-number').value.trim();
  const date=host.querySelector('.f-date').value;
  const notes=host.querySelector('.f-notes').value.trim()||null;
  if(!number){setMsg('رقم وثيقة الطلب مطلوب','err');return;}
  if(!date){setMsg('تاريخ الطلب مطلوب','err');return;}

  const rows=[...host.querySelectorAll('tr.item-line')];
  const live=[],dropped=[];
  rows.forEach(tr=>{ (tr.classList.contains('gone')?dropped:live).push(tr); });

  /* الطلب يُستلم مرة واحدة: تاريخ واحد للطلب كله، يُكتب في رأسه أو في أي
     بند، ولا يصحّ أن تختلف التواريخ بين البنود. */
  const head=host.querySelector('.f-rdate');
  const headerDate=head?head.value.trim():'';
  const dates=[...new Set(live.map(tr=>{const i=tr.querySelector('.i-rdate');return i?i.value:'';}).filter(Boolean))];
  if(dates.length>1||(dates.length===1&&headerDate&&dates[0]!==headerDate)){setMsg(RECEIPT_CONFLICT,'err');return;}
  const receipt=headerDate||dates[0];
  if(receipt&&date&&receipt<date){setMsg(RECEIPT_BEFORE_REQUEST,'err');return;}

  const payloads=[];
  for(const tr of live){
    const parsed=itemBody(tr);
    if(parsed.error){setMsg(parsed.error,'err');return;}
    payloads.push({tr:tr,body:parsed.body,received:parsed.received});
  }

  /* منع التكرار قبل الإرسال: القاعدة نفسها في الخادم — المعرّف المرجعي إن وجد، وإلا الاسم الحرّ بصيغة الأحرف. */
  const identityOf=tr=>{
    const sel=tr.querySelector('.i-part'),inp=tr.querySelector('.i-name');
    const pid=Number(sel&&sel.value||0);
    const nm=String(inp?inp.value:'').trim().toLowerCase();
    return pid?'id:'+pid:'name:'+nm;
  };
  for(const p of payloads){
    if(p.tr.dataset.itemId)continue;
    const key=identityOf(p.tr);
    if([...host.querySelectorAll('tr.item-line')].some(o=>o!==p.tr&&!o.classList.contains('gone')&&identityOf(o)===key)){
      setMsg(DUPLICATE_PART,'err');
      return;
    }
  }

  try{
    const hr=await fetch('/api/spare-parts-requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({request_number:number,request_date:date,received_date:receipt||null,notes:notes})});
    if(!hr.ok){const d=await hr.json().catch(()=>({}));setMsg(errText(d,'تعذر حفظ بيانات الطلب'),'err');return;}

    for(const p of payloads){
      const itemId=p.tr.dataset.itemId;
      const body=Object.assign({},p.body);
      /* بند استُلم فعلاً: لا يُصفَّر سجل الاستلام، ولا تُعدَّل بيانات الاستلام إلا إن أدخلها المستخدم. */
      if(itemId&&p.received===0){
        delete body.received_quantity;delete body.received_date;delete body.recipient;delete body.supplier_institution;
      }
      /* البند المُقفل (مسجل استلاماً أو الطلب غير قيد الانتظار): تعيينه وكمية طلبه مقفلان، وإعادةها يرفضها الخادم، لأن الإحلال معنوع والحقلان أعيداً. */
      if(itemId&&p.tr.dataset.locked){
        delete body.spare_part_id;delete body.part_name;delete body.requested_quantity;
      }
      let r;
      if(itemId){
        r=await fetch('/api/spare-parts-requests/items/'+itemId,{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
      }else{
        r=await fetch('/api/spare-parts-requests/'+id+'/items',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
      }
      if(!r.ok){const d=await r.json().catch(()=>({}));setMsg(errText(d,'تعذر حفظ أحد البنود'),'err');return;}
    }

    for(const tr of dropped){
      const itemId=tr.dataset.itemId;
      if(!itemId)continue;
      const r=await fetch('/api/spare-parts-requests/items/'+itemId,{method:'DELETE',credentials:'same-origin'});
      if(!r.ok){const d=await r.json().catch(()=>({}));setMsg(errText(d,'تعذر حذف أحد البنود'),'err');return;}
    }
  }catch(err){
    setMsg('تعذر الاتصال بالخادم. أعد المحاولة.','err');
    return;
  }
  await load();
  const again=document.getElementById('i'+id);
  if(again){
    again.querySelector('.msg').className='msg ok';
    again.querySelector('.msg').textContent='تم حفظ التعديلات بنجاح';
  }
}
document.getElementById('rows').addEventListener('click',async e=>{
  const open=e.target.closest('.open-request');if(open){e.stopPropagation();document.getElementById('d'+open.dataset.id).classList.toggle('open');return;}
  const save=e.target.closest('.save-request');if(save){e.stopPropagation();try{await saveRequest(Number(save.dataset.id),save);}catch(err){console.error('saveRequest error:',err);alert('خطأ غير متوقع: '+err.message);}return;}
  const reload=e.target.closest('.reload-detail');if(reload){e.stopPropagation();await load();return;}
  const del=e.target.closest('.delete-request');if(del){e.stopPropagation();await deleteRequest(Number(del.dataset.id));return;}
  const add=e.target.closest('.add-line');if(add){e.stopPropagation();addLineRow(add.closest('.items'));return;}
  const rm=e.target.closest('.rm-line');if(rm){e.stopPropagation();rm.closest('tr').classList.add('gone');rm.closest('tr').querySelector('.undo-line').style.display='';return;}
  const undo=e.target.closest('.undo-line');if(undo){e.stopPropagation();undo.closest('tr').classList.remove('gone');undo.style.display='none';return;}
  const tr=e.target.closest('.request-row');if(tr&&!e.target.classList.contains('status'))document.getElementById('d'+tr.dataset.id).classList.toggle('open');
});
document.getElementById('rows').addEventListener('change',async e=>{
  if(!e.target.classList.contains('status'))return;
  const r=await fetch('/api/spare-parts-requests/'+e.target.dataset.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({status:e.target.value})});if(!r.ok)alert(errText((await r.json()).detail,'تعذر تغيير الحالة'));else load();
});
document.getElementById('filterStatus').addEventListener('change',load);document.getElementById('filterSource').addEventListener('change',load);
openRepairRequest();function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}load();
</script>
