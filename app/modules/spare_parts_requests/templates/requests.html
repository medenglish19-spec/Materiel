{% extends "base.html" %}
{% block title %}طلبات الغيار{% endblock %}
{% block content %}
<style>
.spr{direction:rtl}.spr .top{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:14px}.spr h1{margin:0;color:#183955;font-size:23px}.spr .muted{font-size:11px;color:#718096;margin-top:5px}.spr .panel{background:#fff;border:1px solid #e4eaf0;border-radius:10px;overflow:auto}.spr .bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px;border-bottom:1px solid #edf1f4}.spr button,.spr select,.spr input,.spr textarea{font:inherit;font-size:10px}.spr button{border:0;border-radius:6px;padding:8px 12px;background:#0875d1;color:#fff;font-weight:800;cursor:pointer}.spr .secondary{background:#fff;color:#245d88;border:1px solid #dce4ea}.spr select,.spr input,.spr textarea{border:1px solid #dce4ea;border-radius:6px;padding:7px;background:#fff}.spr table{width:100%;min-width:1050px;border-collapse:collapse}.spr th,.spr td{padding:10px;border-bottom:1px solid #edf1f4;text-align:right;font-size:10px;white-space:nowrap}.spr th{background:#f8fafc;color:#718096}.spr .request-row{cursor:pointer}.spr .request-row:hover{background:#fbfdff}.spr .badge{display:inline-flex;padding:4px 8px;border-radius:99px;background:#eef5fb;color:#245d88;font-weight:800}.spr .detail{display:none;background:#fafcfe}.spr .detail.open{display:table-row}.spr .items{padding:12px}.spr .items table{min-width:950px}.spr .empty{text-align:center;padding:30px;color:#8794a2}.spr .form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-bottom:1px solid #edf1f4}.spr .wide{grid-column:1/-1}.spr .req-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}.spr .rf{border:1px solid #e4eaf0;border-radius:6px;padding:6px 8px;background:#fff;display:flex;flex-direction:column;gap:2px;min-width:0}.spr .rf-k{font-size:9px;color:#718096}.spr .rf-v{font-size:10px;color:#183955;font-weight:700;word-break:break-word}.spr .items-t{width:100%;min-width:950px;margin-top:8px}.spr .items-t th{background:#f8fafc;color:#718096;padding:8px;font-size:10px;text-align:right;border-bottom:1px solid #edf1f4;white-space:nowrap}.spr .items-t td{padding:6px;font-size:10px;border-bottom:1px solid #edf1f4;white-space:nowrap}.spr .items-t input{width:100%;box-sizing:border-box}.spr .new-part-box{position:relative}.spr .new-part-suggest{display:none;position:absolute;z-index:30;top:100%;right:0;left:0;background:#fff;border:1px solid #dce4ea;border-radius:6px;box-shadow:0 6px 18px rgba(24,57,85,.12);max-height:190px;overflow:auto}.spr .new-part-suggest.open{display:block}.spr .new-part-opt{display:block;width:100%;text-align:right;background:#fff;color:#183955;border:0;border-bottom:1px solid #eef2f5;border-radius:0;padding:7px;cursor:pointer;font-weight:400}.spr .new-part-opt:hover{background:#f1f7fd}.spr .new-part-opt small{color:#8794a2}.spr .item-edit{display:grid;grid-template-columns:1.5fr .8fr 1.5fr auto;gap:6px;align-items:center;margin-top:8px}.spr .new-item{display:grid;grid-template-columns:1.5fr .8fr 1.5fr auto;gap:6px;align-items:center;margin-top:8px}.spr .item-line{display:grid;grid-template-columns:1.2fr .7fr .9fr 1fr 1.2fr auto;gap:6px;align-items:center;border-top:1px solid #edf1f4;padding:8px 0}.spr .item-line input{width:100%;box-sizing:border-box}.spr .detail-actions{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.spr .danger{background:#fff!important;color:#b42318!important;border:1px solid #f0c7c2!important}.spr .msg{padding:8px 10px;border-radius:6px;margin-top:8px;font-size:10px}.spr .msg.err{background:#fff1f0;color:#a61b12}.spr .msg.ok{background:#eef9f1;color:#247a3b}@media(max-width:800px){.spr .form{grid-template-columns:1fr 1fr}.spr .req-fields{grid-template-columns:1fr 1fr}}@media(max-width:520px){.spr .form{grid-template-columns:1fr}.spr .req-fields{grid-template-columns:1fr}}
</style>
<div class="spr">
  <div class="top"><div><h1>طلبات الغيار</h1><div class="muted">إدارة الطلبات المرتبطة بالأعطال والتصليحات وسجل الاستلام.</div></div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><a href="/spare-parts-received" class="secondary" style="text-decoration:none">سجل قطع الغيار المستلم</a><button id="newBtn">+ طلب غيار جديد</button></div></div>
  <div class="panel">
    <div class="bar">
      <select id="filterStatus"><option value="">كل الحالات</option><option value="pending">قيد الانتظار</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option><option value="cancelled">ملغى</option></select>
      <select id="filterSource"><option value="">كل المصادر</option><option value="fault">الأعطال</option><option value="repair">التصليحات</option></select>
      <span id="pendingCount" class="badge">قيد الانتظار: 0</span>
    </div>
    <form id="requestForm" class="form" style="display:none">
      <input name="request_number" id="requestNumber" placeholder="رقم وثيقة الطلب *" required>
      <select name="source_type" id="sourceType"><option value="">مصدر الطلب *</option><option value="fault">عطل</option><option value="repair">تصليح</option></select>
      <select name="source_id" id="sourceId" required><option value="">اختر المصدر *</option></select>
      <input name="request_date" id="requestDate" type="date" required>
      <input id="equipmentView" placeholder="رقم التسجيل" readonly>
      <textarea name="notes" id="requestNotes" class="wide" placeholder="ملاحظات"></textarea>
      <div class="wide">
        <b>بنود الطلب</b>
        <div id="newItems"></div>
        <button type="button" class="secondary" id="addRequestItem">+ إضافة بند</button>
      </div>
      <div class="wide"><button type="submit" id="saveRequest">حفظ الطلب</button><span id="formMsg"></span></div>
    </form>
    <table><thead><tr><th>رقم وثيقة الطلب</th><th>التاريخ</th><th>المصدر</th><th>العتاد</th><th>رقم التسجيل</th><th>رقم التقرير</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>
<script>
const PARTS={{ parts|map(attribute='id')|list|tojson }};
const PART_NAMES={{ parts|map(attribute='name')|list|tojson }};
const PART_NUMBERS={{ parts|map(attribute='part_number')|list|tojson }};
// اسم قطعة الغيار حقل نصي حر، والاقتراحات اختيارية: تُعرض مكتبة قطع الغيار
// كقائمة مرشّحات فقط. إن طابق الاسم قطعة واحدة من المكتبة رُبط البند بها عبر
// spare_part_id، وإلا حُفظ الاسم نصاً حراً دون إنشاء قطعة في المكتبة.
(function(){const dl=document.createElement('datalist');dl.id='partSuggestions';dl.innerHTML=PARTS.map((id,i)=>'<option value="'+esc(PART_NAMES[i]||'')+'" label="'+esc(PART_NUMBERS[i]||'')+'"></option>').join('');document.body.appendChild(dl);})();
function partIdByName(name){const t=String(name??'').trim();const i=PART_NAMES.findIndex(n=>String(n??'').trim()===t);return i>=0?PARTS[i]:null;}
// أخطاء التحقق من FastAPI تصل مصفوفة كائنات: عرضها كما هي ينتج
// «[object Object]» فيظهر للمستخدم رسالة بلا معنى.
const FIELD={spare_part_id:'اسم قطعة الغيار',spare_part_name:'اسم قطعة الغيار',requested_quantity:'الكمية المطلوبة',received_quantity:'الكمية المستلمة',received_date:'تاريخ الاستلام',recipient:'المستلم',supplier_institution:'المؤسسة الممونة',notes:'ملاحظات',request_number:'رقم وثيقة الطلب',request_date:'تاريخ الطلب',source_type:'مصدر الطلب',source_id:'المصدر',items:'بنود الطلب',received:'الكمية المستلمة'};
function errText(data,fallback){
  const d=data&&data.detail;
  if(!d)return fallback;
  if(typeof d==='string')return d;
  if(!Array.isArray(d))return String(d);
  const lines=[...new Set(d.map(e=>{
    const parts=Array.isArray(e.loc)?e.loc.filter(x=>x!=='body'):[];
    const field=FIELD[parts[parts.length-1]]||parts.join(' → ');
    const where=parts.length>1?field+' ('+parts.slice(0,-1).map(x=>typeof x==='number'?'بند '+(x+1):(FIELD[x]||x)).join(' ')+')':field;
    return where?where+': '+e.msg:e.msg;
  }))];
  return lines.join(' — ')||fallback;
}
const STATUS={pending:'قيد الانتظار',approved:'مقبول',rejected:'مرفوض',cancelled:'ملغى'};
const SOURCE={fault:'الأعطال',repair:'التصليحات'};
const sourceType=document.getElementById('sourceType'),sourceId=document.getElementById('sourceId'),requestDate=document.getElementById('requestDate'),equipmentView=document.getElementById('equipmentView');
const repairId=new URLSearchParams(location.search).get('repair_id');

async function loadSources(){
  sourceId.innerHTML='<option value="">اختر المصدر *</option>';
  if(!sourceType.value)return;
  const r=await fetch('/api/spare-parts-requests/sources/'+sourceType.value,{credentials:'same-origin'});
  const data=await r.json();
  data.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent='#'+x.id+' — '+x.report_number+' — '+x.registration_number;o.dataset.date=x.date;o.dataset.registration=x.registration_number;sourceId.appendChild(o);});
}
sourceType.addEventListener('change',loadSources);
sourceId.addEventListener('change',()=>{const o=sourceId.options[sourceId.selectedIndex];if(!o||!o.value)return;requestDate.value=o.dataset.date||'';equipmentView.value=o.dataset.registration||'—';});

document.getElementById('newBtn').addEventListener('click',()=>{const f=document.getElementById('requestForm');f.style.display=f.style.display==='none'?'grid':'none';});

async function openRepairRequest(){
  if(!repairId)return;
  const f=document.getElementById('requestForm');f.style.display='grid';sourceType.value='repair';await loadSources();sourceId.value=repairId;sourceId.dispatchEvent(new Event('change'));
}

function addRequestItemRow(){
  const wrap=document.createElement('div');wrap.className='new-item';
  wrap.innerHTML='<input class="new-part" list="partSuggestions" placeholder="اسم قطعة الغيار *" autocomplete="off" required><input class="new-qty" type="number" min="1" step="1" placeholder="الكمية المطلوبة *" required><input class="new-note" placeholder="ملاحظات"><button type="button" class="secondary remove-request-item">حذف</button>';
  document.getElementById('newItems').appendChild(wrap);
}
document.getElementById('addRequestItem').addEventListener('click',addRequestItemRow);

document.getElementById('requestForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const rows=[...document.querySelectorAll('#newItems .new-item')];
  const items=rows.map(row=>{const name=row.querySelector('.new-part').value.trim();return {spare_part_id:partIdByName(name),spare_part_name:name||null,requested_quantity:Number(row.querySelector('.new-qty').value||0),notes:row.querySelector('.new-note').value||null};}).filter(x=>x.spare_part_name&&x.requested_quantity>0);
  const msg=document.getElementById('formMsg');
  if(!rows.length){msg.textContent='أضف بندًا واحدًا على الأقل';msg.className='msg err';return;}
  if(items.length<rows.length){msg.textContent='أكمل كل بند: اكتب اسم قطعة الغيار وأدخل الكمية قبل الحفظ';msg.className='msg err';return;}
  const body={request_number:fd.get('request_number'),request_date:fd.get('request_date'),source_type:fd.get('source_type'),source_id:Number(fd.get('source_id')),notes:fd.get('notes')||null,items};
  const r=await fetch('/api/spare-parts-requests',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok){msg.textContent=errText(data,'تعذر حفظ الطلب');msg.className='msg err';return;}
  e.target.reset();document.getElementById('newItems').innerHTML='';msg.textContent='تم حفظ الطلب';msg.className='msg ok';document.getElementById('requestForm').style.display='none';load();
});
document.getElementById('newItems').addEventListener('click',e=>{if(e.target.classList.contains('remove-request-item'))e.target.parentElement.remove();});

async function load(){
  const p=new URLSearchParams();
  if(document.getElementById('filterStatus').value)p.set('status',document.getElementById('filterStatus').value);
  if(document.getElementById('filterSource').value)p.set('source_type',document.getElementById('filterSource').value);
  const r=await fetch('/api/spare-parts-requests?'+p,{credentials:'same-origin'});
  const data=await r.json();
  document.getElementById('rows').innerHTML=data.length?data.map(row).join(''):'<tr><td colspan="7" class="empty">لا توجد طلبات.</td></tr>';
  document.getElementById('pendingCount').textContent='قيد الانتظار: '+data.filter(x=>x.status==='pending').length;
}

function row(x){
  return '<tr class="request-row" data-id="'+x.id+'"><td><b>'+esc(x.request_number)+'</b></td><td>'+x.request_date+'</td><td>'+esc(SOURCE[x.source_type]||x.source_type)+'</td><td>'+esc(x.equipment_code||'—')+'</td><td>'+esc(x.equipment_registration||'—')+'</td><td>'+esc(x.report_number||'—')+'</td><td><select class="status" data-id="'+x.id+'">'+Object.entries(STATUS).map(([v,n])=>'<option value="'+v+'" '+(x.status===v?'selected':'')+'>'+n+'</option>').join('')+'</select></td></tr><tr class="detail" id="d'+x.id+'"><td colspan="7"><div class="items" id="i'+x.id+'">'+detailHtml(x)+'</div></td></tr>';
}

function detailHtml(x){
  const fields=[['رقم وثيقة الطلب',x.request_number],['التاريخ',x.request_date],['المصدر',SOURCE[x.source_type]||x.source_type],['العتاد',x.equipment_code],['رقم التسجيل',x.equipment_registration],['رقم التقرير',x.report_number],['الحالة',STATUS[x.status]||x.status]];
  if(x.notes)fields.push(['ملاحظات',x.notes]);
  const canAddItem=x.status==='pending'||x.status==='approved';
  return '<div class="detail-actions"><button type="button" class="secondary edit-request" data-id="'+x.id+'">تعديل الطلب</button><button type="button" class="danger delete-request" data-id="'+x.id+'">حذف الطلب</button>'+(canAddItem?'<button type="button" class="secondary" onclick="showAddItem('+x.id+',this)">+ إضافة بند</button>':'')+'</div><div class="req-fields">'+fields.map(([k,v])=>'<div class="rf"><span class="rf-k">'+esc(k)+'</span><span class="rf-v">'+esc(v??'—')+'</span></div>').join('')+'</div><b>بنود الطلب</b>'+itemsHtml(x);
}

function itemsHtml(x){
  if(!x.items.length)return '<div class="empty">لم تضاف بنود بعد.</div>';
  return '<table class="items-t"><thead><tr><th>قطعة الغيار</th><th>الكمية المطلوبة</th><th>الكمية المستلمة</th><th>تاريخ الاستلام</th><th>المستلم</th><th>المؤسسة الممونة</th><th></th></tr></thead><tbody>'+x.items.map(i=>'<tr><td>'+esc(i.part_name||'—')+'</td><td>'+esc(i.requested_quantity)+'</td><td>'+esc(i.received_quantity||0)+'</td><td>'+esc(i.received_date||'—')+'</td><td>'+esc(i.recipient||'—')+'</td><td>'+esc(i.supplier_institution||'—')+'</td><td><button type="button" class="secondary" onclick="editItem('+i.id+',this)">تعديل البند</button> <button type="button" class="danger" onclick="deleteItem('+i.id+')">حذف البند</button></td></tr>').join('')+'</tbody></table>';
}

async function showAddItem(requestId,btn){
  const host=btn.closest('.items');if(!host)return;if(host.querySelector('.add-item-line'))return;
  const box=document.createElement('div');box.className='add-item-line';box.style.cssText='display:grid;grid-template-columns:1.5fr .8fr 1.5fr auto;gap:6px;align-items:center;margin-top:8px';
  box.innerHTML='<input class="add-part" list="partSuggestions" placeholder="اسم قطعة الغيار *" autocomplete="off"><input class="add-qty" type="number" min="1" step="1" placeholder="الكمية المطلوبة *"><input class="add-note" placeholder="ملاحظات"><span><button type="button" class="secondary" onclick="saveNewItem('+requestId+',this)">حفظ</button> <button type="button" class="secondary" onclick="this.closest(\'.add-item-line\').remove()">إلغاء</button></span>';
  host.appendChild(box);
}

async function saveNewItem(requestId,btn){
  const box=btn.closest('.add-item-line');if(!box)return;
  const name=box.querySelector('.add-part').value.trim(),qty=Number(box.querySelector('.add-qty').value||0);
  if(!name){alert('اكتب اسم قطعة الغيار');return;} if(!Number.isInteger(qty)||qty<=0){alert('الكمية المطلوبة يجب أن تكون عدداً صحيحاً 1 فأكثر');return;}
  const body={spare_part_id:partIdByName(name),spare_part_name:name,requested_quantity:qty,received_quantity:0,received_date:null,recipient:null,supplier_institution:null,notes:box.querySelector('.add-note').value.trim()||null};
  const r=await fetch('/api/spare-parts-requests/'+requestId+'/items',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok){alert(errText(data,'تعذر إضافة البند'));return;}load();
}

async function editRequest(id){
  const r=await fetch('/api/spare-parts-requests/'+id,{credentials:'same-origin'});if(!r.ok){alert(errText(await r.json(),'تعذر تحميل الطلب'));return;}const x=await r.json();
  const number=prompt('رقم وثيقة الطلب',x.request_number);if(number===null)return;const date=prompt('تاريخ الطلب (YYYY-MM-DD)',x.request_date);if(date===null)return;const notes=prompt('ملاحظات',x.notes||'');if(notes===null)return;
  const u=await fetch('/api/spare-parts-requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({request_number:number.trim(),request_date:date,notes:notes||null})});if(u.ok)load();else alert(errText(await u.json(),'تعذر تعديل الطلب'));
}
async function deleteRequest(id){if(!confirm('حذف طلب الغيار؟ لا يمكن التراجع عن هذا الإجراء.'))return;const r=await fetch('/api/spare-parts-requests/'+id,{method:'DELETE',credentials:'same-origin'});if(r.ok)load();else alert(errText(await r.json(),'تعذر حذف الطلب'));}
async function editItem(id,btn){
  const row=btn.closest('tr');if(!row)return;const r=await fetch('/api/spare-parts-requests/items/'+id,{credentials:'same-origin'});if(!r.ok){alert(errText(await r.json(),'تعذر تحميل البند'));return;}const item=await r.json(),received=Number(item.received_quantity||0);
  row.innerHTML='<td><input class="edit-part" list="partSuggestions" style="min-width:180px" autocomplete="off" value="'+esc(item.part_name||'')+'"></td><td><input class="edit-requested" type="number" min="1" step="1" value="'+esc(item.requested_quantity)+'"></td><td><input class="edit-received" type="number" min="0" step="1" value="'+esc(received)+'"></td><td><input class="edit-received-date" type="date" value="'+esc(item.received_date||'')+'"></td><td><input class="edit-recipient" value="'+esc(item.recipient||'')+'" placeholder="المستلم"></td><td><input class="edit-supplier" value="'+esc(item.supplier_institution||'')+'" placeholder="المؤسسة الممونة"></td><td><input class="edit-notes" value="'+esc(item.notes||'')+'" placeholder="ملاحظات"><button type="button" class="secondary" onclick="saveEditedItem('+id+',this)">حفظ</button> <button type="button" class="secondary" onclick="load()">إلغاء</button></td>';
  if(received>0){row.querySelector('.edit-part').disabled=true;row.querySelector('.edit-requested').disabled=true;}
}
async function saveEditedItem(id,btn){
  const row=btn.closest('tr');if(!row)return;const qty=Number(row.querySelector('.edit-requested').value),received=Number(row.querySelector('.edit-received').value||0),name=row.querySelector('.edit-part').value.trim();
  if(!name){alert('اكتب اسم قطعة الغيار');return;}if(!Number.isInteger(qty)||qty<=0){alert('الكمية المطلوبة يجب أن تكون عدداً صحيحاً 1 فأكثر');return;}if(!Number.isInteger(received)||received<0){alert('الكمية المستلمة يجب أن تكون عدداً صحيحاً 0 فأكثر');return;}
  const body={spare_part_id:partIdByName(name),spare_part_name:name,requested_quantity:qty,received_quantity:received,received_date:row.querySelector('.edit-received-date').value||null,recipient:row.querySelector('.edit-recipient').value.trim()||null,supplier_institution:row.querySelector('.edit-supplier').value.trim()||null,notes:row.querySelector('.edit-notes').value.trim()||null};
  if(received===0){body.received_date=null;body.recipient=null;body.supplier_institution=null;}
  const r=await fetch('/api/spare-parts-requests/items/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});if(r.ok)load();else alert(errText(await r.json(),'تعذر تعديل البند'));
}
async function deleteItem(id){if(!confirm('حذف بند قطع الغيار؟'))return;const r=await fetch('/api/spare-parts-requests/items/'+id,{method:'DELETE',credentials:'same-origin'});if(r.ok)load();else alert(errText(await r.json(),'تعذر حذف البند'));}
async function saveItem(id,btn){
  const root=btn.closest('tr');if(!root)return;const raw=root.querySelector('.received').value.trim(),qty=Number(raw||0);
  if(raw&&!(Number.isInteger(qty)&&qty>0)){alert('الكمية المستلمة يجب أن تكون عدداً صحيحاً 1 فأكثر');return;}
  const body={received_date:root.querySelector('.received-date').value||null,recipient:root.querySelector('.recipient').value||null,supplier_institution:root.querySelector('.supplier').value||null};
  if(qty>0)body.received_quantity=qty;
  const r=await fetch('/api/spare-parts-requests/items/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});if(r.ok)load();else alert(errText(await r.json(),'تعذر حفظ البند'));
}
document.getElementById('rows').addEventListener('click',e=>{
  const edit=e.target.closest('.edit-request');if(edit){e.stopPropagation();editRequest(Number(edit.dataset.id));return;}
  const del=e.target.closest('.delete-request');if(del){e.stopPropagation();deleteRequest(Number(del.dataset.id));return;}
  const tr=e.target.closest('.request-row');if(tr&&!e.target.classList.contains('status'))document.getElementById('d'+tr.dataset.id).classList.toggle('open');
});
document.getElementById('rows').addEventListener('change',async e=>{
  if(!e.target.classList.contains('status'))return;
  const r=await fetch('/api/spare-parts-requests/'+e.target.dataset.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({status:e.target.value})});if(!r.ok)alert(errText(await r.json(),'تعذر تغيير الحالة'));else load();
});
document.getElementById('filterStatus').addEventListener('change',load);document.getElementById('filterSource').addEventListener('change',load);
openRepairRequest();function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}load();
</script>
{% endblock %}
