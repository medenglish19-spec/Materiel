{% extends "base.html" %}
{% block title %}طلبات قطع الغيار{% endblock %}
{% block content %}
<div dir="rtl" style="max-width:1200px;margin:auto">
<style>
.spr-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.spr-sub{font-size:11px;color:#718096;margin-top:5px}.spr-actions{display:flex;gap:7px;flex-wrap:wrap}.spr-btn{padding:8px 12px;border:1px solid #dce4ea;border-radius:7px;background:#fff;color:#245d88;text-decoration:none;font-size:10px;font-weight:800}.spr-btn.primary{background:#0875d1;color:#fff;border-color:#0875d1}.spr-panel{background:#fff;border:1px solid #e4eaf0;border-radius:10px;overflow:auto}.spr-filter{display:flex;gap:7px;align-items:center;padding:11px;border-bottom:1px solid #edf1f4}.spr-filter select{height:32px;border:1px solid #dce4ea;border-radius:6px;padding:0 8px;font:inherit;font-size:10px}.spr-table{width:100%;min-width:850px;border-collapse:collapse}.spr-table th,.spr-table td{padding:10px;border-bottom:1px solid #edf1f4;text-align:right;font-size:10px}.spr-table th{background:#f8fafc;color:#718096}.spr-badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef5fb;color:#245d88;font-size:9px;font-weight:800}.spr-empty{text-align:center;padding:28px;color:#8a96a3}.spr-source{color:#526273;font-weight:700}.spr-count{display:inline-flex;min-width:26px;height:26px;align-items:center;justify-content:center;border-radius:8px;background:#f1f6fa;color:#245d88;font-weight:800;font-size:10px}@media(max-width:650px){.spr-head{align-items:flex-start;flex-direction:column;gap:9px}}
</style>
<div class="spr-head"><div><h1 style="margin:0;color:#183955;font-size:23px">طلبات قطع الغيار</h1><div class="spr-sub">وحدة مستقلة تجمع طلبات القطع من الصيانة والتصليحات والإطارات والبطاريات في سجل واحد.</div></div></div>
<div class="spr-panel">
<div class="spr-filter"><select id="source"><option value="">كل المصادر</option><option value="maintenance">الصيانة</option><option value="repair">التصليحات</option><option value="tire">الإطارات</option><option value="battery">البطاريات</option></select><select id="status"><option value="">كل الحالات</option><option value="pending">قيد الانتظار</option><option value="approved">معتمد</option><option value="partially_fulfilled">جزئي</option><option value="fulfilled">مكتمل</option><option value="rejected">مرفوض</option><option value="cancelled">ملغى</option></select><span class="spr-count" id="pendingCount">—</span><span style="font-size:10px;color:#718096">طلبات قيد المتابعة</span></div>
<table class="spr-table"><thead><tr><th>الطلب</th><th>التاريخ</th><th>المصدر</th><th>العتاد</th><th>الأولوية</th><th>الحالة</th><th>عدد البنود</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="spr-empty">جارٍ التحميل...</td></tr></tbody></table>
</div>
</div>
<script>
(async function(){
const rows=document.getElementById('rows'),source=document.getElementById('source'),status=document.getElementById('status'),count=document.getElementById('pendingCount');
const sourceNames={maintenance:'الصيانة',repair:'التصليحات',tire:'الإطارات',battery:'البطاريات'};
const statusNames={pending:'قيد الانتظار',approved:'معتمد',partially_fulfilled:'جزئي',fulfilled:'مكتمل',rejected:'مرفوض',cancelled:'ملغى'};
async function load(){
 const p=new URLSearchParams(); if(source.value)p.set('source_type',source.value); if(status.value)p.set('status',status.value);
 const r=await fetch('/api/spare-parts-requests?'+p,{credentials:'same-origin'}); const data=await r.json();
 rows.innerHTML=data.length?data.map(x=>'<tr><td><b>'+x.request_number+'</b></td><td>'+x.request_date+'</td><td class="spr-source">'+sourceNames[x.source_type]+'</td><td>'+(x.equipment_id||'—')+'</td><td>'+x.priority+'</td><td><span class="spr-badge">'+statusNames[x.status]+'</span></td><td>'+x.items.length+'</td></tr>').join(''):'<tr><td colspan="7" class="spr-empty">لا توجد طلبات.</td></tr>';
}
async function loadCount(){const r=await fetch('/api/spare-parts-requests/stats/pending-count',{credentials:'same-origin'});count.textContent=(await r.json()).count}
source.onchange=load;status.onchange=load;load();loadCount();
})();
</script>
{% endblock %}
