{% extends "base.html" %}
{% block title %}تاريخ الغيار{% endblock %}
{% block content %}
<style>
.hist{direction:rtl}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.hist h1{margin:0;color:#183955;font-size:22px}.muted{font-size:11px;color:#718096}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.card{background:#fff;border:1px solid #e4eaf0;border-radius:9px;padding:10px}.label{font-size:9px;color:#718096}.value{font-size:12px;font-weight:800;color:#26475e;margin-top:4px}.panel{background:#fff;border:1px solid #e4eaf0;border-radius:10px;overflow:hidden;margin-top:12px}.panel h2{font-size:13px;color:#35566e;margin:0;padding:11px;border-bottom:1px solid #edf1f4}.pad{padding:11px}.timeline{display:flex;flex-direction:column;gap:8px}.event{border:1px solid #e4eaf0;border-radius:8px;padding:10px;background:#fbfcfd}.event .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;color:#245d88}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:7px;font-size:10px}.link{color:#245d88;font-weight:800;text-decoration:none}@media(max-width:800px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.cards,.grid{grid-template-columns:1fr}}
</style>
<div class="hist">
<div class="head"><div><h1>تاريخ الغيار</h1><div class="muted">السجل الكامل للبند من سبب الطلب حتى آخر حركة.</div></div><a class="link" href="javascript:history.back()">← رجوع</a></div>
<div id="content"><div class="panel"><div class="pad">جارٍ التحميل...</div></div></div>
</div>
<script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/api/spare-parts-movements/history/{{ request_item_id }}');if(!r.ok){document.getElementById('content').innerHTML='<div class="panel"><div class="pad">تعذر تحميل تاريخ الغيار.</div></div>';return}const x=await r.json(),i=x.item,q=x.request;document.getElementById('content').innerHTML='<div class="cards"><div class="card"><div class="label">الغيار</div><div class="value">'+esc(i.part_name)+'</div></div><div class="card"><div class="label">المستلم</div><div class="value">'+esc(x.balances.received_quantity)+'</div></div><div class="card"><div class="label">الموزع</div><div class="value">'+esc(x.balances.distributed)+'</div></div><div class="card"><div class="label">الباقي</div><div class="value">'+esc(x.balances.remaining)+'</div></div><div class="card"><div class="label">المرتجع</div><div class="value">'+esc(x.balances.returned)+'</div></div></div><div class="panel"><h2>مصدر طلب الغيار</h2><div class="pad"><div class="grid"><div><b>رقم الطلب</b><br>'+esc(q.number)+'</div><div><b>تاريخ الطلب</b><br>'+esc(q.date)+'</div><div><b>المصدر</b><br>'+esc(q.source_type)+'</div><div><b>رقم البلاغ</b><br>'+esc(q.report_number)+'</div></div><div style="margin-top:9px"><b>سبب الطلب</b><br>'+esc(q.reason)+'</div></div></div><div class="panel"><h2>الاستلام</h2><div class="pad"><div class="grid"><div><b>تاريخ الاستلام</b><br>'+esc(i.received_date)+'</div><div><b>الجهة المستلمة</b><br>'+esc(i.recipient)+'</div><div><b>الهيئة الممونة</b><br>'+esc(i.supplier_institution)+'</div><div><b>الكمية</b><br>'+esc(i.received_quantity)+'</div></div></div></div><div class="panel"><h2>التوزيع والإرجاع</h2><div class="pad"><div class="timeline">'+(x.movements.length?x.movements.map(d=>'<div class="event"><div class="top"><span>'+(d.document_type==='distribution'?'توزيع':'إرجاع')+' — '+esc(d.document_number)+'</span><span>'+esc(d.document_date)+'</span></div><div class="grid"><div><b>الجهة المستلمة</b><br>'+esc(d.recipient)+'</div><div><b>الجهة الأخرى</b><br>'+esc(d.issuer)+'</div><div><b>الكمية</b><br>'+esc(d.items.find(z=>z.request_item_id===i.id)?.quantity)+'</div><div><b>الوثيقة المرجعية</b><br>'+esc(d.source_document_id||'—')+'</div></div><div style="margin-top:7px">'+esc(d.notes||'')+'</div></div>').join(''):'<div>لا توجد حركات بعد الاستلام.</div>')+'</div></div></div>'}
load();
</script>
{% endblock %}
