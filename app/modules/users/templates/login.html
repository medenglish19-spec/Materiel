<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - تسيير ومحاسبة العتاد</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-box">
        <h1>تسيير ومحاسبة العتاد</h1>
        <p class="subtitle">تسجيل الدخول</p>

        {% if password_changed %}
        <div role="status" style="margin-bottom:14px;padding:10px;border:1px solid #b7dfc3;border-radius:8px;background:#eef8f0;color:#216b37">تم تحديث كلمة المرور. سجّل الدخول باستخدام كلمة المرور الجديدة.</div>
        {% endif %}

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">دخول</button>
        </form>
    </div>
</body>
</html>
