<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعداد مواضع الإطارات</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:30px auto;padding:0 18px}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;border:1px solid #e5e9f0}.model{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee}.model:last-child{border-bottom:0}a{color:#175cd3;text-decoration:none}</style></head><body><div class="wrap"><p><a href="/tires">← الإطارات</a></p><div class="panel"><h1>إعداد مواضع الإطارات حسب الطراز</h1><p>المواضع تُعرّف مرة واحدة للطراز، ثم ترثها جميع العربات التابعة له.</p>{% for model in models %}<div class="model"><span>{{ model.brand.name ~ ' — ' if model.brand else '' }}{{ model.name }}</span><a href="/tires/models/{{ model.id }}/configuration">فتح إعداد الإطارات</a></div>{% else %}<p>لا توجد طُرز.</p>{% endfor %}</div></div></body></html>
