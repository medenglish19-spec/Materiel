<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مواضع الإطارات</title><style>body{font-family:Arial;background:#f5f7fb}.wrap{max-width:900px;margin:30px auto;padding:0 18px}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px}form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}input,button{padding:10px;border:1px solid #ddd;border-radius:10px;font:inherit}button{background:#172033;color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}@media(max-width:700px){form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="/tires">← الإطارات</a></p><div class="panel"><h1>مرجع مواقع الإطارات</h1><form method="post" action="/tires/positions"><input name="code" placeholder="رمز الموضع" required><input name="name" placeholder="اسم الموضع" required><input name="description" placeholder="وصف"><input name="sort_order" type="number" value="0"><button>إضافة</button></form></div><div class="panel"><table><tr><th>الرمز</th><th>الموضع</th><th>الوصف</th><th>الترتيب</th></tr>{% for p in positions %}<tr><td>{{ p.code }}</td><td>{{ p.name }}</td><td>{{ p.description or '-' }}</td><td>{{ p.sort_order }}</td></tr>{% endfor %}</table></div></div></body></html>
