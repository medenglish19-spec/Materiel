{% macro category_editor(c) %}<form method="post" action="/equipment-types/categories/{{ c.id }}/update" class="md-inline"><input name="name" value="{{ c.name }}" required maxlength="100" aria-label="اسم الفئة"><input name="code" value="{{ c.code }}" maxlength="30" aria-label="رمز الفئة"><button class="md-btn md-mini" type="submit">حفظ</button></form>{% endmacro %}
{% macro brand_editor(b) %}<form method="post" action="/equipment-types/brands/{{ b.id }}/update" class="md-inline"><input name="name" value="{{ b.name }}" required maxlength="100" aria-label="اسم العلامة"><button class="md-btn md-mini" type="submit">حفظ</button></form>{% endmacro %}
{% macro type_editor(t) %}<form method="post" action="/equipment-types/{{ t.id }}/update" class="md-form"><div class="md-grid2"><div class="md-field"><label>اسم النوع</label><input name="name" value="{{ t.name }}" required maxlength="80"></div><div class="md-field"><label>الفئة</label><select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if t.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div></div><div class="md-grid2"><div class="md-field"><label>وحدة القياس</label><select name="measurement_unit" {% if t.models|length %}disabled{% endif %}><option value="km" {% if t.measurement_unit=="km" %}selected{% endif %}>كم</option><option value="hours" {% if t.measurement_unit=="hours" %}selected{% endif %}>ساعة</option></select>{% if t.models|length %}<input type="hidden" name="measurement_unit" value="{{ t.measurement_unit }}">{% endif %}</div><div class="md-field"><label>التعداد النظري</label><input type="number" name="theoretical_quantity" min="0" value="{{ t.theoretical_quantity if t.theoretical_quantity is not none else '' }}"></div></div><button class="md-btn primary md-save" type="submit">حفظ تعديلات النوع</button></form>{% endmacro %}
